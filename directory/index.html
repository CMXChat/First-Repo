<!DOCTYPE html>

<body>
<header class="topbar"><a class="brand" data-cmx-unlinked="/" aria-label="Return to CMX Restricted Node"><div class="logo">CMX</div><div class="title">Operations Directory</div></a><span class="chip">SESSION <b id="sid"></b></span></header>
<main class="shell">
<section class="intro"><span class="kicker">CMX Restricted Node</span><h1>Operations Directory</h1><p id="summary">Loading the approved route registry.</p></section>
<nav class="cards" id="cards" aria-label="Approved tools"></nav>
<div class="error" id="error" hidden>Route registry could not be loaded. Return to the restricted node and try again.</div>
</main>
<footer class="footer">CMX // ROUTE REGISTRY v1</footer>
<script>
document.getElementById('sid').textContent=Math.random().toString(36).slice(2,10).toUpperCase();
let cards=[],active=0;
function esc(value){return String(value).replace(/[&<>"']/g,(char)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function setActive(index){if(!cards.length)return;active=(index+cards.length)%cards.length;cards.forEach((card,i)=>card.classList.toggle('active',i===active));cards[active].focus({preventScroll:true})}
async function init(){
  try{
    const registry=await window.CMXRouteRegistry.load();
    const routes=window.CMXRouteRegistry.directoryRoutes(registry);
    document.getElementById('summary').textContent=`${routes.length} approved tools are currently listed. Use number keys, arrow keys or select a card.`;
    const container=document.getElementById('cards');
    container.innerHTML=routes.map((route,index)=>`<a class="card${index===0?' active':''}" href="${esc(route.path)}" data-index="${index}"><span class="hotkey">${esc(route.hotkey||index+1)}</span><h2>${esc(route.name)}</h2><p>${esc(route.description)}</p><span class="path">db.cmxchat.com${esc(route.path)}</span><span class="arrow">→</span></a>`).join('');
    cards=[...container.querySelectorAll('.card')];
    cards.forEach((card,index)=>card.addEventListener('focus',()=>{active=index;cards.forEach((item,i)=>item.classList.toggle('active',i===index))}));
    window.addEventListener('keydown',(event)=>{
      const numeric=Number(event.key);
      if(Number.isInteger(numeric)&&numeric>0&&numeric<=cards.length)setActive(numeric-1);
      else if(event.key==='ArrowRight'||event.key==='ArrowDown')setActive(active+1);
      else if(event.key==='ArrowLeft'||event.key==='ArrowUp')setActive(active-1);
      else if(event.key==='Enter'&&cards[active])window.location.href=cards[active].href;
    });
  }catch(error){document.getElementById('summary').textContent='Approved tools';document.getElementById('error').hidden=false;console.error(error)}
}
window.addEventListener('DOMContentLoaded',init,{once:true});
</script>
<script src="/assets/cmx-page-standard.js?v=20260731-1" defer></script>
</body>
</html>
