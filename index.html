<body>
  <div id="boot" aria-live="polite">
    <section class="boot-window" aria-label="Node startup sequence">
      <div class="window-bar">
        <span class="dot red"></span><span class="dot amber"></span><span class="dot blue"></span>
        <span class="window-title">node-init · restricted bootstrap</span>
      </div>
      <div id="bootBody" class="boot-body"></div>
    </section>
  </div>

  <main id="gate" class="hidden">
    <section class="gate-shell" aria-labelledby="gateTitle">
      <div class="window-bar">
        <span class="dot red"></span><span class="dot amber"></span><span class="dot blue"></span>
        <span class="window-title">restricted node · authentication</span>
      </div>
      <div class="gate-body">
        <header class="gate-brand">
          <div class="gate-emblem" aria-hidden="true">CMX</div>
          <div class="gate-brand-copy">
            <div class="gate-kicker">Restricted user node</div>
            <div class="gate-host">authorization required</div>
          </div>
        </header>

        <h1 id="gateTitle" class="gate-title">Authentication required</h1>
        <p id="gateCopy" class="gate-copy">Authenticate to continue.</p>

        <div id="setupFields" class="hidden" hidden aria-hidden="true">
          <input id="setupUser" value="admin" readonly tabindex="-1" />
          <input id="setupPassword" type="password" tabindex="-1" />
          <input id="setupConfirm" type="password" tabindex="-1" />
          <button id="createVaultBtn" type="button" tabindex="-1">Unavailable</button>
        </div>

        <div id="loginFields" class="hidden">
          <div class="field">
            <label for="loginUser">User</label>
            <div class="input-shell"><span class="input-prefix">login</span><input id="loginUser" value="admin" readonly aria-readonly="true" /></div>
          </div>
          <div class="field">
            <label for="loginPassword">Password</label>
            <div class="input-shell"><span class="input-prefix">key</span><input id="loginPassword" type="password" autocomplete="current-password" placeholder="password" /></div>
          </div>
          <div class="gate-actions single">
            <button id="unlockBtn" class="btn primary" type="button">Authenticate</button>
          </div>
        </div>

        <div id="gateOutput" class="gate-output" role="status"></div>
      </div>
    </section>
  </main>

  <main id="app" class="hidden">
    <section class="app-shell">
      <div class="main-grid">
        <section class="terminal-pane" aria-label="Restricted user console">
          <div class="pane-head">
            <span class="dot red"></span><span class="dot amber"></span><span class="dot blue"></span>
            <span id="terminalTitle">admin@node:~ · restricted-shell</span>
            <div class="right">
              <button class="mini-action" id="helpBtn" type="button">HELP</button>
              <button class="mini-action" id="clearBtn" type="button">CLEAR</button>
            </div>
          </div>
          <div id="terminalOutput" role="log" aria-live="polite"></div>
          <form id="terminalForm" class="terminal-input-row" autocomplete="off">
            <label class="sr-only" for="commandInput">Terminal command</label>
            <span class="prompt"><span class="prompt-mobile">$</span><span class="prompt-full"><span class="u" id="promptUser">admin</span>@<span class="h">node</span>:<span class="p">~</span>$</span></span>
            <input id="commandInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="help" />
          </form>
        </section>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <script src="/assets/cmx-ops-core.js?v=20260731-2" defer></script>
  <script src="/assets/cmx-auth-policy.js?v=20260804-1" defer></script>
  <script src="/assets/cmx-ops-site.js?v=20260731-2" defer></script>
  <script src="/assets/cmx-ops-intel.js?v=20260731-2" defer></script>
  <script src="/assets/cmx-ops-runtime.js?v=20260731-2" defer></script>
</body>
