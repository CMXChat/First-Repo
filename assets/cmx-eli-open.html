<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#000000" />
  <meta name="referrer" content="no-referrer" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <title>Eli Investment Review</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
    iframe{display:block;width:100%;height:100%;border:0;background:#000}
  </style>
</head>
<body>
  <iframe id="eliExperience" src="/assets/cmx-eli.html?v=20260802-3" title="Eli Investment Review"></iframe>
  <script>
    (() => {
      const frame = document.getElementById('eliExperience');
      const targets = {
        contradictions: 'contradictions',
        alternatives: 'alternatives',
        decision: 'decision'
      };

      function correctParcelMap(doc) {
        const formerOneAcre = doc.querySelector('.parcel-one');
        const formerRearParcel = doc.querySelector('.parcel-rear');
        const roadway = doc.querySelector('.land-map .road');
        const mapNote = doc.querySelector('.map-card .microcopy');

        if (formerOneAcre) {
          const acreage = formerOneAcre.querySelector('span');
          const description = formerOneAcre.querySelector('small');
          if (acreage) acreage.textContent = '1.5 ACRES';
          if (description) description.textContent = 'Rear parcel';
          formerOneAcre.setAttribute('aria-label', 'One and a half acre rear parcel');
        }

        if (formerRearParcel) {
          const acreage = formerRearParcel.querySelector('span');
          const description = formerRearParcel.querySelector('small');
          if (acreage) acreage.textContent = '1 ACRE';
          if (description) description.textContent = 'Major road frontage';
          formerRearParcel.setAttribute('aria-label', 'One acre front parcel along the major roadway');
        }

        if (roadway) {
          roadway.textContent = 'MAJOR ROADWAY / FRONTAGE';
          roadway.setAttribute('aria-label', 'Major roadway in front of the four-acre and one-acre parcels');
          roadway.style.border = '1px solid rgba(255,255,255,.16)';
          roadway.style.background = 'repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 28px,rgba(255,255,255,.025) 28px 44px)';
          roadway.style.color = '#d7d9df';
          roadway.style.fontWeight = '800';
          roadway.style.letterSpacing = '.12em';
        }

        if (mapNote) {
          mapNote.textContent = 'Concept only. Per Eli’s clarification, the 1.5-acre parcel sits behind the 1-acre parcel, while the major roadway runs in front of the 4-acre and 1-acre parcels. Exact boundaries, adjacency, and access still require an independent combined survey.';
        }
      }

      function openEverything(doc) {
        if (!doc?.body) return;

        if (!doc.getElementById('cmx-eli-dark-override')) {
          const dark = doc.createElement('link');
          dark.id = 'cmx-eli-dark-override';
          dark.rel = 'stylesheet';
          dark.href = '/assets/cmx-eli-dark.css?v=20260802-1';
          doc.head.appendChild(dark);
        }

        correctParcelMap(doc);

        doc.querySelectorAll('[data-lock]').forEach(section => {
          section.classList.remove('locked-scene');
          section.classList.add('unlocked');
          section.removeAttribute('data-lock');
          section.querySelector('.locked-cover')?.remove();
        });

        doc.querySelectorAll('.phrase-form').forEach(form => {
          const unlock = form.dataset.unlock;
          const card = form.closest('.checkpoint-card');
          if (!card || card.dataset.openFlowApplied === 'true') return;
          card.dataset.openFlowApplied = 'true';

          const intro = [...card.children].find(node => node.tagName === 'P' && !node.classList.contains('kicker'));
          if (intro) intro.textContent = 'Every section is already open. Continue when you are ready.';

          const rule = doc.createElement('div');
          rule.className = 'decision-rule';
          const phrase = form.dataset.phrase || 'VERIFY FIRST';
          rule.innerHTML = `<strong>${phrase}</strong><br>This is a decision principle, not a password. You do not need to type anything to continue.`;

          const button = doc.createElement('button');
          button.type = 'button';
          button.className = 'primary-button';
          button.textContent = unlock === 'decision' ? 'View final recommendation' : 'Continue review';
          button.addEventListener('click', () => doc.getElementById(targets[unlock] || unlock)?.scrollIntoView({ behavior: 'smooth', block: 'start' }));

          form.replaceWith(rule, button);
        });
      }

      frame.addEventListener('load', () => {
        const doc = frame.contentDocument;
        openEverything(doc);
        let passes = 0;
        const timer = setInterval(() => {
          openEverything(doc);
          passes += 1;
          if (passes > 20) clearInterval(timer);
        }, 150);
      });
    })();
  </script>
</body>
</html>
