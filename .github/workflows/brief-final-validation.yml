name: Brief Final Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/brief-final-validation.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/brief-device-smoke.test.js
      - run: node tests/brief-terminal-smoke.test.js
      - run: node tests/brief-entry-watch-smoke.test.js
      - run: node tests/brief-stability-smoke.test.js
      - name: Record successful validation
        run: |
          printf 'brief validation passed\ncommit=%s\n' "$GITHUB_SHA" > .brief-validation-pass
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .brief-validation-pass
          git commit -m 'Record successful briefing validation'
          git push
