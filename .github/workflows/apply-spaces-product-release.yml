name: Apply Spaces Product Release

on:
  push:
    branches:
      - agent/spaces-product-release
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: spaces-product-release
  cancel-in-progress: true

jobs:
  apply-release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out branch without external actions
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=50 origin "${HEAD_BRANCH}"
          git checkout -B "${HEAD_BRANCH}" FETCH_HEAD

      - name: Validate and apply the audited source patch
        run: |
          python -m py_compile scripts/apply-spaces-product-release.py
          python scripts/apply-spaces-product-release.py

      - name: Validate source syntax
        run: |
          node --check assets/brief/brief-demo-data.js
          node --check assets/brief/brief-demo-experience.js
          node --check assets/brief/brief-demo-explainers.js
          node --check assets/brief/brief-demo-media.js
          node --check assets/brief/brief-demo-app.js
          node --check assets/personal-os-doc.js
          node --check tests/brief-next.spec.cjs
          node --check tests/personal-os-accessibility.spec.cjs
          node --check tests/personal-os-doc-smoke.test.js
          node --check scripts/validate-docs-freshness.mjs

      - name: Commit the product release locally
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rename Personal OS product to Spaces"

      - name: Validate release contracts
        env:
          BASE_SHA: c7674a5ff108b3b8633060ebbb821e48c7bcd537
        run: |
          cmp brief/index.html brief-next/index.html
          node tests/personal-os-doc-smoke.test.js
          node scripts/validate-personal-os-release.mjs
          node scripts/validate-docs-freshness.mjs
          if grep -R -n "Personal OS" brief/index.html brief-next/index.html doc/index.html assets/brief/brief-demo-data.js assets/brief/brief-demo-experience.js assets/brief/brief-demo-explainers.js assets/brief/brief-demo-app.js assets/brief/brief-demo-media.js assets/cmx-routes.json; then
            echo "Legacy product name remains in active user-facing source."
            exit 1
          fi
          if grep -R -n -E "…|—" brief/index.html brief-next/index.html doc/index.html; then
            echo "Visible ellipsis or em dash remains in active product HTML."
            exit 1
          fi

      - name: Push the validated release branch
        run: git push origin HEAD:${{ github.head_ref || github.ref_name }}
