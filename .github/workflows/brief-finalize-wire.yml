name: Wire Brief Final Product

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/brief-finalize-wire.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Apply final versions and permanent tests
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing marker: {label}')
              return text.replace(old, new, 1)

          path = Path('assets/brief/brief-terminal-bridge.js')
          text = path.read_text()
          text = replace_once(text, "const FINAL_VERSION = '20260803-1';", "const FINAL_VERSION = '20260803-2';", 'final asset version')
          path.write_text(text)

          path = Path('brief/index.html')
          text = path.read_text()
          text = replace_once(text, 'brief-terminal-bridge.js?v=20260803-8', 'brief-terminal-bridge.js?v=20260803-9', 'bridge cache')
          path.write_text(text)

          path = Path('.github/workflows/brief-device-smoke.yml')
          text = path.read_text()
          text = text.replace('name: Brief Device, Onboarding, Navigation, Theme, Terminal, Media, Stability, Workspace and Polish Tests', 'name: Brief Device, Onboarding, Navigation, Theme, Vision, Terminal, Media, Stability, Workspace and Polish Tests')
          for anchor in ["      - 'tests/brief-polish-smoke.test.js'"]:
              first = text.find(anchor)
              if first == -1:
                  raise SystemExit('missing push test path anchor')
              insert_at = first + len(anchor)
              text = text[:insert_at] + "\n      - 'tests/brief-finalization-smoke.test.js'" + text[insert_at:]
              second = text.find(anchor, insert_at + 1)
              if second == -1:
                  raise SystemExit('missing pull request test path anchor')
              insert_at = second + len(anchor)
              text = text[:insert_at] + "\n      - 'tests/brief-finalization-smoke.test.js'" + text[insert_at:]
              break
          text += "\n      - name: Run final navigation and vision smoke test\n        run: node tests/brief-finalization-smoke.test.js\n"
          path.write_text(text)

          path = Path('.github/workflows/brief-browser-matrix.yml')
          text = path.read_text()
          anchor = "      - 'tests/brief-theme-e2e.spec.cjs'"
          first = text.find(anchor)
          if first == -1:
              raise SystemExit('missing browser push path')
          insert_at = first + len(anchor)
          text = text[:insert_at] + "\n      - 'tests/brief-finalization-e2e.spec.cjs'" + text[insert_at:]
          second = text.find(anchor, insert_at + 1)
          if second == -1:
              raise SystemExit('missing browser pull path')
          insert_at = second + len(anchor)
          text = text[:insert_at] + "\n      - 'tests/brief-finalization-e2e.spec.cjs'" + text[insert_at:]
          path.write_text(text)
          PY

      - name: Validate syntax and final smoke test
        run: |
          node --check assets/brief/brief-terminal-bridge.js
          node --check assets/brief/brief-finalize.js
          node --check assets/brief/brief-vision-tour.js
          node tests/brief-finalization-smoke.test.js

      - name: Commit final wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/brief/brief-terminal-bridge.js brief/index.html .github/workflows/brief-device-smoke.yml .github/workflows/brief-browser-matrix.yml
          git commit -m 'Wire final briefing vision and workspace tests'
          git push
