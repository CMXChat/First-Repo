name: Continuum Automations v5 Planner Validation

on:
  push:
    branches: [main]
    paths:
      - 'lab/automations/**'
      - 'assets/lab/lab-continuum-planner-contract-v1.js'
      - 'assets/lab/lab-automations-planner-v5.js'
      - 'assets/lab/lab-automations-planner-v5.css'
      - 'assets/lab/lab-automations-v5-mobile-qa.css'
      - '.github/workflows/automations-v5-planner-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lab/automations/**'
      - 'assets/lab/lab-continuum-planner-contract-v1.js'
      - 'assets/lab/lab-automations-planner-v5.js'
      - 'assets/lab/lab-automations-planner-v5.css'
      - 'assets/lab/lab-automations-v5-mobile-qa.css'
      - '.github/workflows/automations-v5-planner-validation.yml'

permissions:
  contents: read

jobs:
  validate-planner:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deterministic Planner boundary
        run: |
          set -euo pipefail
          node --check assets/lab/lab-continuum-planner-contract-v1.js
          node --check assets/lab/lab-automations-planner-v5.js

          grep -q 'CMXContinuumPlannerContractV1' assets/lab/lab-continuum-planner-contract-v1.js
          grep -q 'validateOperations' assets/lab/lab-continuum-planner-contract-v1.js
          grep -q 'automation.create_draft' assets/lab/lab-continuum-planner-contract-v1.js
          grep -q 'directory.upsert_group' assets/lab/lab-continuum-planner-contract-v1.js
          grep -q 'library.create_folder' assets/lab/lab-continuum-planner-contract-v1.js

          grep -q 'TYPED PLAN PREVIEW · LOCAL' assets/lab/lab-automations-planner-v5.js
          grep -q 'NO AI CALL' assets/lab/lab-automations-planner-v5.js
          grep -q 'CHANGE PLAN' assets/lab/lab-automations-planner-v5.js
          grep -q 'Use this draft' assets/lab/lab-automations-planner-v5.js
          grep -q 'local-deterministic-v5' assets/lab/lab-automations-planner-v5.js
          grep -q 'CMXAutomationModelV5?.syncStore?.()' assets/lab/lab-automations-planner-v5.js
          grep -q 'automation.create_draft' assets/lab/lab-automations-planner-v5.js
          grep -q 'automation.add_condition' assets/lab/lab-automations-planner-v5.js
          grep -q 'automation.add_wait' assets/lab/lab-automations-planner-v5.js
          grep -q 'Notification audience still needs a protected Directory selection' assets/lab/lab-automations-planner-v5.js

          grep -q '.v5-planner-result' assets/lab/lab-automations-planner-v5.css
          grep -q '.v5-planner-sequence' assets/lab/lab-automations-planner-v5.css
          grep -q '.v5-planner-ops' assets/lab/lab-automations-planner-v5.css
          grep -q '@media (max-width:760px)' assets/lab/lab-automations-planner-v5.css
          grep -q '.v4-planner-examples button{min-height:44px' assets/lab/lab-automations-v5-mobile-qa.css
          grep -q '.v5-planner-result>footer>button{min-height:46px' assets/lab/lab-automations-v5-mobile-qa.css

          grep -q 'lab-continuum-planner-contract-v1.js?v=20260819-v1' lab/automations/index.html
          grep -q 'lab-automations-planner-v5.js' lab/automations/index.html
          grep -q 'lab-automations-planner-v5.css' lab/automations/index.html

          python - <<'PY'
          from pathlib import Path
          import re

          source = Path('assets/lab/lab-automations-planner-v5.js').read_text(encoding='utf-8')
          contract = Path('assets/lab/lab-continuum-planner-contract-v1.js').read_text(encoding='utf-8')
          forbidden = [
              'fetch(', 'XMLHttpRequest', 'WebSocket(', 'EventSource(',
              'api.cmxchat.com', 'eval(', 'new Function(', 'MutationObserver'
          ]
          for term in forbidden:
              if term in source + contract:
                  raise SystemExit(f'forbidden Planner boundary pattern: {term}')

          # Every typed operation emitted by the deterministic Automation Planner must be registered.
          planner_ops = set(re.findall(r'type:\s*"((?:directory|library|automation)\.[a-z0-9_]+)"', source))
          registry_ops = set(re.findall(r'"((?:directory|library|automation)\.[a-z0-9_]+)":\s*Object\.freeze', contract))
          unknown = sorted(planner_ops - registry_ops)
          if unknown:
              raise SystemExit(f'Automation Planner uses unregistered operations: {unknown}')

          html = Path('lab/automations/index.html').read_text(encoding='utf-8')
          if "connect-src 'self'" not in html:
              raise SystemExit('focused Lab must keep self-only connect-src')
          if html.index('lab-continuum-planner-contract-v1.js') > html.index('lab-automations-planner-v5.js'):
              raise SystemExit('shared Planner contract must load before Automations Planner')

          print('Automations v5 deterministic Planner and shared operation contract passed.')
          PY

      - name: Focused route asset smoke
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo 'No Chromium-compatible browser available.' >&2
            exit 1
          fi
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/continuum-v5-planner-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=12000 \
            --dump-dom 'http://127.0.0.1:8000/lab/automations/' > /tmp/continuum-v5-planner.html
          grep -q 'data-lab-planner-contract="v1"' /tmp/continuum-v5-planner.html
          grep -q 'New automation' /tmp/continuum-v5-planner.html
          grep -q 'AI PLANNER' /tmp/continuum-v5-planner.html || true
          ! grep -qi 'Loading Automations' /tmp/continuum-v5-planner.html
          echo 'Focused Automations route loaded with shared Planner contract and v5 Planner assets.'