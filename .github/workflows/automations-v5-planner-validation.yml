name: Continuum Automations v5 Planner Validation

on:
  push:
    branches: [main]
    paths:
      - 'lab/automations/**'
      - 'assets/lab/lab-continuum-planner-contract-v1.js'
      - 'assets/lab/lab-continuum-planner-preflight-v1.js'
      - 'assets/lab/lab-continuum-planner-preflight-v1.css'
      - 'assets/lab/lab-continuum-planner-review-v1.js'
      - 'assets/lab/lab-continuum-planner-review-v1.css'
      - 'assets/lab/lab-automations-planner-v5.js'
      - 'assets/lab/lab-automations-planner-v5.css'
      - 'assets/lab/lab-automations-v5-mobile-qa.css'
      - '.github/workflows/automations-v5-planner-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lab/automations/**'
      - 'assets/lab/lab-continuum-planner-contract-v1.js'
      - 'assets/lab/lab-continuum-planner-preflight-v1.js'
      - 'assets/lab/lab-continuum-planner-preflight-v1.css'
      - 'assets/lab/lab-continuum-planner-review-v1.js'
      - 'assets/lab/lab-continuum-planner-review-v1.css'
      - 'assets/lab/lab-automations-planner-v5.js'
      - 'assets/lab/lab-automations-planner-v5.css'
      - 'assets/lab/lab-automations-v5-mobile-qa.css'
      - '.github/workflows/automations-v5-planner-validation.yml'

permissions:
  contents: read

jobs:
  validate-planner:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deterministic Planner and preflight boundary
        run: |
          set -euo pipefail
          node --check assets/lab/lab-continuum-planner-contract-v1.js
          node --check assets/lab/lab-continuum-planner-preflight-v1.js
          node --check assets/lab/lab-continuum-planner-review-v1.js
          node --check assets/lab/lab-automations-planner-v5.js

          python - <<'PY'
          from pathlib import Path
          import re

          source = Path('assets/lab/lab-automations-planner-v5.js').read_text(encoding='utf-8')
          contract = Path('assets/lab/lab-continuum-planner-contract-v1.js').read_text(encoding='utf-8')
          preflight = Path('assets/lab/lab-continuum-planner-preflight-v1.js').read_text(encoding='utf-8')
          preflight_css = Path('assets/lab/lab-continuum-planner-preflight-v1.css').read_text(encoding='utf-8')
          review = Path('assets/lab/lab-continuum-planner-review-v1.js').read_text(encoding='utf-8')
          html = Path('lab/automations/index.html').read_text(encoding='utf-8')

          for term in [
              'CMXContinuumPlannerContractV1', 'validateOperations', 'validatePlan', 'classifyIssue', 'validateIssues',
              'directory.ambiguous_match', 'directory.audience_required', 'automation.schedule_unconfirmed',
              'runtime.required', 'connections.required', 'authority.approval_required'
          ]:
              if term not in contract:
                  raise SystemExit(f'Planner contract missing: {term}')

          for term in [
              'TYPED PLAN PREVIEW · LOCAL', 'NO AI CALL', 'CHANGE PLAN', 'Use this draft',
              'local-deterministic-v5', 'automation.create_draft', 'automation.add_condition', 'automation.add_wait',
              'temp:automation:draft', 'temp:step:'
          ]:
              if term not in source:
                  raise SystemExit(f'Automation Planner missing: {term}')

          for term in [
              'PREFLIGHT · TYPED REVIEW', 'BLOCKED FOR APPLY', 'DEFERRED TO DRAFT',
              'data-preflight-choice', 'data-preflight-defer', 'data-preflight-reset', 'labPlannerPreflight = "v1"'
          ]:
              if term not in preflight:
                  raise SystemExit(f'Planner preflight missing: {term}')
          for term in ['.continuum-preflight-panel', '.continuum-preflight-actions', '@media (max-width:760px)']:
              if term not in preflight_css:
                  raise SystemExit(f'Planner preflight CSS missing: {term}')
          for term in ['CHANGE REVIEW', 'cmx:lab-planner-preflight-updated', 'ISSUES']:
              if term not in review:
                  raise SystemExit(f'Change Review missing preflight integration: {term}')

          for forbidden in ['fetch(', 'XMLHttpRequest', 'WebSocket(', 'EventSource(', 'api.cmxchat.com', 'eval(', 'new Function(', 'MutationObserver']:
              if forbidden in source + contract + preflight + review:
                  raise SystemExit(f'forbidden Planner boundary pattern: {forbidden}')

          planner_ops = set(re.findall(r'type:\s*"((?:directory|library|automation)\.[a-z0-9_]+)"', source))
          registry_ops = set(re.findall(r'"((?:directory|library|automation)\.[a-z0-9_]+)":\s*Object\.freeze', contract))
          unknown = sorted(planner_ops - registry_ops)
          if unknown:
              raise SystemExit(f'Automation Planner uses unregistered operations: {unknown}')

          required_assets = [
              'lab-continuum-planner-contract-v1.js?v=20260819-v1preflight1',
              'lab-continuum-planner-preflight-v1.css?v=20260819-v1',
              'lab-continuum-planner-review-v1.css?v=20260819-v1preflight1',
              'lab-continuum-planner-preflight-v1.js?v=20260819-v1r1',
              'lab-continuum-planner-review-v1.js?v=20260819-v1preflight1',
              'lab-automations-v5-mobile-qa.css?v=20260819-v5mobile2'
          ]
          for term in required_assets:
              if term not in html:
                  raise SystemExit(f'focused route missing current Planner asset: {term}')

          if "connect-src 'self'" not in html:
              raise SystemExit('focused Lab must keep self-only connect-src')
          if html.index('lab-continuum-planner-contract-v1.js') > html.index('lab-automations-planner-v5.js'):
              raise SystemExit('Planner contract must load before Automation Planner')
          if html.index('lab-automations-planner-v5.js') > html.index('lab-continuum-planner-preflight-v1.js'):
              raise SystemExit('typed preflight must load after Automation Planner')
          if html.index('lab-continuum-planner-preflight-v1.js') > html.index('lab-continuum-planner-review-v1.js'):
              raise SystemExit('Change Review must load after typed preflight')
          if html.index('lab-continuum-planner-review-v1.css') > html.index('lab-automations-v5-mobile-qa.css'):
              raise SystemExit('final mobile QA must remain after shared Planner CSS')

          print('Automations v5 deterministic Planner, dependencies, typed preflight and Change Review contracts passed.')
          PY

      - name: Focused route asset smoke
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo 'No Chromium-compatible browser available.' >&2
            exit 1
          fi
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/continuum-v5-planner-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=14000 \
            --dump-dom 'http://127.0.0.1:8000/lab/automations/' > /tmp/continuum-v5-planner.html
          grep -q 'data-lab-planner-contract="v1"' /tmp/continuum-v5-planner.html
          grep -q 'data-lab-planner-preflight="v1"' /tmp/continuum-v5-planner.html
          grep -q 'data-lab-planner-review="v1"' /tmp/continuum-v5-planner.html
          grep -q 'New automation' /tmp/continuum-v5-planner.html
          ! grep -qi 'Loading Automations' /tmp/continuum-v5-planner.html
          echo 'Focused Automations route loaded with typed Planner preflight/review assets.'
