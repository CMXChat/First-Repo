name: Connect Build Lab Registry

on:
  push:
    paths:
      - '.build-lab-registry-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/connect_build_lab_registry.py
      - name: Commit generated Build Lab
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cmx-build-lab.html
          git diff --cached --quiet || git commit -m "Connect Build Lab to route registry"
          git push
