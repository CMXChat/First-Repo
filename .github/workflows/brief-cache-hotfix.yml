name: Apply Brief Cache Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/brief-cache-hotfix.yml'

permissions:
  contents: write

jobs:
  bump-brief-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Force fixed briefing assets
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('brief/index.html')
          text = path.read_text()
          text = text.replace('brief-config.js?v=20260803-6', 'brief-config.js?v=20260803-7')
          text = text.replace('brief-terminal-bridge.js?v=20260803-1', 'brief-terminal-bridge.js?v=20260803-2')
          path.write_text(text)
          PY

      - name: Commit cache-bust update
        run: |
          if git diff --quiet -- brief/index.html; then
            echo 'Cache versions are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add brief/index.html
          git commit -m 'Force fixed briefing assets after mobile freeze'
          git push
