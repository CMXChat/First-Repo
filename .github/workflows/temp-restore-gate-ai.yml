name: Temporary Gate Restore

on:
  push:
    branches:
      - agent/gate-ai
    paths:
      - '.restore-gate-ai-trigger'

permissions:
  contents: write

jobs:
  restore-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out rebased branch
        uses: actions/checkout@v4
        with:
          ref: agent/gate-ai
          fetch-depth: 0

      - name: Restore reviewed gate files
        run: |
          git fetch origin agent/gate-ai-backup
          git checkout origin/agent/gate-ai-backup -- \
            ai/index.html \
            assets/cmx-ai-control-blueprint.html \
            assets/cmx-debbie-brief.html \
            assets/cmx-logan-brief.html \
            assets/cmx-routes.json \
            debbie/index.html \
            logan/index.html

      - name: Commit restored gate files
        run: |
          git config user.name "cmx-gate-rebase"
          git config user.email "actions@users.noreply.github.com"
          git add ai/index.html assets/cmx-ai-control-blueprint.html assets/cmx-debbie-brief.html assets/cmx-logan-brief.html assets/cmx-routes.json debbie/index.html logan/index.html
          git commit -m "Reapply gated routes on latest main"
          git push origin HEAD:agent/gate-ai
