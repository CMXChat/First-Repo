name: Extract Brief Onboarding Failures

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/brief-onboarding-extract-failures.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Extract useful failure lines
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          source = Path('docs/brief-onboarding-browser-validation.md').read_text(errors='replace')
          ansi = re.compile(r'\x1b\[[0-9;]*[A-Za-z]')
          text = ansi.sub('', source)
          lines = text.splitlines()
          keep = []
          terms = ('Error:', 'TimeoutError', 'Expected:', 'Received:', 'expect(', 'locator(', 'Call log:', 'at tests/brief-browser-e2e.spec.cjs', 'failed', 'toBe', 'toHave', 'toContain')
          for index, line in enumerate(lines):
              if any(term in line for term in terms):
                  start = max(0, index - 4)
                  end = min(len(lines), index + 10)
                  keep.extend(lines[start:end])
                  keep.append('---')
          Path('docs/brief-onboarding-browser-failures.txt').write_text('\n'.join(keep[-500:]))
          PY
      - name: Commit extracted failures
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/brief-onboarding-browser-failures.txt
          git commit -m 'Record concise onboarding browser failures'
          git push
