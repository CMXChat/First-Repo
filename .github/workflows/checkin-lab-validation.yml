name: Continuum Archived Lab Validation

on:
  push:
    branches: [main]
    paths:
      - 'archive/continuum-lab/**'
      - 'assets/lab/**'
      - 'tests/playwright-mobile-dump.cjs'
      - '.github/workflows/checkin-lab-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'archive/continuum-lab/**'
      - 'assets/lab/**'
      - 'tests/playwright-mobile-dump.cjs'
      - '.github/workflows/checkin-lab-validation.yml'

permissions:
  contents: read

jobs:
  validate-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate archived Lab assets
        run: |
          set -euo pipefail
          for file in \
            assets/lab/lab-loader.js \
            assets/lab/lab-continuum-planner-contract-v1.js \
            assets/lab/lab-directory-planner-preview.js \
            assets/lab/lab-continuum-planner-preflight-v1.js \
            assets/lab/lab-continuum-planner-review-v1.js \
            assets/lab/lab-automation-builder.js \
            assets/lab/lab-automations-main-bridge.js \
            assets/lab/lab-acceptance.js \
            tests/playwright-mobile-dump.cjs
          do
            node --check "$file"
          done

          node - <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const { BUILD, transformSnapshot } = require('./assets/lab/lab-loader.js');

          assert.equal(BUILD, '20260819-planner-signals-v3');
          const shell = fs.readFileSync('archive/continuum-lab/index.html', 'utf8');
          assert(shell.includes('/assets/lab/lab-loader.js?v=20260819-planner-signals-v3'));
          assert(shell.includes('PRESERVED SNAPSHOT'));

          const source = fs.readFileSync('assets/lab/checkin-index-snapshot.html', 'utf8');
          const rendered = transformSnapshot(source);
          for (const term of [
            'data-lab-mode="true"',
            '/assets/lab/lab-continuum-planner-contract-v1.js',
            '/assets/lab/lab-directory-planner-preview.js',
            '/assets/lab/lab-continuum-planner-preflight-v1.js',
            '/assets/lab/lab-continuum-planner-review-v1.js',
            '/assets/lab/lab-automations-main-bridge.js',
            '/assets/lab/lab-acceptance.js'
          ]) assert(rendered.includes(term), `archived snapshot missing ${term}`);

          assert(!fs.existsSync('lab'), 'retired top-level lab directory must not return');
          fs.writeFileSync('archive-lab-browser-smoke.html', rendered.replace('upgrade-insecure-requests', ''), 'utf8');
          NODE

      - name: Browser smoke archived snapshot
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo 'No Chromium-compatible browser available.' >&2
            exit 1
          fi

          npm install --no-save playwright-core@1.55.0
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/continuum-archive-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -f archive-lab-browser-smoke.html' EXIT
          sleep 1

          node tests/playwright-mobile-dump.cjs \
            "$BROWSER" 1280 900 \
            'http://127.0.0.1:8000/archive-lab-browser-smoke.html' /tmp/archive-lab-desktop.html \
            labDirectoryPlanner typed-v2 18000

          node tests/playwright-mobile-dump.cjs \
            "$BROWSER" 390 844 \
            'http://127.0.0.1:8000/archive-lab-browser-smoke.html' /tmp/archive-lab-mobile.html \
            labDirectoryPlanner typed-v2 18000

          grep -q 'data-lab-acceptance="ready"' /tmp/archive-lab-desktop.html
          grep -q 'data-lab-acceptance="ready"' /tmp/archive-lab-mobile.html
          echo 'Archived Continuum Lab snapshot remains regression-usable outside the retired /lab namespace.'
