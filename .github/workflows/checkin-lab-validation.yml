name: Check In Lab Validation

on:
  push:
    branches: [main]
    paths:
      - 'lab/**'
      - 'assets/lab/**'
      - '.github/workflows/checkin-lab-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lab/**'
      - 'assets/lab/**'
      - '.github/workflows/checkin-lab-validation.yml'

permissions:
  contents: read

jobs:
  validate-lab:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate active Lab JavaScript syntax
        run: |
          set -euo pipefail
          for file in \
            assets/lab/lab-loader.js \
            assets/lab/lab-mock-api.js \
            assets/lab/lab-crm.js \
            assets/lab/lab-directory-v2.js \
            assets/lab/lab-directory-planner-preview.js \
            assets/lab/lab-inventory.js \
            assets/lab/lab-actions.js \
            assets/lab/lab-timeline-live.js \
            assets/lab/lab-decisions.js \
            assets/lab/lab-decisions-events.js \
            assets/lab/lab-audit-bootstrap.js \
            assets/lab/lab-audit.js \
            assets/lab/lab-command.js \
            assets/lab/lab-test-center.js \
            assets/lab/lab-product-polish.js \
            assets/lab/lab-plan.js \
            assets/lab/lab-experience.js \
            assets/lab/lab-automation-builder.js \
            assets/lab/lab-automations-main-bridge.js \
            assets/lab/lab-acceptance.js \
            assets/lab/checkin-status-contract.js \
            assets/lab/checkin.js \
            assets/lab/checkin-refine.js \
            assets/lab/checkin-vault-panels.js \
            assets/lab/checkin-actions-official.js
          do
            node --check "$file"
          done

      - name: Validate generated Lab snapshot and isolation
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const assert = require('assert');
          const contract = require('./assets/lab/checkin-status-contract.js');
          const { BUILD, transformSnapshot } = require('./assets/lab/lab-loader.js');

          assert.equal(BUILD, '20260818-directory2ai');

          const counts = {
            document_count: 6,
            contact_count: 8,
            organization_count: 3,
            update_revision_count: 5,
            trigger_action_count: 4
          };
          for (const interval of [1, 6, 24, 72, 168, 720]) {
            const value = contract.normalize({ interval_hours: interval, grace_hours: 12, repeat_enabled: true, ...counts });
            assert.equal(value.schemaCompatible, true, `${interval}h should be valid in Lab`);
          }
          assert.equal(contract.normalize({ interval_hours: 721, grace_hours: 12, ...counts }).schemaCompatible, false);
          assert.equal(contract.normalize({ interval_hours: 6, grace_hours: 25, ...counts }).schemaCompatible, false);

          const shell = fs.readFileSync('lab/index.html', 'utf8');
          assert(shell.includes('/assets/lab/lab-loader.js?v=20260818-directory2ai'));
          assert(!shell.includes('document.write(html)'));

          const source = fs.readFileSync('assets/lab/checkin-index-snapshot.html', 'utf8');
          const rendered = transformSnapshot(source);
          const required = [
            "connect-src 'self';",
            "style-src 'self' 'unsafe-inline';",
            'data-lab-mode="true"',
            '/assets/lab/lab-mock-api.js',
            '/assets/lab/lab-crm.js',
            '/assets/lab/lab-directory-v2.js',
            '/assets/lab/lab-directory-v2.css',
            '/assets/lab/lab-directory-v2-polish.css',
            '/assets/lab/lab-directory-planner-preview.js',
            '/assets/lab/lab-directory-planner-preview.css',
            '/assets/lab/lab-inventory.js',
            '/assets/lab/lab-actions.js',
            '/assets/lab/lab-timeline-live.js',
            '/assets/lab/lab-decisions.js',
            '/assets/lab/lab-audit.js',
            '/assets/lab/lab-command.js',
            '/assets/lab/lab-test-center.js',
            '/assets/lab/lab-product-polish.js',
            '/assets/lab/lab-plan.js',
            '/assets/lab/lab-experience.js',
            '/assets/lab/lab-automation-builder.js',
            '/assets/lab/lab-automations-main-bridge.js',
            '/assets/lab/lab-acceptance.js',
            '/assets/lab/lab-final-qa.css'
          ];
          required.forEach(term => assert(rendered.includes(term), `missing generated Lab contract: ${term}`));
          assert(rendered.indexOf('/assets/lab/lab-mock-api.js') < rendered.indexOf('/assets/lab/checkin-status-contract.js'));
          assert(rendered.indexOf('/assets/lab/lab-crm.js') < rendered.indexOf('/assets/lab/lab-directory-v2.js'));
          assert(rendered.indexOf('/assets/lab/lab-directory-v2.js') < rendered.indexOf('/assets/lab/lab-directory-planner-preview.js'));
          assert(rendered.indexOf('/assets/lab/lab-directory-v2.css') < rendered.indexOf('/assets/lab/lab-directory-v2-polish.css'));
          assert(rendered.indexOf('/assets/lab/lab-directory-v2-polish.css') < rendered.indexOf('/assets/lab/lab-directory-planner-preview.css'));
          assert(rendered.indexOf('/assets/lab/lab-experience.js') < rendered.indexOf('/assets/lab/lab-automation-builder.js'));
          assert(!rendered.includes('/assets/checkin/'));
          assert(!rendered.includes("connect-src 'self' https://api.cmxchat.com;"));

          fs.writeFileSync('lab-browser-smoke.html', rendered.replace('upgrade-insecure-requests', ''), 'utf8');
          NODE

          python - <<'PY'
          from pathlib import Path
          import sys

          production = Path('checkin/index.html').read_text(encoding='utf-8')
          if '/assets/lab/' in production or 'data-lab-mode="true"' in production:
              sys.exit('production /checkin references Lab code')

          active = [
              'assets/lab/lab-loader.js',
              'assets/lab/lab-directory-v2.js',
              'assets/lab/lab-directory-planner-preview.js',
              'assets/lab/lab-command.js',
              'assets/lab/lab-product-polish.js',
              'assets/lab/lab-plan.js',
              'assets/lab/lab-experience.js',
              'assets/lab/lab-automation-builder.js',
              'assets/lab/lab-acceptance.js',
          ]
          combined = '\n'.join(Path(path).read_text(encoding='utf-8') for path in active)
          if 'api.cmxchat.com' in combined:
              sys.exit('active Lab layer references production API')
          for path in ['assets/lab/lab-directory-v2.js', 'assets/lab/lab-directory-planner-preview.js']:
              source = Path(path).read_text(encoding='utf-8')
              for forbidden in ['eval(', 'new Function(', 'MutationObserver']:
                  if forbidden in source:
                      sys.exit(f'{path} forbidden pattern: {forbidden}')

          polish = Path('assets/lab/lab-directory-v2-polish.css').read_text(encoding='utf-8')
          for term in ['position:sticky', '@media (max-width:760px)', 'prefers-reduced-motion']:
              if term not in polish: sys.exit(f'Directory polish missing contract: {term}')

          planner = Path('assets/lab/lab-directory-planner-preview.js').read_text(encoding='utf-8')
          for term in ['AI SETUP · PREVIEW', 'CHANGE PLAN CONTRACT', 'No model call', 'no data mutation', 'no hidden AI authority', 'labDirectoryPlanner = "preview-v1"']:
              if term not in planner: sys.exit(f'Directory Planner preview missing contract: {term}')

          print('Continuum Lab snapshot, production isolation, Directory v2 polish and AI setup preview passed.')
          PY

      - name: Browser acceptance smoke desktop and mobile
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo 'No Chromium-compatible browser available on runner.' >&2
            exit 1
          fi

          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/checkin-lab-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -f lab-browser-smoke.html' EXIT
          sleep 1

          dump() {
            "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=12000 "$@" --dump-dom
          }

          dump http://127.0.0.1:8000/lab-browser-smoke.html > /tmp/lab-desktop.html
          ! grep -qi 'lab snapshot unavailable' /tmp/lab-desktop.html
          grep -q 'data-lab-acceptance="ready"' /tmp/lab-desktop.html
          grep -q 'data-lab-product-polish="ready"' /tmp/lab-desktop.html
          grep -q 'data-lab-plan="ready"' /tmp/lab-desktop.html
          grep -q 'data-lab-experience="ready"' /tmp/lab-desktop.html
          grep -q 'data-lab-automation-builder="ready"' /tmp/lab-desktop.html
          grep -q 'data-lab-directory="v2"' /tmp/lab-desktop.html
          grep -q 'data-lab-directory-planner="preview-v1"' /tmp/lab-desktop.html
          grep -q 'class="lab-directory-v2"' /tmp/lab-desktop.html
          grep -q 'AI setup' /tmp/lab-desktop.html
          grep -q 'id="labAutomationWorkspace"' /tmp/lab-desktop.html
          grep -q 'lab-live-status-hero' /tmp/lab-desktop.html
          grep -q 'labCommandPalette' /tmp/lab-desktop.html

          dump --window-size=390,844 http://127.0.0.1:8000/lab-browser-smoke.html > /tmp/lab-mobile.html
          ! grep -qi 'lab snapshot unavailable' /tmp/lab-mobile.html
          grep -q 'data-lab-acceptance="ready"' /tmp/lab-mobile.html
          grep -q 'data-lab-directory="v2"' /tmp/lab-mobile.html
          grep -q 'data-lab-directory-planner="preview-v1"' /tmp/lab-mobile.html
          grep -q 'class="lab-directory-v2"' /tmp/lab-mobile.html
          grep -q 'AI setup' /tmp/lab-mobile.html
          grep -q 'mobile-nav' /tmp/lab-mobile.html
          grep -q 'labGlobalSearch' /tmp/lab-mobile.html
          grep -q 'labGlobalCreate' /tmp/lab-mobile.html

          echo 'Continuum Lab desktop/mobile smoke passed with Directory AI setup preview and existing operating surfaces.'
