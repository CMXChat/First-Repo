name: Check In Lab Validation

on:
  push:
    branches: [main]
    paths:
      - 'lab/**'
      - 'assets/lab/**'
      - '.github/workflows/checkin-lab-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lab/**'
      - 'assets/lab/**'
      - '.github/workflows/checkin-lab-validation.yml'

permissions:
  contents: read

jobs:
  validate-lab:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Lab JavaScript syntax
        run: |
          node --check assets/lab/lab-mock-api.js
          node --check assets/lab/lab-crm.js
          node --check assets/lab/lab-inventory.js
          node --check assets/lab/lab-actions.js
          node --check assets/lab/lab-timeline-live.js
          node --check assets/lab/lab-decisions.js
          node --check assets/lab/lab-decisions-events.js
          node --check assets/lab/checkin-status-contract.js
          node --check assets/lab/checkin.js
          node --check assets/lab/checkin-refine.js
          node --check assets/lab/checkin-vault-panels.js
          node --check assets/lab/checkin-actions-official.js

      - name: Validate Lab isolation, records, actions, sequence, decisions, and handoffs
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          failures = []
          loader = Path('lab/index.html')
          required = [
              Path('assets/lab/checkin-index-snapshot.html'),
              Path('assets/lab/lab-safety.css'),
              Path('assets/lab/lab-mock-api.js'),
              Path('assets/lab/lab-crm.css'),
              Path('assets/lab/lab-crm.js'),
              Path('assets/lab/lab-inventory.css'),
              Path('assets/lab/lab-inventory.js'),
              Path('assets/lab/lab-actions.css'),
              Path('assets/lab/lab-actions.js'),
              Path('assets/lab/lab-timeline.css'),
              Path('assets/lab/lab-timeline-responsive.css'),
              Path('assets/lab/lab-timeline-live.js'),
              Path('assets/lab/lab-decisions.css'),
              Path('assets/lab/lab-decisions.js'),
              Path('assets/lab/lab-decisions-events.js'),
              Path('assets/lab/BACKEND-HANDOFF.md'),
              Path('assets/lab/ACTIONS-BACKEND-HANDOFF.md'),
              Path('assets/lab/DECISIONS-BACKEND-HANDOFF.md'),
              Path('assets/lab/LAB-HANDOFF.md'),
          ]

          if not loader.exists():
              failures.append('lab/index.html is missing')
              text = ''
          else:
              text = loader.read_text(encoding='utf-8')

          for path in required:
              if not path.exists():
                  failures.append(f'missing Lab asset: {path}')

          for term in (
              "connect-src 'self';",
              '/assets/lab/lab-mock-api.js',
              '/assets/lab/lab-safety.css',
              '/assets/lab/lab-crm.css',
              '/assets/lab/lab-crm.js',
              '/assets/lab/lab-inventory.css',
              '/assets/lab/lab-inventory.js',
              '/assets/lab/lab-actions.css',
              '/assets/lab/lab-actions.js',
              '/assets/lab/lab-timeline.css',
              '/assets/lab/lab-timeline-responsive.css',
              '/assets/lab/lab-timeline-live.js',
              '/assets/lab/lab-decisions.css',
              '/assets/lab/lab-decisions.js',
              '/assets/lab/lab-decisions-events.js',
              'data-lab-mode="true"',
          ):
              if term not in text:
                  failures.append(f'Lab loader missing safety/app wiring: {term}')

          production = Path('checkin/index.html').read_text(encoding='utf-8')
          if '/assets/lab/' in production or 'data-lab-mode="true"' in production:
              failures.append('production /checkin references Lab assets or Lab mode')

          mock = Path('assets/lab/lab-mock-api.js').read_text(encoding='utf-8')
          for term in (
              'productionApiBlocked: true',
              'PROD_API_ORIGIN',
              'INVENTORY_STORAGE_KEY',
              'ACTION_STORAGE_KEY',
              'SWITCH_POLICY_KEY',
              'interval_hours: policy.intervalHours',
              'grace_hours: policy.graceHours',
              'repeat_enabled: policy.repeat',
          ):
              if term not in mock:
                  failures.append(f'Lab mock API safety/policy guard missing: {term}')

          inventory = Path('assets/lab/lab-inventory.js').read_text(encoding='utf-8')
          for term in ('BACKEND HANDOFF', 'object storage', 'secret_ref', 'PostgreSQL', 'FastAPI', 'INVENTORY_STORAGE_KEY'):
              if term not in inventory:
                  failures.append(f'Lab inventory backend boundary missing: {term}')

          actions = Path('assets/lab/lab-actions.js').read_text(encoding='utf-8')
          for term in (
              'BACKEND HANDOFF',
              'ACTION_STORAGE_KEY',
              'PostgreSQL',
              'FastAPI',
              'server-side scheduler/worker',
              'stable IDs',
              'Destructive',
              'grace_expiry',
              'grace_offset',
              'SIMULATION ONLY',
          ):
              if term not in actions:
                  failures.append(f'Lab action builder boundary/model missing: {term}')

          sequence = Path('assets/lab/lab-timeline-live.js').read_text(encoding='utf-8')
          for term in (
              'BACKEND HANDOFF',
              'POLICY_KEY',
              'SIM_KEY',
              'intervalHours',
              'graceHours',
              'repeat',
              'policySnapshot',
              'ACTION_ELIGIBLE',
              'AWAITING APPROVAL',
              'SIMULATED_SUCCESS',
              'SIMULATED_FAILURE',
              'server-authoritative',
          ):
              if term not in sequence:
                  failures.append(f'Lab sequence engine boundary/model missing: {term}')

          decisions = Path('assets/lab/lab-decisions.js').read_text(encoding='utf-8')
          for term in (
              'BACKEND HANDOFF',
              'DECISION_KEY',
              'RUNTIME_KEY',
              'switch_overdue',
              'grace_expired',
              'action_state',
              'asset_status',
              'AWAITING ACKNOWLEDGEMENT',
              'NO ACKNOWLEDGEMENT',
              'APPROVAL DENIED',
              'cycleCheck',
              'routeSignals',
              'Delivery and acknowledgement are separate states',
              'Server-authoritative workers',
              'DECISIONS-BACKEND-HANDOFF.md',
          ):
              if term not in decisions:
                  failures.append(f'Lab decision engine boundary/model missing: {term}')

          event_boundary = Path('assets/lab/lab-decisions-events.js').read_text(encoding='utf-8')
          for term in ('UI EVENT BOUNDARY', 'data-decision-node', 'stopPropagation'):
              if term not in event_boundary:
                  failures.append(f'Lab decision event boundary missing: {term}')

          handoff = Path('assets/lab/BACKEND-HANDOFF.md').read_text(encoding='utf-8')
          for term in ('checkin_documents', 'checkin_digital_assets', 'checkin_record_links', 'object storage', 'secret_ref', 'Action Builder integration'):
              if term not in handoff:
                  failures.append(f'Backend handoff missing required note: {term}')

          action_handoff = Path('assets/lab/ACTIONS-BACKEND-HANDOFF.md').read_text(encoding='utf-8')
          for term in (
              'checkin_action_definitions',
              'checkin_action_targets',
              'checkin_action_executions',
              'eligibility scheduler',
              'idempotency',
              'Execution snapshots',
              'AI actions',
              'Digital account actions',
              'Phase 5 integration',
          ):
              if term not in action_handoff:
                  failures.append(f'Action backend handoff missing required note: {term}')

          decision_handoff = Path('assets/lab/DECISIONS-BACKEND-HANDOFF.md').read_text(encoding='utf-8')
          for term in (
              'checkin_action_conditions',
              'checkin_action_routes',
              'checkin_action_dependencies',
              'checkin_acknowledgements',
              'checkin_action_approvals',
              'checkin_incident_actions',
              'checkin_condition_evaluations',
              'Cycle detection',
              'Delivery and acknowledgement are separate states',
              'idempotency',
          ):
              if term not in decision_handoff:
                  failures.append(f'Decision backend handoff missing required note: {term}')

          lab_handoff = Path('assets/lab/LAB-HANDOFF.md').read_text(encoding='utf-8')
          for term in (
              'Read this file first',
              'Phase 5',
              'Phase 6',
              'cmx-lab-switch-policy-v1',
              'cmx-lab-decisions-v1',
              'cmx-lab-decision-runtime-v1',
              'rolling repeat',
              'one-shot',
              'lab-timeline-live.js',
              'lab-decisions.js',
              'Decision Inspector',
              'Phase 7',
              'Update this file at the end of every major Lab round',
          ):
              if term not in lab_handoff:
                  failures.append(f'Persistent Lab handoff missing required note: {term}')

          if failures:
              print('\n'.join(f' - {failure}' for failure in failures))
              sys.exit(1)

          print('Check In Lab syntax, isolation, records, actions, sequence, decision engine, and persistent handoff validated.')
          PY