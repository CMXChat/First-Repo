name: Continuum Doc Planner and Signals Validation

on:
  push:
    branches: [main]
    paths:
      - 'doc/**'
      - 'assets/continuum-doc-*.js'
      - 'assets/continuum-doc-*.css'
      - 'tests/continuum-doc-*.test.js'
      - '.github/workflows/continuum-doc-signals-planner-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'doc/**'
      - 'assets/continuum-doc-*.js'
      - 'assets/continuum-doc-*.css'
      - 'tests/continuum-doc-*.test.js'
      - '.github/workflows/continuum-doc-signals-planner-validation.yml'

permissions:
  contents: read

jobs:
  validate-doc-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Planner, Signals, knowledge and time contracts
        run: |
          set -euo pipefail
          node --check assets/continuum-doc-origin.js
          node --check assets/continuum-doc-i18n.js
          node --check assets/continuum-doc-knowledge-time.js
          node --test tests/continuum-doc-knowledge-time-smoke.test.js

          python - <<'PY'
          from pathlib import Path

          source = Path('assets/continuum-doc-origin.js').read_text(encoding='utf-8')
          css = Path('assets/continuum-doc-origin.css').read_text(encoding='utf-8')
          clock = Path('assets/continuum-doc-knowledge-time.js').read_text(encoding='utf-8')
          clock_css = Path('assets/continuum-doc-knowledge-time.css').read_text(encoding='utf-8')
          html = Path('doc/index.html').read_text(encoding='utf-8')

          required_source = [
              'LATER · PLANNER',
              'Describe the setup in normal language. The result still has to pass the same server rules.',
              'typed Change Plan',
              'Executable capability and authority remain protected server decisions.',
              'LATER · SIGNALS + STATE',
              'Observed change can alter what Continuum understands about the current situation.',
              'Evidence changes understanding. Published authority controls execution.',
              'Signals are how Continuum can notice that the world changed.',
              'data.continuumSignalsPlanner'
          ]
          for term in required_source:
              if term not in source:
                  raise SystemExit(f'missing Planner/Signals contract: {term}')

          for term in ['.continuum-planner-note', '.continuum-signals-note', '.continuum-senses-flow', '@media(max-width:680px)', '@media print']:
              if term not in css:
                  raise SystemExit(f'missing Planner/Signals style: {term}')

          for term in ['BRING INFORMATION IN', 'Files + OCR / vision', 'CAPTURE', 'UNDERSTAND', 'REVIEW', 'INTEGRATE', 'REAL CLOCK', 'roughly two seconds passed', "dataset.continuumKnowledgeTime = 'ready'"]:
              if term not in clock:
                  raise SystemExit(f'missing knowledge/time contract: {term}')

          for term in ['.continuum-kt-panel', '.continuum-kt-clock-grid', 'body:dir(rtl)', '@media(max-width:680px)']:
              if term not in clock_css:
                  raise SystemExit(f'missing knowledge/time style: {term}')

          for forbidden in ['fetch(', 'XMLHttpRequest', 'WebSocket(', 'EventSource(', 'api.cmxchat.com', 'eval(', 'new Function(', 'MutationObserver']:
              if forbidden in source or forbidden in clock:
                  raise SystemExit(f'forbidden integration pattern: {forbidden}')

          for anchor in ['overview', 'difference', 'spaces', 'action', 'afterlife', 'engineering', 'build', 'status']:
              if f'id="{anchor}"' not in html:
                  raise SystemExit(f'/doc lost stable anchor: {anchor}')

          if "connect-src 'none'" not in html:
              raise SystemExit('/doc must keep connect-src none')
          if 'noindex' not in html:
              raise SystemExit('/doc must remain noindex')
          PY

      - name: Render desktop and mobile
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/doc-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1

          check_view() {
            local size="$1" out="$2"
            "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size="$size" --virtual-time-budget=14000 --dump-dom 'http://127.0.0.1:8000/doc/' > "$out"
            grep -q 'data-continuum-signals-planner="ready"' "$out"
            grep -q 'data-continuum-knowledge-time="ready"' "$out"
            grep -q 'LATER · PLANNER' "$out"
            grep -q 'Describe the setup in normal language. The result still has to pass the same server rules.' "$out"
            grep -q 'LATER · SIGNALS + STATE' "$out"
            grep -q 'Observed change can alter what Continuum understands about the current situation.' "$out"
            grep -q 'Evidence changes understanding. Published authority controls execution.' "$out"
            grep -q 'BRING INFORMATION IN' "$out"
            grep -q 'REAL CLOCK' "$out"
            grep -q 'roughly two seconds passed' "$out"
          }

          check_view 1280,900 /tmp/doc-desktop.html
          check_view 390,844 /tmp/doc-mobile.html
          echo 'Planner, Signals, knowledge and time rendered on desktop and mobile.'
