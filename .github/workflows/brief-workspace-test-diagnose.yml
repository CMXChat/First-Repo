name: Diagnose Brief Workspace Tests

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/brief-workspace-test-diagnose.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture all test results
        run: |
          set +e
          : > .brief-workspace-test-diagnosis
          for test in \
            tests/brief-device-smoke.test.js \
            tests/brief-terminal-smoke.test.js \
            tests/brief-entry-watch-smoke.test.js \
            tests/brief-stability-smoke.test.js \
            tests/brief-workspace-team-smoke.test.js; do
            echo "=== $test ===" >> .brief-workspace-test-diagnosis
            node "$test" >> .brief-workspace-test-diagnosis 2>&1
            echo "status=$?" >> .brief-workspace-test-diagnosis
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .brief-workspace-test-diagnosis
          git commit -m 'Record briefing workspace test diagnosis'
          git push
