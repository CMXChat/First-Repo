name: Check In Lab Automations Integration

on:
  push:
    branches: [main]
    paths:
      - 'lab/automations/**'
      - 'assets/lab/lab-loader.js'
      - 'assets/lab/lab-automation-builder.js'
      - 'assets/lab/lab-automations-main-bridge.js'
      - 'assets/lab/lab-automations-route-integration.js'
      - 'assets/lab/lab-automations-experience-v3.js'
      - 'assets/lab/lab-automations-experience-v3.css'
      - 'assets/lab/lab-automations-system-surface.js'
      - 'assets/lab/lab-automations-system-surface.css'
      - 'assets/lab/lab-actions.js'
      - '.github/workflows/checkin-lab-automations-integration.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lab/automations/**'
      - 'assets/lab/lab-loader.js'
      - 'assets/lab/lab-automation-builder.js'
      - 'assets/lab/lab-automations-main-bridge.js'
      - 'assets/lab/lab-automations-route-integration.js'
      - 'assets/lab/lab-automations-experience-v3.js'
      - 'assets/lab/lab-automations-experience-v3.css'
      - 'assets/lab/lab-automations-system-surface.js'
      - 'assets/lab/lab-automations-system-surface.css'
      - 'assets/lab/lab-actions.js'
      - '.github/workflows/checkin-lab-automations-integration.yml'

permissions:
  contents: read

jobs:
  validate-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate integration JavaScript
        run: |
          set -euo pipefail
          node --check assets/lab/lab-automations-main-bridge.js
          node --check assets/lab/lab-automations-route-integration.js
          node --check assets/lab/lab-automations-experience-v3.js
          node --check assets/lab/lab-automations-system-surface.js

      - name: Validate shared Lab contract
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import sys

          loader = Path('assets/lab/lab-loader.js').read_text(encoding='utf-8')
          old_builder = Path('assets/lab/lab-automation-builder.js').read_text(encoding='utf-8')
          focused = Path('assets/lab/lab-automations-experience-v3.js').read_text(encoding='utf-8')
          system_surface = Path('assets/lab/lab-automations-system-surface.js').read_text(encoding='utf-8')
          bridge = Path('assets/lab/lab-automations-main-bridge.js').read_text(encoding='utf-8')
          route = Path('assets/lab/lab-automations-route-integration.js').read_text(encoding='utf-8')
          html = Path('lab/automations/index.html').read_text(encoding='utf-8')
          action_library = Path('assets/lab/lab-actions.js').read_text(encoding='utf-8')

          required = {
              'loader': (loader, [
                  'lab-automation-builder.js',
                  'lab-automations-main-bridge.js',
                  'Focused Automations bridge was not inserted',
              ]),
              'bridge': (bridge, [
                  'cmx-lab-automations-v1',
                  '/lab/automations/',
                  'One Automation editor',
                  'data-focused-automation',
                  'labAutomationsIntegrated',
                  'reusable Action library',
              ]),
              'focused v3': (focused, [
                  'cmx-lab-automations-v1',
                  'cmx-lab-crm-v1',
                  'cmx-lab-inventory-v1',
                  'cmx-lab-actions-v1',
                  'type: "action_ref"',
                  'Start with a template',
                  'Run simulation',
                  'labAutomationsExperience',
                  '{ id: "trigger", label: "Trigger", short: "WHEN" }',
                  '{ id: "rules", label: "Rules", short: "IF" }',
                  '{ id: "actions", label: "Actions", short: "DO" }',
                  '{ id: "timing", label: "Timing", short: "WAIT" }',
                  '{ id: "review", label: "Review", short: "TEST" }',
              ]),
              'system surface': (system_surface, [
                  'CONTINUUM · AUTOMATIONS',
                  'v3-system-deck',
                  'CONNECTED RECORDS',
                  'REUSABLE ACTIONS',
                  'labAutomationsSystemSurface',
              ]),
              'action library': (action_library, [
                  'cmx-lab-actions-v1',
                  'sms:',
                  'email:',
                  'webhook:',
                  'digital_account:',
              ]),
              'route': (route, [
                  '/lab/#lab=view%3Aactions',
                  'data-open=',
                  '[data-new]',
                  'labAutomationsRouteIntegration',
              ]),
              'focused html': (html, [
                  '<title>Continuum · Automations</title>',
                  '/assets/lab/lab-automations-experience-v3.css?v=20260818-1',
                  '/assets/lab/lab-automations-system-surface.css?v=20260818-1',
                  '/assets/lab/lab-automations-experience-v3.js?v=20260818-1',
                  '/assets/lab/lab-automations-route-integration.js?v=20260818-1',
                  '/assets/lab/lab-automations-system-surface.js?v=20260818-1',
              ]),
          }

          for label, (text, terms) in required.items():
              for term in terms:
                  if term not in text:
                      sys.exit(f'{label} missing integration contract: {term}')

          if 'lab-automations-app-v2.js' in html:
              sys.exit('focused route still loads the superseded v2 builder')
          if 'MutationObserver' in system_surface:
              sys.exit('system surface must use targeted events rather than a broad DOM observer')

          storage = 'cmx-lab-automations-v1'
          if storage not in old_builder or storage not in focused or storage not in bridge:
              sys.exit('Lab and focused Automations no longer share the same draft store')

          if loader.index('lab-automation-builder.js') > loader.index('lab-automations-main-bridge.js'):
              sys.exit('focused bridge must load after the legacy Lab builder adapter')
          if loader.index('lab-automations-main-bridge.js') > loader.index('lab-acceptance.js'):
              sys.exit('focused bridge must load before final Lab acceptance hardening')

          print('Lab hub and Automations v3 system surface share drafts, records, Action references, one focused editor and bidirectional navigation.')
          PY

      - name: Browser integration smoke
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo 'No Chromium-compatible browser available.' >&2
            exit 1
          fi

          node - <<'NODE'
          const fs = require('fs');
          const { transformSnapshot } = require('./assets/lab/lab-loader.js');
          const snapshot = fs.readFileSync('assets/lab/checkin-index-snapshot.html', 'utf8');
          fs.writeFileSync('lab-integration-smoke.html', transformSnapshot(snapshot).replace('upgrade-insecure-requests', ''), 'utf8');
          NODE

          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/checkin-lab-integration-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -f lab-integration-smoke.html' EXIT
          sleep 1

          dump() {
            "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=10000 "$@" --dump-dom
          }

          dump http://127.0.0.1:8000/lab-integration-smoke.html > /tmp/lab-hub.html
          grep -q 'data-lab-automations-integrated="ready"' /tmp/lab-hub.html
          grep -q 'id="labAutomationWorkspace"' /tmp/lab-hub.html
          grep -q 'Automation workspace' /tmp/lab-hub.html
          grep -q 'Open Automations' /tmp/lab-hub.html
          grep -q 'WORKSPACE' /tmp/lab-hub.html
          grep -q 'CONNECTED' /tmp/lab-hub.html
          grep -q 'reusable Action library' /tmp/lab-hub.html

          dump http://127.0.0.1:8000/lab/automations/ > /tmp/focused-dashboard.html
          grep -q 'data-lab-automations-experience="v3"' /tmp/focused-dashboard.html
          grep -q 'data-lab-automations-system-surface="ready"' /tmp/focused-dashboard.html
          grep -q 'CONTINUUM · AUTOMATIONS' /tmp/focused-dashboard.html
          grep -q '>WORKFLOWS<' /tmp/focused-dashboard.html
          grep -q '>Templates<' /tmp/focused-dashboard.html
          grep -q 'New automation' /tmp/focused-dashboard.html
          grep -q 'Missed check-in escalation' /tmp/focused-dashboard.html
          ! grep -q 'Build the flow' /tmp/focused-dashboard.html

          dump 'http://127.0.0.1:8000/lab/automations/?automation=auto-grace-escalation&from=lab' > /tmp/focused-deeplink.html
          grep -q 'data-lab-automations-route-integration="ready"' /tmp/focused-deeplink.html
          grep -q 'data-lab-automations-experience="v3"' /tmp/focused-deeplink.html
          grep -q 'data-lab-automations-system-surface="ready"' /tmp/focused-deeplink.html
          grep -q 'class="v3-editor-page"' /tmp/focused-deeplink.html
          grep -q 'Grace escalation' /tmp/focused-deeplink.html
          grep -q 'href="/lab/#lab=view%3Aactions"' /tmp/focused-deeplink.html
          grep -q 'Build the action stack' /tmp/focused-deeplink.html || grep -q 'What should start this' /tmp/focused-deeplink.html

          dump 'http://127.0.0.1:8000/lab/automations/?new=1&from=lab' > /tmp/focused-new.html
          grep -q 'data-lab-automations-route-integration="ready"' /tmp/focused-new.html
          grep -q 'data-lab-automations-experience="v3"' /tmp/focused-new.html
          grep -q 'data-lab-automations-system-surface="ready"' /tmp/focused-new.html
          grep -q 'class="v3-editor-page"' /tmp/focused-new.html
          grep -q 'What should start this' /tmp/focused-new.html
          if grep -q 'Name the automation' /tmp/focused-new.html; then
            echo 'The superseded seven-step name-first wizard is still visible.' >&2
            exit 1
          fi

          echo 'Lab hub ↔ Automations v3 system surface integration passed on headless Chromium.'
