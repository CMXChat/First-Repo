name: Continuum Automations Archive Integration

on:
  push:
    branches: [main]
    paths:
      - 'automations/**'
      - 'archive/continuum-lab/**'
      - 'assets/lab/lab-loader.js'
      - 'assets/lab/lab-automation-builder.js'
      - 'assets/lab/lab-automations-main-bridge.js'
      - 'assets/lab/lab-automations-route-integration.js'
      - 'assets/lab/lab-automations-experience-v3.js'
      - 'assets/lab/lab-automations-system-surface.js'
      - 'assets/lab/lab-actions.js'
      - '.github/workflows/checkin-lab-automations-integration.yml'
  pull_request:
    branches: [main]
    paths:
      - 'automations/**'
      - 'archive/continuum-lab/**'
      - 'assets/lab/lab-loader.js'
      - 'assets/lab/lab-automation-builder.js'
      - 'assets/lab/lab-automations-main-bridge.js'
      - 'assets/lab/lab-automations-route-integration.js'
      - 'assets/lab/lab-automations-experience-v3.js'
      - 'assets/lab/lab-automations-system-surface.js'
      - 'assets/lab/lab-actions.js'
      - '.github/workflows/checkin-lab-automations-integration.yml'

permissions:
  contents: read

jobs:
  validate-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate current Automations and archived integration sources
        run: |
          set -euo pipefail
          node --check assets/lab/lab-automations-main-bridge.js
          node --check assets/lab/lab-automations-route-integration.js
          node --check assets/lab/lab-automations-experience-v3.js
          node --check assets/lab/lab-automations-system-surface.js

          python - <<'PY'
          from pathlib import Path

          focused = Path('automations/index.html').read_text(encoding='utf-8')
          archive = Path('archive/continuum-lab/index.html').read_text(encoding='utf-8')
          bridge = Path('assets/lab/lab-automations-main-bridge.js').read_text(encoding='utf-8')
          route = Path('assets/lab/lab-automations-route-integration.js').read_text(encoding='utf-8')

          required_focused = [
              '<title>Continuum · Automations</title>',
              '/assets/lab/lab-automations-experience-v3.js',
              '/assets/lab/lab-automations-route-integration.js',
              '/assets/lab/lab-automations-system-surface.js',
          ]
          for term in required_focused:
              if term not in focused:
                  raise SystemExit(f'focused Automations missing {term}')

          if '/assets/lab/lab-loader.js?v=20260819-planner-signals-v3' not in archive:
              raise SystemExit('archived integrated snapshot no longer loads the accepted Lab loader')
          if '/automations/' not in bridge:
              raise SystemExit('archived bridge no longer points to canonical /automations/')
          if '/control/' not in route:
              raise SystemExit('focused Automations no longer returns to canonical /control/')
          if '/lab/#lab=view%3Aactions' in route:
              raise SystemExit('focused Automations still returns to retired /lab launcher')
          if Path('lab').exists():
              raise SystemExit('retired top-level lab directory returned')

          print('Archived integrated snapshot and canonical /automations/ remain connected without restoring /lab routes.')
          PY

      - name: Browser smoke canonical Automations
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo 'No Chromium-compatible browser available.' >&2
            exit 1
          fi

          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/continuum-automations-integration-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1

          "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=390,844 --virtual-time-budget=12000 --dump-dom \
            'http://127.0.0.1:8000/automations/' > /tmp/continuum-automations.html

          grep -q 'data-lab-automations-experience="v3"' /tmp/continuum-automations.html
          grep -q 'data-lab-automations-system-surface="ready"' /tmp/continuum-automations.html
          grep -q 'CONTINUUM · AUTOMATIONS' /tmp/continuum-automations.html
          grep -q 'href="/control/"' /tmp/continuum-automations.html
          echo 'Canonical /automations/ integration smoke passed.'
