name: Bump Brief Navigation Bridge Cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/brief-navigation-cache.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Bump direct bridge cache
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('brief/index.html')
          text = path.read_text()
          old = 'brief-terminal-bridge.js?v=20260803-4'
          new = 'brief-terminal-bridge.js?v=20260803-5'
          if old not in text and new not in text:
              raise SystemExit('terminal bridge cache marker not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit cache bump
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add brief/index.html
          git commit -m 'Bump interconnected navigation bridge cache' || exit 0
          git push
