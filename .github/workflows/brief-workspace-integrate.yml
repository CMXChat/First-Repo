name: Integrate Brief Workspace and Team

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/brief-workspace-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Integrate quick workspace and Team briefing
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing integration marker: {label}')
              return text.replace(old, new, 1)

          # HTML: fifth entry choice, Team data before core, updated product copy and cache versions.
          path = Path('brief/index.html')
          text = path.read_text()
          text = replace_once(
              text,
              '          <option value="trainer">Nina + Sam · Trainer and student</option>',
              '          <option value="trainer">Nina + Sam · Trainer and student</option>\n          <option value="team">Atlas · Team and project</option>',
              'team entry option'
          )
          text = text.replace('FOUR WAYS THE SAME PLATFORM CAN FEEL COMPLETELY DIFFERENT', 'FIVE WAYS THE SAME PLATFORM CAN FEEL COMPLETELY DIFFERENT')
          text = replace_once(
              text,
              '  <script src="/assets/brief/brief-scenarios.js?v=20260803-1" defer></script>',
              '  <script src="/assets/brief/brief-scenarios.js?v=20260803-1" defer></script>\n  <script src="/assets/brief/brief-team-data.js?v=20260803-1" defer></script>',
              'team data loader'
          )
          text = text.replace('brief-config.js?v=20260803-9', 'brief-config.js?v=20260803-10')
          text = text.replace('brief-terminal-bridge.js?v=20260803-2', 'brief-terminal-bridge.js?v=20260803-3')
          path.write_text(text)

          # Config: Team selection, workspace assets and deterministic final load order.
          path = Path('assets/brief/brief-config.js')
          text = path.read_text()
          text = text.replace("entry: '20260803-4'", "entry: '20260803-5'")
          text = text.replace("terminal: '20260803-1',\n    watch: '20260803-2'", "terminal: '20260803-2',\n    watch: '20260803-2',\n    team: '20260803-1',\n    workspace: '20260803-1'")
          text = replace_once(
              text,
              "    partners: 'Business',\n    trainer: 'Trainer + student'",
              "    partners: 'Business',\n    trainer: 'Trainer + student',\n    team: 'Team + project'",
              'Team config label'
          )
          text = text.replace(
              'one person, a relationship, business partners, or a trainer and student',
              'one person, a relationship, business partners, a trainer and student, or a role-based team'
          )
          text = text.replace('switch between all four inside', 'switch between all five inside')
          text = text.replace('Choose Personal, Relationship, Business, or Trainer + student first.', 'Choose Personal, Relationship, Business, Trainer + student, or Team + project first.')
          text = replace_once(
              text,
              "  loadStyle('briefRelationshipWatchStyle', `/assets/brief/brief-relationship-watch.css?v=${build.watch}`);",
              "  loadStyle('briefRelationshipWatchStyle', `/assets/brief/brief-relationship-watch.css?v=${build.watch}`);\n  loadStyle('briefWorkspaceStyle', `/assets/brief/brief-workspace.css?v=${build.workspace}`);",
              'workspace stylesheet'
          )
          text = replace_once(
              text,
              "                        loadScript('briefRelationshipWatchScript', `/assets/brief/brief-relationship-watch.js?v=${build.watch}`);",
              "                        loadScript('briefRelationshipWatchScript', `/assets/brief/brief-relationship-watch.js?v=${build.watch}`, () => {\n                          loadScript('briefTeamRendererScript', `/assets/brief/brief-team-renderer.js?v=${build.team}`, () => {\n                            loadScript('briefWorkspaceScript', `/assets/brief/brief-workspace.js?v=${build.workspace}`);\n                          });\n                        });",
              'workspace script chain'
          )
          path.write_text(text)

          # Team compatibility: base renderer can safely build before the dedicated Team renderer replaces it.
          path = Path('assets/brief/brief-team-data.js')
          text = path.read_text()
          marker = "    summary: 'Each member receives the assignments, handoffs, procedures and risks relevant to their role. Shared spaces hold approved project truth while sensitive records remain restricted.',\n    members: ["
          replacement = "    summary: 'Each member receives the assignments, handoffs, procedures and risks relevant to their role. Shared spaces hold approved project truth while sensitive records remain restricted.',\n    dayCycle: [\n      { time: 'Start', title: 'Open the role-specific view', text: 'Each member begins with assigned work, dependencies and approved preparation.' },\n      { time: 'Handoff', title: 'Move evidence with the work', text: 'The sender, receiver, required proof and current blocker remain visible.' },\n      { time: 'Close', title: 'Update shared project truth', text: 'Completed work, unresolved risk and tomorrow’s owner are recorded once.' }\n    ],\n    intelligence: [\n      { label: 'Readiness', title: 'Launch state', value: '82%', note: 'One permissions blocker remains.' },\n      { label: 'Handoffs', title: 'Due today', value: '3', note: 'Each transfer has a sender and receiver.' },\n      { label: 'Finance', title: 'Budget status', value: 'In range', note: 'Members see only the context needed for their work.' },\n      { label: 'Security', title: 'Access model', value: 'Role-based', note: 'Private, role, project and leadership spaces remain separate.' }\n    ],\n    members: ["
          text = replace_once(text, marker, replacement, 'Team compatibility data')
          path.write_text(text)

          # Daily content: five quote rotations, Team music, Team footer and permanent-file boundary.
          path = Path('assets/brief/brief-daily-content.js')
          text = path.read_text()
          text = text.replace('schemaVersion: 2', 'schemaVersion: 3', 1)
          text = replace_once(
              text,
              "    trainer: [\n      { title: 'POWER', artist: 'Kanye West', spotify: '2gZUPNdnz5Y45eiGxpHGSc', note: 'Working sets' },\n      { title: 'Till I Collapse', artist: 'Eminem feat. Nate Dogg', spotify: '4xkOaSrkexMciUUogZKVTS', note: 'Final effort' },\n      { title: 'Sunflower', artist: 'Post Malone and Swae Lee', spotify: '0RiRZpuVRbi7oqRdSMwhQY', note: 'Cooldown' }\n    ]",
              "    trainer: [\n      { title: 'POWER', artist: 'Kanye West', spotify: '2gZUPNdnz5Y45eiGxpHGSc', note: 'Working sets' },\n      { title: 'Till I Collapse', artist: 'Eminem feat. Nate Dogg', spotify: '4xkOaSrkexMciUUogZKVTS', note: 'Final effort' },\n      { title: 'Sunflower', artist: 'Post Malone and Swae Lee', spotify: '0RiRZpuVRbi7oqRdSMwhQY', note: 'Cooldown' }\n    ],\n    team: [\n      { title: 'Midnight City', artist: 'M83', spotify: '1eyzqe2QqGZUmfcPZtrIyt', note: 'Build focus' },\n      { title: 'On Top Of The World', artist: 'Imagine Dragons', spotify: '213x4gsFDm04hSqIUkg88w', note: 'Team lift' },\n      { title: 'A Sky Full of Stars', artist: 'Coldplay', spotify: '0FDzzruyVECATHXKHFs9eJ', note: 'Release moment' }\n    ]",
              'Team daily music'
          )
          quote_block = "  dailyQuotes: {\n    individual: 'A useful day begins when the next honest action becomes visible.',\n    couple: 'Care becomes practical when both people can see the next kind action.',\n    partners: 'Clarity compounds when every decision has evidence, an owner and a date.',\n    trainer: 'Consistency becomes easier when the plan fits the person.',\n    team: 'A strong team sees the same mission without exposing every private detail.'\n  },\n"
          text = replace_once(text, '  personalDashboard: {', quote_block + '  personalDashboard: {', 'daily quote rotation')
          text = replace_once(
              text,
              "    { id: 'trainer', title: 'Trainer + student', text: 'Habits, goals, evidence, notes, privacy and coaching actions.' }",
              "    { id: 'trainer', title: 'Trainer + student', text: 'Habits, goals, evidence, notes, privacy and coaching actions.' },\n    { id: 'team', title: 'Team + project', text: 'Role-based member views, shared project truth, handoffs, procedures, finance and security.' }",
              'Team footer view'
          )
          text = text.replace("['individual', 'couple', 'partners', 'trainer']", "['individual', 'couple', 'partners', 'trainer', 'team']")
          text = text.replace("const tracks = content.music[id === 'individual' ? 'personal' : id] || [];", "const tracks = content.music[id === 'individual' ? 'personal' : id] || [];")
          boundary_marker = "      'assets/brief/brief-experience.js'"
          boundary_replacement = "      'assets/brief/brief-experience.js',\n      'assets/brief/brief-team-data.js',\n      'assets/brief/brief-team-renderer.js',\n      'assets/brief/brief-workspace.js',\n      'assets/brief/brief-workspace.css'"
          text = text.replace(boundary_marker, boundary_replacement, 1)
          path.write_text(text)

          # Workspace quotes should be editable in the daily file.
          path = Path('assets/brief/brief-workspace.js')
          text = path.read_text()
          text = replace_once(
              text,
              '    return values[current];',
              '    return content().dailyQuotes?.[current] || values[current];',
              'daily quote source'
          )
          path.write_text(text)

          # Terminal: fifth briefing, Team console, commands and summaries.
          path = Path('assets/brief/brief-terminal.js')
          text = path.read_text()
          text = text.replace("const VALID_PRESETS = ['individual', 'couple', 'partners', 'trainer'];", "const VALID_PRESETS = ['individual', 'couple', 'partners', 'trainer', 'team'];")
          team_terminal = """    team: {
      label: 'Team briefing terminal',
      prompt: 'team@brief:~/project$',
      intro: 'Team console ready. Review member work, project truth, handoffs, procedures, finance and access boundaries.',
      quick: ['summary', 'mywork', 'project', 'handoffs', 'procedure', 'security'],
      modules: {
        today: ['#today', 'Opening the Team briefing'],
        quick: ['#briefWorkspace', 'Opening the concise Team briefing'],
        mywork: ['#scenarioStage .team-role-console', 'Opening role-based member work'],
        project: ['#scenarioStage .team-progress-panel', 'Opening the shared project timeline'],
        handoffs: ['#scenarioStage .team-handoff-board', 'Opening project handoffs'],
        procedure: ['#scenarioStage .team-procedure-board', 'Opening procedure readiness'],
        finance: ['#scenarioStage .team-finance-watch', 'Opening approved financial context'],
        spaces: ['#scenarioStage .team-space-map', 'Opening users, roles and spaces'],
        security: ['#scenarioStage .team-security-boundary', 'Opening planned security boundaries'],
        actions: ['#priorities', 'Opening Team actions'],
        schedule: ['#schedule', 'Opening the Team schedule'],
        connections: ['#connections', 'Opening Team connection status']
      }
    }
"""
          marker = '\n  };\n\n  let initialized'
          if marker not in text:
              raise SystemExit('missing terminal object marker')
          text = text.replace(marker, ',\n' + team_terminal + '  };\n\n  let initialized', 1)
          text = text.replace("      training: 'trainer'", "      training: 'trainer',\n      team: 'team',\n      project: 'team',\n      crew: 'team'")
          text = text.replace("      trainer: `Trainer briefing active in ${boundaries}. Student answers, trainer rules and AI suggestions remain separately labeled. Health guidance is demonstrative, not medical care.`", "      trainer: `Trainer briefing active in ${boundaries}. Student answers, trainer rules and AI suggestions remain separately labeled. Health guidance is demonstrative, not medical care.`,\n      team: `Team briefing active in ${boundaries}. Member, role, project and leadership spaces keep different visibility while approved project truth stays shared.`")
          text = text.replace('view personal|relationship|business|trainer.', 'view personal|relationship|business|trainer|team.')
          text = text.replace("['personal', 'individual', 'relationship', 'couple', 'business', 'partners', 'trainer', 'training']", "['personal', 'individual', 'relationship', 'couple', 'business', 'partners', 'trainer', 'training', 'team', 'project', 'crew']")
          text = text.replace("preset() === 'partners' ? 'business' : 'trainer'", "preset() === 'partners' ? 'business' : preset() === 'trainer' ? 'trainer' : 'team'")
          path.write_text(text)

          # Terminal bridge aliases and concise help syntax.
          path = Path('assets/brief/brief-terminal-bridge.js')
          text = path.read_text()
          text = text.replace("    trainer: 'trainer',\n    training: 'trainer'", "    trainer: 'trainer',\n    training: 'trainer',\n    team: 'team',\n    project: 'team',\n    crew: 'team'")
          text = text.replace("    partners: 'Business',\n    trainer: 'Trainer'", "    partners: 'Business',\n    trainer: 'Trainer',\n    team: 'Team'")
          text = text.replace('brief personal|relationship|business|trainer', 'brief personal|relationship|business|trainer|team')
          path.write_text(text)

          PY

      - name: Validate syntax before commit
        run: |
          node --check assets/brief/brief-config.js
          node --check assets/brief/brief-team-data.js
          node --check assets/brief/brief-team-renderer.js
          node --check assets/brief/brief-workspace.js
          node --check assets/brief/brief-terminal.js
          node --check assets/brief/brief-terminal-bridge.js
          node --check assets/brief/brief-daily-content.js

      - name: Commit integrated experience
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add brief/index.html assets/brief/brief-config.js assets/brief/brief-team-data.js assets/brief/brief-daily-content.js assets/brief/brief-workspace.js assets/brief/brief-terminal.js assets/brief/brief-terminal-bridge.js
          git commit -m 'Integrate condensed workspace and Team briefing'
          git push
