name: Brief Browser Matrix

on:
  push:
    branches: [main]
    paths:
      - 'brief/**'
      - 'brief-next/**'
      - 'assets/brief/**'
      - 'assets/cmx-routes.json'
      - 'tests/brief-next.spec.cjs'
      - 'tests/brief-browser-matrix.playwright.config.cjs'
      - '.github/workflows/brief-browser-matrix.yml'
  pull_request:
    paths:
      - 'brief/**'
      - 'brief-next/**'
      - 'assets/brief/**'
      - 'assets/cmx-routes.json'
      - 'tests/brief-next.spec.cjs'
      - 'tests/brief-browser-matrix.playwright.config.cjs'
      - '.github/workflows/brief-browser-matrix.yml'

concurrency:
  group: brief-browser-matrix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run current Brief across Chromium, Firefox, WebKit, iPhone and Android
        run: npx playwright test --config=tests/brief-browser-matrix.playwright.config.cjs

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: brief-browser-test-results
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
