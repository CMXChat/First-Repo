name: Spaces Browser Matrix

on:
  push:
    branches: [main]
    paths:
      - 'spaces/**'
      - 'brief/**'
      - 'brief-next/**'
      - 'doc/**'
      - 'assets/brief/**'
      - 'assets/personal-os-doc*.js'
      - 'assets/personal-os-doc*.css'
      - 'assets/spaces-legacy-redirect.js'
      - 'assets/daily-video.js'
      - 'tests/brief-browser-e2e.spec.cjs'
      - 'tests/brief-topbar-music-e2e.spec.cjs'
      - 'tests/brief-clarity-e2e.spec.cjs'
      - 'tests/doc-mobile-contents-e2e.spec.cjs'
      - 'tests/brief-theme-e2e.spec.cjs'
      - 'tests/brief-finalization-e2e.spec.cjs'
      - 'tests/playwright.config.cjs'
      - '.github/workflows/brief-browser-matrix.yml'
  pull_request:
    paths:
      - 'spaces/**'
      - 'brief/**'
      - 'brief-next/**'
      - 'doc/**'
      - 'assets/brief/**'
      - 'assets/personal-os-doc*.js'
      - 'assets/personal-os-doc*.css'
      - 'assets/spaces-legacy-redirect.js'
      - 'assets/daily-video.js'
      - 'tests/brief-browser-e2e.spec.cjs'
      - 'tests/brief-topbar-music-e2e.spec.cjs'
      - 'tests/brief-clarity-e2e.spec.cjs'
      - 'tests/doc-mobile-contents-e2e.spec.cjs'
      - 'tests/brief-theme-e2e.spec.cjs'
      - 'tests/brief-finalization-e2e.spec.cjs'
      - 'tests/playwright.config.cjs'
      - '.github/workflows/brief-browser-matrix.yml'

permissions:
  contents: read

jobs:
  browser-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Chromium, Firefox, WebKit, iPhone and Android Spaces tests
        run: npx playwright test --config=tests/playwright.config.cjs --timeout=45000

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spaces-browser-test-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
