name: Diagnose Brief Workspace Integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/brief-workspace-diagnose.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check migration markers
        run: |
          python - <<'PY'
          from pathlib import Path

          checks = [
            ('html team option', 'brief/index.html', '          <option value="trainer">Nina + Sam · Trainer and student</option>'),
            ('html scenarios loader', 'brief/index.html', '  <script src="/assets/brief/brief-scenarios.js?v=20260803-1" defer></script>'),
            ('config labels', 'assets/brief/brief-config.js', "    partners: 'Business',\n    trainer: 'Trainer + student'"),
            ('config style', 'assets/brief/brief-config.js', "  loadStyle('briefRelationshipWatchStyle', `/assets/brief/brief-relationship-watch.css?v=${build.watch}`);"),
            ('config chain', 'assets/brief/brief-config.js', "                        loadScript('briefRelationshipWatchScript', `/assets/brief/brief-relationship-watch.js?v=${build.watch}`);"),
            ('team compatibility', 'assets/brief/brief-team-data.js', "    summary: 'Each member receives the assignments, handoffs, procedures and risks relevant to their role. Shared spaces hold approved project truth while sensitive records remain restricted.',\n    members: ["),
            ('daily trainer music', 'assets/brief/brief-daily-content.js', "    trainer: [\n      { title: 'POWER', artist: 'Kanye West', spotify: '2gZUPNdnz5Y45eiGxpHGSc', note: 'Working sets' },\n      { title: 'Till I Collapse', artist: 'Eminem feat. Nate Dogg', spotify: '4xkOaSrkexMciUUogZKVTS', note: 'Final effort' },\n      { title: 'Sunflower', artist: 'Post Malone and Swae Lee', spotify: '0RiRZpuVRbi7oqRdSMwhQY', note: 'Cooldown' }\n    ]"),
            ('daily quote insertion', 'assets/brief/brief-daily-content.js', '  personalDashboard: {'),
            ('daily footer', 'assets/brief/brief-daily-content.js', "    { id: 'trainer', title: 'Trainer + student', text: 'Habits, goals, evidence, notes, privacy and coaching actions.' }"),
            ('workspace quote', 'assets/brief/brief-workspace.js', '    return values[current];'),
            ('terminal object', 'assets/brief/brief-terminal.js', '\n  };\n\n  let initialized'),
          ]
          lines = []
          for name, file, marker in checks:
              found = marker in Path(file).read_text()
              lines.append(f'{name}: {"PASS" if found else "FAIL"}')
          Path('.brief-workspace-diagnosis').write_text('\n'.join(lines) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .brief-workspace-diagnosis
          git commit -m 'Record briefing integration diagnosis'
          git push
