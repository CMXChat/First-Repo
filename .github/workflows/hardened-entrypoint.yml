name: Hardened API entry point

on:
  pull_request:
    paths:
      - 'backend/app/hardened.py'
      - 'backend/app/write_security.py'
      - 'backend/tests/test_write_security.py'
      - 'backend/compose.yml'
      - 'backend/compose.secure.yml'
      - 'backend/Dockerfile'
      - 'backend/requirements*.txt'
      - '.github/workflows/hardened-entrypoint.yml'
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'backend/app/hardened.py'
      - 'backend/app/write_security.py'
      - 'backend/tests/test_write_security.py'
      - 'backend/compose.yml'
      - 'backend/compose.secure.yml'
      - 'backend/Dockerfile'
      - 'backend/requirements*.txt'
      - '.github/workflows/hardened-entrypoint.yml'

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Compile hardened entry point
        working-directory: backend
        run: python -m compileall -q app/hardened.py app/write_security.py

      - name: Run write-security tests
        working-directory: backend
        run: pytest tests/test_write_security.py

  secure-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare non-secret configuration
        run: cp backend/.env.example backend/.env

      - name: Validate secure Compose merge
        run: >-
          docker compose
          --env-file backend/.env
          --file backend/compose.yml
          --file backend/compose.secure.yml
          config >/dev/null

      - name: Build secure application image
        run: docker build --file backend/Dockerfile --tag cmx-restricted-node:secure-test .
