name: Brief Onboarding Validation V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/brief-onboarding-validation-v2.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run seven source tests
        id: static
        continue-on-error: true
        run: |
          set +e
          : > /tmp/static.log
          failures=0
          for file in tests/brief-device-smoke.test.js tests/brief-onboarding-smoke.test.js tests/brief-terminal-smoke.test.js tests/brief-entry-watch-smoke.test.js tests/brief-stability-smoke.test.js tests/brief-workspace-team-smoke.test.js tests/brief-polish-smoke.test.js; do
            node "$file" >> /tmp/static.log 2>&1
            status=$?
            echo "$file status=$status" >> /tmp/static.log
            if [ "$status" -ne 0 ]; then failures=$((failures + 1)); fi
          done
          echo "failures=$failures" >> "$GITHUB_OUTPUT"

      - name: Install browser engines
        id: install
        continue-on-error: true
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium firefox webkit

      - name: Run browser matrix
        id: browser
        continue-on-error: true
        run: |
          set +e
          npx playwright test --config=tests/playwright.config.cjs --reporter=line > /tmp/browser.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Write result
        if: always()
        run: |
          {
            echo '# Brief onboarding browser validation'
            echo
            echo "Validated commit: \`$GITHUB_SHA\`"
            echo
            echo '## Coverage'
            echo
            echo '- Seven source-level regression suites'
            echo '- Chromium desktop'
            echo '- Firefox desktop'
            echo '- WebKit desktop'
            echo '- WebKit iPhone 13 emulation'
            echo '- Chromium Pixel 5 emulation'
            echo '- Portrait and landscape bounds'
            echo '- Entry, question-mark help, six-step tour, tips, focus, Pause to Play, Team, Quick and Full workspace'
            echo
            echo '## Result'
            echo
            echo "Static failures: ${{ steps.static.outputs.failures }}"
            echo "Browser status: ${{ steps.browser.outputs.status }}"
            echo "Install outcome: ${{ steps.install.outcome }}"
            echo
            echo '## Static output'
            echo
            echo '```text'
            cat /tmp/static.log 2>/dev/null || true
            echo '```'
            echo
            echo '## Browser summary'
            echo
            echo '```text'
            grep -E 'passed|failed|flaky|skipped|Error:|TimeoutError|Running [0-9]+ tests' /tmp/browser.log 2>/dev/null | tail -100 || true
            echo '```'
          } > docs/brief-onboarding-browser-validation.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/brief-onboarding-browser-validation.md
          git commit -m 'Record current onboarding browser validation'
          git push

      - name: Enforce pass
        if: always()
        run: |
          test "${{ steps.static.outputs.failures }}" = "0"
          test "${{ steps.install.outcome }}" = "success"
          test "${{ steps.browser.outputs.status }}" = "0"
