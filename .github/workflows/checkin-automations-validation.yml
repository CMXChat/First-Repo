name: Check In Automations Validation

on:
  push:
    branches: [main]
    paths:
      - 'lab/automations/**'
      - 'assets/lab/lab-automations-*.js'
      - 'assets/lab/lab-automations-*.css'
      - 'assets/lab/lab-actions.js'
      - 'docs/checkin-automations-frontend-CURRENT.md'
      - 'docs/checkin-automations-system-surface-CURRENT.md'
      - 'docs/checkin-lab-automations-integration-CURRENT.md'
      - 'docs/continuum-automations-master-plan-CURRENT.md'
      - '.github/workflows/checkin-automations-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lab/automations/**'
      - 'assets/lab/lab-automations-*.js'
      - 'assets/lab/lab-automations-*.css'
      - 'assets/lab/lab-actions.js'
      - 'docs/checkin-automations-frontend-CURRENT.md'
      - 'docs/checkin-automations-system-surface-CURRENT.md'
      - 'docs/checkin-lab-automations-integration-CURRENT.md'
      - 'docs/continuum-automations-master-plan-CURRENT.md'
      - '.github/workflows/checkin-automations-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate JavaScript and focused safety contract
        run: |
          set -euo pipefail
          node --check assets/lab/lab-automations-experience-v3.js
          node --check assets/lab/lab-automations-route-integration.js
          node --check assets/lab/lab-automations-system-surface.js
          node --check assets/lab/lab-automations-progressive-preview.js
          node --check assets/lab/lab-automations-platform-v4.js
          node --check assets/lab/lab-automations-scenarios-v4.js
          python - <<'PY'
          from pathlib import Path
          import sys

          files = {
              'html': Path('lab/automations/index.html').read_text(encoding='utf-8'),
              'v3': Path('assets/lab/lab-automations-experience-v3.js').read_text(encoding='utf-8'),
              'system': Path('assets/lab/lab-automations-system-surface.js').read_text(encoding='utf-8'),
              'progressive': Path('assets/lab/lab-automations-progressive-preview.js').read_text(encoding='utf-8'),
              'platform': Path('assets/lab/lab-automations-platform-v4.js').read_text(encoding='utf-8'),
              'scenarios': Path('assets/lab/lab-automations-scenarios-v4.js').read_text(encoding='utf-8'),
              'platform_css': Path('assets/lab/lab-automations-platform-v4.css').read_text(encoding='utf-8'),
              'platform_qa': Path('assets/lab/lab-automations-platform-v4-qa.css').read_text(encoding='utf-8'),
              'route': Path('assets/lab/lab-automations-route-integration.js').read_text(encoding='utf-8'),
              'actions': Path('assets/lab/lab-actions.js').read_text(encoding='utf-8'),
          }

          required = {
              'html': [
                  "connect-src 'self'", 'noindex,nofollow', '<title>Continuum · Automations</title>',
                  'lab-automations-experience-v3.js?v=20260818-1',
                  'lab-automations-progressive-preview.js?v=20260818-final1',
                  'lab-automations-platform-v4.css?v=20260818-v4',
                  'lab-automations-platform-v4-qa.css?v=20260818-v4qa1',
                  'lab-automations-platform-v4.js?v=20260818-v4',
                  'lab-automations-scenarios-v4.js?v=20260818-v4',
              ],
              'v3': [
                  'cmx-lab-automations-v1', 'cmx-lab-crm-v1', 'cmx-lab-inventory-v1',
                  'cmx-lab-actions-v1', 'What should start this?', 'Only continue when',
                  'Build the action stack', 'Simulate the Automation', 'Run simulation',
                  'type: "action_ref"', 'scheduleAutosave', 'External execution remains off',
              ],
              'platform': [
                  'CMXAutomationCapabilityCatalog', 'CONTINUUM CAPABILITIES',
                  'AI PLANNER · PREVIEW', 'RUN HISTORY', 'RUNTIME OFF',
                  'data-v4-flow-stage', 'TEST THIS STEP', 'LAB NOW', 'LATER',
                  'new URLSearchParams(location.search).get("new") !== "1"',
              ],
              'scenarios': [
                  'Weekly planning review', 'Grace-window heads-up', 'Final continuity review',
                  'AI note summary', 'Six-hour reminder', 'Daily records check',
                  'No-ack follow-up', 'AI briefing with review', 'data-v4-scenario', '?automation=',
              ],
              'progressive': [
                  'FLOW PREVIEW', 'Choose a trigger', 'Choose an action', 'Not set yet',
                  'maxAllowedStage', 'data-progressive-preview', 'Finish this step first',
              ],
              'platform_css': [
                  '.v4-workspace-nav', '.v4-capability-grid', '.v4-stage-tools',
                  '.v4-preflight-banner', '.v4-runs-panel', '.v4-modal-backdrop',
                  '@media (max-width:760px)', 'env(safe-area-inset-bottom)', 'prefers-reduced-motion',
              ],
              'platform_qa': [
                  '.v3-system-deck[hidden]', '.v3-template-section[hidden]',
                  '.v4-runs-panel[hidden]', 'display:none!important',
              ],
              'route': ['/lab/#lab=view%3Aactions', '[data-new]', 'data-open=', 'labAutomationsRouteIntegration'],
              'actions': ['cmx-lab-actions-v1', 'sms:', 'email:', 'ai:', 'webhook:', 'digital_account:'],
          }

          for name, terms in required.items():
              for term in terms:
                  if term not in files[name]:
                      sys.exit(f'missing {name} contract: {term}')

          if 'lab-automations-app-v2.js' in files['html']:
              sys.exit('superseded v2 builder must not be loaded')

          combined = ''.join(files[name] for name in ['html', 'v3', 'system', 'progressive', 'platform', 'scenarios'])
          if 'api.cmxchat.com' in combined:
              sys.exit('focused Lab must not call production Check In API')

          for name in ['system', 'progressive', 'platform', 'scenarios']:
              for term in ['eval(', 'new Function(', 'MutationObserver']:
                  if term in files[name]:
                      sys.exit(f'forbidden {name} pattern: {term}')

          print('Focused Automations v4 static, scenario, safety and compatibility contracts passed.')
          PY

      - name: Browser smoke desktop and mobile
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo 'No Chromium-compatible browser available.' >&2
            exit 1
          fi
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/checkin-auto-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          dump() { "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=12000 "$@" --dump-dom; }

          dump http://127.0.0.1:8000/lab/automations/ > /tmp/auto-desktop.html
          grep -q 'data-lab-automations-experience="v3"' /tmp/auto-desktop.html
          grep -q 'data-lab-automations-system-surface="ready"' /tmp/auto-desktop.html
          grep -q 'data-lab-automations-platform="v4"' /tmp/auto-desktop.html
          grep -q 'data-lab-automations-scenarios="v4"' /tmp/auto-desktop.html
          grep -q '>YOUR AUTOMATIONS<' /tmp/auto-desktop.html
          grep -q '>Automations<' /tmp/auto-desktop.html
          grep -q '>Templates<' /tmp/auto-desktop.html
          grep -q '>Runs<' /tmp/auto-desktop.html
          grep -q 'Capabilities' /tmp/auto-desktop.html
          grep -q 'Weekly planning review' /tmp/auto-desktop.html
          grep -q 'No-ack follow-up' /tmp/auto-desktop.html
          grep -q 'LAB · SIMULATION ONLY' /tmp/auto-desktop.html
          ! grep -qi 'Build the flow' /tmp/auto-desktop.html
          ! grep -qi 'Loading Automations' /tmp/auto-desktop.html

          dump --window-size=390,844 'http://127.0.0.1:8000/lab/automations/?new=1&from=lab' > /tmp/auto-mobile.html
          grep -q 'data-lab-automations-experience="v3"' /tmp/auto-mobile.html
          grep -q 'data-lab-automations-platform="v4"' /tmp/auto-mobile.html
          grep -q 'class="v3-editor-page"' /tmp/auto-mobile.html
          grep -q 'data-progressive-preview="true"' /tmp/auto-mobile.html
          grep -q 'What should start this' /tmp/auto-mobile.html
          grep -q 'FLOW PREVIEW' /tmp/auto-mobile.html
          grep -q 'Choose a trigger' /tmp/auto-mobile.html
          grep -q 'Not set yet' /tmp/auto-mobile.html
          grep -q 'Step 1 of 5' /tmp/auto-mobile.html
          grep -q 'TEST THIS STEP' /tmp/auto-mobile.html
          grep -q 'Browse triggers' /tmp/auto-mobile.html
          ! grep -q 'LIVE FLOW' /tmp/auto-mobile.html
          ! grep -qi 'Loading Automations' /tmp/auto-mobile.html
          ! grep -q 'Name the automation' /tmp/auto-mobile.html
          ! grep -q 'How do you want to start' /tmp/auto-mobile.html

          echo 'Focused Automations v4 passed desktop and 390x844 mobile smoke, including scenarios and direct-new deep link.'
