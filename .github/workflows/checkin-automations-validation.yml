name: Check In Automations Validation

on:
  push:
    branches: [main]
    paths:
      - 'lab/automations/**'
      - 'assets/lab/lab-automations-app.js'
      - 'assets/lab/lab-automations-app.css'
      - 'assets/lab/lab-automations-app-v2.js'
      - 'assets/lab/lab-automations-app-v2.css'
      - 'assets/lab/lab-automations-calendar.css'
      - 'assets/lab/lab-automations-dropdown-runtime.js'
      - 'assets/lab/lab-automations-friendly-runtime.js'
      - 'assets/lab/lab-automations-friendly.css'
      - 'assets/lab/lab-automations-content-runtime.js'
      - 'assets/lab/lab-automations-content.css'
      - 'docs/checkin-automations-frontend-CURRENT.md'
      - 'docs/checkin-content-editor-CURRENT.md'
      - '.github/workflows/checkin-automations-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lab/automations/**'
      - 'assets/lab/lab-automations-app-v2.js'
      - 'assets/lab/lab-automations-app-v2.css'
      - 'assets/lab/lab-automations-calendar.css'
      - 'assets/lab/lab-automations-dropdown-runtime.js'
      - 'assets/lab/lab-automations-friendly-runtime.js'
      - 'assets/lab/lab-automations-friendly.css'
      - 'assets/lab/lab-automations-content-runtime.js'
      - 'assets/lab/lab-automations-content.css'
      - 'docs/checkin-content-editor-CURRENT.md'
      - '.github/workflows/checkin-automations-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate JavaScript and safety contract
        run: |
          set -euo pipefail
          node --check assets/lab/lab-automations-app-v2.js
          node --check assets/lab/lab-automations-dropdown-runtime.js
          node --check assets/lab/lab-automations-friendly-runtime.js
          node --check assets/lab/lab-automations-content-runtime.js
          python - <<'PY'
          from pathlib import Path
          import sys

          html = Path('lab/automations/index.html').read_text(encoding='utf-8')
          js = Path('assets/lab/lab-automations-app-v2.js').read_text(encoding='utf-8')
          dropdown_js = Path('assets/lab/lab-automations-dropdown-runtime.js').read_text(encoding='utf-8')
          friendly_js = Path('assets/lab/lab-automations-friendly-runtime.js').read_text(encoding='utf-8')
          content_js = Path('assets/lab/lab-automations-content-runtime.js').read_text(encoding='utf-8')
          css = Path('assets/lab/lab-automations-app.css').read_text(encoding='utf-8')
          css_v2 = Path('assets/lab/lab-automations-app-v2.css').read_text(encoding='utf-8')
          calendar_css = Path('assets/lab/lab-automations-calendar.css').read_text(encoding='utf-8')
          friendly_css = Path('assets/lab/lab-automations-friendly.css').read_text(encoding='utf-8')
          content_css = Path('assets/lab/lab-automations-content.css').read_text(encoding='utf-8')

          required_html = [
              "connect-src 'self'",
              '/assets/lab/lab-automations-app.css',
              '/assets/lab/lab-automations-app-v2.css',
              '/assets/lab/lab-automations-calendar.css',
              '/assets/lab/lab-automations-friendly.css?v=20260817-1',
              '/assets/lab/lab-automations-content.css?v=20260817-1',
              '/assets/lab/lab-automations-app-v2.js?v=20260817-5',
              '/assets/lab/lab-automations-dropdown-runtime.js',
              '/assets/lab/lab-automations-friendly-runtime.js?v=20260817-3',
              '/assets/lab/lab-automations-content-runtime.js?v=20260817-1',
              'noindex,nofollow',
          ]
          required_js = [
              'cmx-lab-automations-v1',
              'cmx-lab-crm-v1',
              'cmx-lab-inventory-v1',
              'Save draft',
              'WAIT / REPEAT',
              'Publish unavailable',
              'data-add-action',
              'scheduleAutosave',
              'data-dropdown-trigger',
              'data-dropdown-option',
              'Exact date & time',
              'data-delay-field',
              'data-exact-date',
              'data-exact-time',
              'IANA timezone',
              'An earlier action failed',
              '"months"',
              '"years"',
              'CALENDAR_REPEAT_UNITS',
              'repeat-timezone',
              'Calendar timezone',
              'Days, weeks, months and years follow calendar boundaries',
              'Minutes and hours are elapsed cadence units',
              'WAIT delays are elapsed durations',
              'Repeat daily ·',
              'Repeat weekly ·',
          ]
          required_friendly = [
              'What is the grace period?',
              'When should the actions begin?',
              'An exact date/time never bypasses the trigger',
              'START NOT BEFORE',
              'What should happen when the actions are done?',
              'Finish here',
              'START TIME',
              'history.scrollRestoration = "manual"',
              '[data-open], [data-new]',
          ]
          required_content = [
              'cmx-lab-content-assets-v1',
              'PRIVATE CONTENT',
              'Private content editor',
              'contenteditable="true"',
              'Email subject',
              'Write',
              'Preview',
              'data-rich-command="bold"',
              'data-rich-command="italic"',
              'data-rich-command="underline"',
              'data-rich-command="strikeThrough"',
              'data-rich-link',
              'insertUnorderedList',
              'insertOrderedList',
              'BLOCKQUOTE',
              'insertHorizontalRule',
              'PROTECTED ATTACHMENTS',
              'sanitizeHtml',
              'safeHref',
              '"SCRIPT"',
          ]
          required_dropdown = ['stopImmediatePropagation', '.smart-select.is-open', 'data-dropdown-trigger']
          required_css = ['.automation-app','.editor-footer','.step-rail','.do-card','html[data-theme="light"]','@media(max-width:760px)']
          required_v2_css = ['.smart-select','.smart-menu','.timing-mode-grid','.precision-card','.duration-inputs','.exact-grid','.repeat-pills','@media(max-width:700px)']
          required_calendar_css = ['.repeat-zone','.calendar-cadence-note']
          required_friendly_css = ['.concept-card','.grace-timeline','.trigger-vs-start','.finish-advanced','@media(max-width:700px)']
          required_content_css = ['.content-asset-card','.content-editor-overlay','.content-toolbar','.content-paper','.content-rich-body','.content-attachments-card','@media(max-width:760px)']
          for term in required_html:
              if term not in html: sys.exit(f'missing HTML contract: {term}')
          for term in required_js:
              if term not in js: sys.exit(f'missing JS contract: {term}')
          for term in required_friendly:
              if term not in friendly_js: sys.exit(f'missing friendly UX contract: {term}')
          for term in required_content:
              if term not in content_js: sys.exit(f'missing content editor contract: {term}')
          for term in required_dropdown:
              if term not in dropdown_js: sys.exit(f'missing dropdown runtime contract: {term}')
          for term in required_css:
              if term not in css: sys.exit(f'missing CSS contract: {term}')
          for term in required_v2_css:
              if term not in css_v2: sys.exit(f'missing v2 CSS contract: {term}')
          for term in required_calendar_css:
              if term not in calendar_css: sys.exit(f'missing calendar CSS contract: {term}')
          for term in required_friendly_css:
              if term not in friendly_css: sys.exit(f'missing friendly CSS contract: {term}')
          for term in required_content_css:
              if term not in content_css: sys.exit(f'missing content CSS contract: {term}')
          if '<select' in js: sys.exit('native select reintroduced into focused Automations v2')
          if 'MutationObserver' in friendly_js + content_js: sys.exit('broad observer-style UX patch must not be introduced')
          for term in ['api.cmxchat.com','eval(','new Function(','localStorage.setItem("operator']:
              if term in html + js + dropdown_js + friendly_js + content_js: sys.exit(f'forbidden focused-Lab contract: {term}')
          print('Focused Automation safety, human UX, timing, content authoring, dropdown, and calendar recurrence contract passed.')
          PY

      - name: Browser smoke desktop and mobile
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo 'No Chromium-compatible browser available.' >&2
            exit 1
          fi
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/checkin-auto-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          dump() { "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=4000 "$@" --dump-dom; }
          dump http://127.0.0.1:8000/lab/automations/ > /tmp/auto-desktop.html
          grep -q '>Automations<' /tmp/auto-desktop.html
          grep -q 'New automation' /tmp/auto-desktop.html
          grep -q 'EXECUTION' /tmp/auto-desktop.html
          ! grep -qi 'Loading Automations' /tmp/auto-desktop.html
          dump --window-size=390,844 http://127.0.0.1:8000/lab/automations/ > /tmp/auto-mobile.html
          grep -q '>Automations<' /tmp/auto-mobile.html
          grep -q 'New automation' /tmp/auto-mobile.html
          ! grep -qi 'Loading Automations' /tmp/auto-mobile.html
          echo 'Focused Automations desktop and 390x844 mobile smoke passed.'
