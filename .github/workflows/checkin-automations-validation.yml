name: Check In Automations Validation

on:
  push:
    branches: [main]
    paths:
      - 'lab/automations/**'
      - 'assets/lab/lab-automations-*.js'
      - 'assets/lab/lab-automations-*.css'
      - 'assets/lab/lab-actions.js'
      - 'docs/checkin-automations-frontend-CURRENT.md'
      - 'docs/checkin-automations-system-surface-CURRENT.md'
      - 'docs/checkin-lab-automations-integration-CURRENT.md'
      - 'docs/continuum-automations-master-plan-CURRENT.md'
      - 'docs/checkin-directory-library-CURRENT.md'
      - '.github/workflows/checkin-automations-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lab/automations/**'
      - 'assets/lab/lab-automations-*.js'
      - 'assets/lab/lab-automations-*.css'
      - 'assets/lab/lab-actions.js'
      - 'docs/checkin-automations-frontend-CURRENT.md'
      - 'docs/checkin-automations-system-surface-CURRENT.md'
      - 'docs/checkin-lab-automations-integration-CURRENT.md'
      - 'docs/continuum-automations-master-plan-CURRENT.md'
      - 'docs/checkin-directory-library-CURRENT.md'
      - '.github/workflows/checkin-automations-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate focused JavaScript and safety contracts
        run: |
          set -euo pipefail
          for file in \
            assets/lab/lab-automations-experience-v3.js \
            assets/lab/lab-automations-route-integration.js \
            assets/lab/lab-automations-system-surface.js \
            assets/lab/lab-automations-progressive-preview.js \
            assets/lab/lab-automations-platform-v4.js \
            assets/lab/lab-automations-scenarios-v4.js \
            assets/lab/lab-automations-directory-v4.js \
            assets/lab/lab-automations-audience-v4.js
          do
            node --check "$file"
          done

          python - <<'PY'
          from pathlib import Path
          import sys

          html = Path('lab/automations/index.html').read_text(encoding='utf-8')
          v3 = Path('assets/lab/lab-automations-experience-v3.js').read_text(encoding='utf-8')
          route = Path('assets/lab/lab-automations-route-integration.js').read_text(encoding='utf-8')
          system = Path('assets/lab/lab-automations-system-surface.js').read_text(encoding='utf-8')
          progressive = Path('assets/lab/lab-automations-progressive-preview.js').read_text(encoding='utf-8')
          platform = Path('assets/lab/lab-automations-platform-v4.js').read_text(encoding='utf-8')
          scenarios = Path('assets/lab/lab-automations-scenarios-v4.js').read_text(encoding='utf-8')
          directory = Path('assets/lab/lab-automations-directory-v4.js').read_text(encoding='utf-8')
          audience = Path('assets/lab/lab-automations-audience-v4.js').read_text(encoding='utf-8')
          audience_css = Path('assets/lab/lab-automations-audience-v4.css').read_text(encoding='utf-8')

          required_html = [
              "connect-src 'self'", 'noindex,nofollow', '<title>Continuum · Automations</title>',
              'lab-automations-platform-v4.css', 'lab-automations-platform-v4-qa.css',
              'lab-automations-directory-v4.css', 'lab-automations-audience-v4.css',
              'lab-automations-platform-v4.js', 'lab-automations-scenarios-v4.js',
              'lab-automations-directory-v4.js', 'lab-automations-audience-v4.js'
          ]
          required_v3 = [
              'cmx-lab-automations-v1', 'cmx-lab-crm-v1', 'cmx-lab-actions-v1',
              'scheduleAutosave', 'clearTimeout(state.saveTimer)', 'Run simulation',
              'data-duplicate-action', 'data-toggle-action', 'data-picker-search'
          ]
          required_progressive = [
              'cmx-lab-automation-progress-v1', 'FLOW PREVIEW', 'Choose a trigger',
              'Choose an action', 'Not set yet', 'Finish this step first'
          ]
          required_platform = [
              'CMXAutomationCapabilityCatalog', 'CONTINUUM CAPABILITIES', 'AI PLANNER · PREVIEW',
              'RUN HISTORY', 'RUNTIME OFF', 'TEST THIS STEP', 'Browse actions', 'LAB NOW', 'LATER'
          ]
          required_scenarios = ['Weekly planning review', 'Grace-window heads-up', 'AI briefing with review']
          required_directory = ['DIRECTORY READINESS', 'Typed Audience available', 'Open Directory']
          required_audience = [
              'audienceSelectors', 'live_membership', 'selector.type === "person"',
              'selector.type === "organization"', 'selector.type === "group"', 'selector.type === "label"',
              'Who should this reach?', 'Unique people', 'Email ready', 'Phone ready',
              'duplicates removed', 'Overlapping People are counted once', 'labAutomationsAudience'
          ]
          required_audience_css = [
              '.v4-audience-readiness', '.v4-audience-modal-backdrop', '.v4-audience-picker-list',
              '.v4-audience-preview-metrics', '@media (max-width:760px)', 'env(safe-area-inset-bottom)'
          ]

          for term in required_html:
              if term not in html: sys.exit(f'missing focused HTML contract: {term}')
          for term in required_v3:
              if term not in v3: sys.exit(f'missing v3 compatibility contract: {term}')
          for term in required_progressive:
              if term not in progressive: sys.exit(f'missing progressive Draft contract: {term}')
          for term in required_platform:
              if term not in platform: sys.exit(f'missing v4 platform contract: {term}')
          for term in required_scenarios:
              if term not in scenarios: sys.exit(f'missing v4 scenario: {term}')
          for term in required_directory:
              if term not in directory: sys.exit(f'missing Directory integration: {term}')
          for term in required_audience:
              if term not in audience: sys.exit(f'missing typed Audience contract: {term}')
          for term in required_audience_css:
              if term not in audience_css: sys.exit(f'missing typed Audience styling: {term}')

          if 'lab-automations-app-v2.js' in html:
              sys.exit('superseded v2 builder must not be loaded')

          combined = html + v3 + route + system + progressive + platform + scenarios + directory + audience
          if 'api.cmxchat.com' in combined:
              sys.exit('focused Lab must not call the production API')
          for name, source in [('system', system), ('progressive', progressive), ('platform', platform), ('directory', directory), ('audience', audience)]:
              for forbidden in ['eval(', 'new Function(', 'MutationObserver']:
                  if forbidden in source: sys.exit(f'forbidden {name} pattern: {forbidden}')

          print('Automations v4.1 platform, typed Audience, progressive Draft and safety contracts passed.')
          PY

      - name: Browser smoke desktop and direct-new mobile
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo 'No Chromium-compatible browser available.' >&2
            exit 1
          fi
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/checkin-auto-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          dump() { "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=12000 "$@" --dump-dom; }

          dump http://127.0.0.1:8000/lab/automations/ > /tmp/auto-desktop.html
          grep -q 'data-lab-automations-experience="v3"' /tmp/auto-desktop.html
          grep -q 'data-lab-automations-system-surface="ready"' /tmp/auto-desktop.html
          grep -q 'data-lab-automations-platform="v4"' /tmp/auto-desktop.html
          grep -q 'data-lab-automations-directory="v4"' /tmp/auto-desktop.html
          grep -q 'data-lab-automations-audience="v4-1"' /tmp/auto-desktop.html
          grep -q '>Automations<' /tmp/auto-desktop.html
          grep -q '>Templates<' /tmp/auto-desktop.html
          grep -q '>Runs<' /tmp/auto-desktop.html
          grep -q 'Capabilities' /tmp/auto-desktop.html
          grep -q 'New automation' /tmp/auto-desktop.html
          grep -q 'LAB · SIMULATION ONLY' /tmp/auto-desktop.html
          ! grep -qi 'Loading Automations' /tmp/auto-desktop.html

          dump --window-size=390,844 'http://127.0.0.1:8000/lab/automations/?new=1&from=lab' > /tmp/auto-mobile.html
          grep -q 'data-lab-automations-experience="v3"' /tmp/auto-mobile.html
          grep -q 'data-lab-automations-platform="v4"' /tmp/auto-mobile.html
          grep -q 'data-lab-automations-audience="v4-1"' /tmp/auto-mobile.html
          grep -q 'class="v3-editor-page"' /tmp/auto-mobile.html
          grep -q 'data-progressive-preview="true"' /tmp/auto-mobile.html
          grep -q 'What should start this' /tmp/auto-mobile.html
          grep -q 'FLOW PREVIEW' /tmp/auto-mobile.html
          grep -q 'Choose a trigger' /tmp/auto-mobile.html
          grep -q 'Step 1 of 5' /tmp/auto-mobile.html
          grep -q 'TEST THIS STEP' /tmp/auto-mobile.html
          ! grep -q 'LIVE FLOW' /tmp/auto-mobile.html
          ! grep -q 'How do you want to start' /tmp/auto-mobile.html

          echo 'Focused Automations v4.1 passed desktop and 390x844 direct-new mobile smoke.'
