name: Tighten Architecture Title
on:
  push:
    paths:
      - '.architecture-title-trigger'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/tighten_architecture_title.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cmx-architecture-center.html
          git commit -m "Tighten architecture title" || exit 0
          git push
