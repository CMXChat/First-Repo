name: Final platform entry point

on:
  pull_request:
    paths:
      - 'backend/app/platform.py'
      - 'backend/app/hardened.py'
      - 'backend/app/write_security.py'
      - 'backend/app/api/lifecycle.py'
      - 'backend/app/api/enrichment.py'
      - 'backend/app/services/enrichment.py'
      - 'backend/app/config.py'
      - 'backend/app/main.py'
      - 'backend/tests/test_platform.py'
      - 'backend/tests/test_lifecycle.py'
      - 'backend/tests/test_write_security.py'
      - 'backend/tests/test_enrichment.py'
      - 'backend/compose.yml'
      - 'backend/compose.platform.yml'
      - 'cases/**'
      - 'osint/**'
      - 'phone/**'
      - 'search/**'
      - 'metadata/**'
      - 'missing/**'
      - 'assets/case-lifecycle.*'
      - 'assets/cases-*'
      - 'assets/cmx-case-context.*'
      - 'assets/cmx-case-capture.*'
      - 'assets/cmx-page-standard.*'
      - 'assets/osint-workbench.js'
      - 'assets/osint-enrichment.*'
      - 'assets/phone-workbench.js'
      - 'assets/search-workbench.js'
      - 'assets/metadata-workbench.js'
      - 'assets/missing-workbench.js'
      - 'tests/browser/lifecycle.spec.mjs'
      - 'tests/browser/platform.spec.mjs'
      - 'tests/browser/cases-operator-workspace.spec.mjs'
      - 'tests/browser/active-case-tools.spec.mjs'
      - 'playwright.config.mjs'
      - '.github/workflows/platform-entrypoint.yml'
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'backend/app/platform.py'
      - 'backend/app/hardened.py'
      - 'backend/app/write_security.py'
      - 'backend/app/api/lifecycle.py'
      - 'backend/app/api/enrichment.py'
      - 'backend/app/services/enrichment.py'
      - 'backend/app/config.py'
      - 'backend/app/main.py'
      - 'backend/tests/test_platform.py'
      - 'backend/tests/test_lifecycle.py'
      - 'backend/tests/test_write_security.py'
      - 'backend/tests/test_enrichment.py'
      - 'backend/compose.yml'
      - 'backend/compose.platform.yml'
      - 'cases/**'
      - 'osint/**'
      - 'phone/**'
      - 'search/**'
      - 'metadata/**'
      - 'missing/**'
      - 'assets/case-lifecycle.*'
      - 'assets/cases-*'
      - 'assets/cmx-case-context.*'
      - 'assets/cmx-case-capture.*'
      - 'assets/cmx-page-standard.*'
      - 'assets/osint-workbench.js'
      - 'assets/osint-enrichment.*'
      - 'assets/phone-workbench.js'
      - 'assets/search-workbench.js'
      - 'assets/metadata-workbench.js'
      - 'assets/missing-workbench.js'
      - 'tests/browser/lifecycle.spec.mjs'
      - 'tests/browser/platform.spec.mjs'
      - 'tests/browser/cases-operator-workspace.spec.mjs'
      - 'tests/browser/active-case-tools.spec.mjs'
      - 'playwright.config.mjs'
      - '.github/workflows/platform-entrypoint.yml'

permissions:
  contents: read

jobs:
  platform-api:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Compile final entry point and enrichment boundary
        working-directory: backend
        run: python -m compileall -q app/platform.py app/hardened.py app/write_security.py app/main.py app/api/enrichment.py app/services/enrichment.py

      - name: Run platform lifecycle, write and enrichment tests
        working-directory: backend
        run: pytest tests/test_platform.py tests/test_lifecycle.py tests/test_write_security.py tests/test_enrichment.py

      - name: Validate platform Compose merge
        run: |
          cp backend/.env.example backend/.env
          docker compose \
            --env-file backend/.env \
            --file backend/compose.yml \
            --file backend/compose.platform.yml \
            config >/dev/null

  platform-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: platform-api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt
          npm install
          npx playwright install --with-deps chromium

      - name: Start final platform origin
        working-directory: backend
        env:
          CMX_ENVIRONMENT: development
          CMX_AUTH_MODE: development
          CMX_DATABASE_URL: sqlite+pysqlite:///./platform-playwright.db
          CMX_DATABASE_AUTO_CREATE: 'true'
          CMX_ALLOWED_HOSTS_CSV: localhost,127.0.0.1,testserver
          CMX_API_RATE_LIMIT_PER_MINUTE: '2000'
        run: |
          nohup uvicorn app.platform:app --host 127.0.0.1 --port 8000 > /tmp/cmx-platform.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cmx-platform.log
          exit 1

      - name: Run desktop platform regressions
        env:
          CMX_BROWSER_BASE_URL: http://127.0.0.1:8000
        run: npx playwright test tests/browser/platform.spec.mjs tests/browser/lifecycle.spec.mjs tests/browser/cases-operator-workspace.spec.mjs tests/browser/active-case-tools.spec.mjs --config=playwright.config.mjs --project=chromium-desktop

      - name: Run mobile platform regressions
        env:
          CMX_BROWSER_BASE_URL: http://127.0.0.1:8000
        run: npx playwright test tests/browser/platform.spec.mjs tests/browser/cases-operator-workspace.spec.mjs tests/browser/active-case-tools.spec.mjs --config=playwright.config.mjs --project=chromium-mobile

      - name: Upload platform failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: platform-entrypoint-failure-artifacts
          path: |
            playwright-report
            test-results
            /tmp/cmx-platform.log
          if-no-files-found: ignore
          retention-days: 7
