name: CMX Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for committed secrets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path('.')
          failures = []
          binary_suffixes = {
              '.png', '.jpg', '.jpeg', '.gif', '.webp', '.ico', '.pdf',
              '.mp4', '.mov', '.mp3', '.wav', '.woff', '.woff2', '.ttf',
              '.zip', '.gz', '.tar', '.7z'
          }
          ignored_parts = {'.git', 'node_modules', 'vendor', '.venv', 'venv'}
          forbidden_names = {'.env', '.env.local', '.env.production', 'id_rsa', 'id_ed25519'}

          patterns = {
              'private key': re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'),
              'GitHub token': re.compile(r'\b(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{30,}\b'),
              'GitHub fine-grained token': re.compile(r'\bgithub_pat_[A-Za-z0-9_]{40,}\b'),
              'AWS access key': re.compile(r'\b(?:AKIA|ASIA)[A-Z0-9]{16}\b'),
              'Google API key': re.compile(r'\bAIza[0-9A-Za-z_-]{35}\b'),
              'Slack token': re.compile(r'\bxox[baprs]-[0-9A-Za-z-]{20,}\b'),
              'Stripe secret key': re.compile(r'\bsk_(?:live|test)_[0-9A-Za-z]{20,}\b'),
              'SendGrid key': re.compile(r'\bSG\.[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{20,}\b'),
              'JWT-like token': re.compile(r'\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b'),
              'credentialed database URL': re.compile(r'\b(?:postgres(?:ql)?|mysql|mongodb(?:\+srv)?|redis)://[^\s:/]+:[^\s@]+@', re.I),
              'credentialed HTTP URL': re.compile(r'\bhttps?://[^\s:/]+:[^\s@]+@', re.I),
          }

          for path in root.rglob('*'):
              if not path.is_file() or any(part in ignored_parts for part in path.parts):
                  continue
              if path.suffix.lower() in binary_suffixes:
                  continue
              if path.name in forbidden_names or path.suffix.lower() in {'.pem', '.key', '.p12', '.pfx'}:
                  failures.append(f'{path}: secret-bearing file type or filename must not be committed')
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for label, pattern in patterns.items():
                  for match in pattern.finditer(text):
                      line = text.count('\n', 0, match.start()) + 1
                      failures.append(f'{path}:{line}: possible {label}')

          if failures:
              print('CMX secret scan failed:')
              print('\n'.join(f' - {item}' for item in failures))
              sys.exit(1)
          print('CMX secret scan passed.')
          PY
