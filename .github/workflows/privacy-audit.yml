name: CMX Privacy Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate private-site rules
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re
          import sys

          failures = []
          registry_path = Path('assets/cmx-routes.json')

          if not registry_path.exists():
              failures.append('assets/cmx-routes.json: central route registry is missing')
              registry = {'routes': []}
          else:
              try:
                  registry = json.loads(registry_path.read_text(encoding='utf-8'))
              except Exception as exc:
                  failures.append(f'assets/cmx-routes.json: invalid JSON: {exc}')
                  registry = {'routes': []}

          routes = registry.get('routes', [])
          paths = [route.get('path') for route in routes]
          duplicates = sorted({path for path in paths if path and paths.count(path) > 1})
          if duplicates:
              failures.append(f'assets/cmx-routes.json: duplicate paths: {duplicates}')

          def route_file(route_path):
              if route_path == '/':
                  return Path('index.html')
              if route_path == '/404.html':
                  return Path('404.html')
              return Path(route_path.strip('/')) / 'index.html'

          custom_gates = {
              '/brief/': {
                  'markers': ('data-sara-load-url=', 'data-sara-password-sha256='),
                  'assets': ('/assets/sara-brief-gate.css', '/assets/sara-brief-gate.js'),
              },
          }

          for route in routes:
              path = route.get('path')
              if not isinstance(path, str) or not path.startswith('/'):
                  failures.append(f'assets/cmx-routes.json: invalid route path {path!r}')
                  continue

              file_path = route_file(path)
              if not file_path.exists():
                  failures.append(f'{path}: registered route file is missing at {file_path.as_posix()}')
                  continue

              text = file_path.read_text(encoding='utf-8', errors='ignore')
              lower = text.lower()
              uses_standard = '/assets/cmx-page-standard.js' in text

              for label, needles in {
                  'robots noindex': ('name="robots"', 'noindex'),
                  'meta title': ('<title>', '</title>'),
              }.items():
                  if any(needle not in lower for needle in needles):
                      failures.append(f'{file_path.as_posix()}: missing {label}')

              if route.get('directory') and route.get('visibility') != 'Directory-visible':
                  failures.append(f'{path}: directory route must use Directory-visible visibility')

              if route.get('gated'):
                  custom_gate = custom_gates.get(path)
                  if custom_gate:
                      for marker in custom_gate['markers']:
                          if marker not in lower:
                              failures.append(f'{file_path.as_posix()}: custom gate lacks marker {marker!r}')
                      for asset in custom_gate['assets']:
                          if asset not in text:
                              failures.append(f'{file_path.as_posix()}: custom gate lacks asset {asset}')
                  else:
                      if 'data-cmx-gated="true"' not in lower:
                          failures.append(f'{file_path.as_posix()}: gated route lacks data-cmx-gated=true')
                      if '/assets/cmx-sensitive-gate.css' not in text or '/assets/cmx-sensitive-gate.js' not in text:
                          failures.append(f'{file_path.as_posix()}: gated route lacks shared gate assets')
                  if 'http-equiv="cache-control"' not in lower or 'no-store' not in lower:
                      failures.append(f'{file_path.as_posix()}: gated route lacks static no-store hint')
                  if 'name="referrer"' not in lower or 'no-referrer' not in lower:
                      failures.append(f'{file_path.as_posix()}: gated route lacks no-referrer policy')

              for anchor in re.finditer(r'<a\b([^>]*)>', text, re.I | re.S):
                  attrs = anchor.group(1)
                  if re.search(r'\btarget\s*=\s*(["\'])_blank\1', attrs, re.I):
                      rel_match = re.search(r'\brel\s*=\s*(["\'])(.*?)\1', attrs, re.I | re.S)
                      tokens = set(rel_match.group(2).split()) if rel_match else set()
                      if 'noopener' not in tokens and not uses_standard:
                          failures.append(f'{file_path.as_posix()}: target=_blank link lacks noopener')

          planning_routes = {
              '/build/': 'operational',
              '/backend/': 'source of truth',
              '/ai/': 'normal-language',
              '/updates/': 'briefing',
          }
          route_map = {route.get('path'): route for route in routes}
          for path, expected in planning_routes.items():
              route = route_map.get(path)
              if not route:
                  failures.append(f'{path}: planning route missing from registry')
                  continue
              description = str(route.get('description', '')).lower()
              if expected not in description:
                  failures.append(f'{path}: registry description should explain its {expected!r} role')

          error_page = Path('404.html').read_text(encoding='utf-8', errors='ignore').lower()
          for term in ('/callmax', '/project', 'available routes', 'suggested route'):
              if term in error_page:
                  failures.append(f'404.html: discloses restricted route information through {term!r}')

          for name in ('robots.txt', 'sitemap.xml', 'route-manifest.json', 'site-manifest.json', 'routes.json'):
              if Path(name).exists():
                  failures.append(f'{name}: public root discovery file must not be published')

          gate_script = Path('assets/cmx-sensitive-gate.js')
          if not gate_script.exists():
              failures.append('assets/cmx-sensitive-gate.js: temporary gate script is missing')
          else:
              gate_text = gate_script.read_text(encoding='utf-8', errors='ignore').lower()
              if 'temporary client-side deterrent' not in gate_text or 'not server-side authorization' not in gate_text:
                  failures.append('assets/cmx-sensitive-gate.js: must clearly identify the browser gate as temporary and not server authorization')

          if failures:
              print('CMX privacy audit failed:')
              print('\n'.join(f' - {item}' for item in failures))
              sys.exit(1)

          print(f'CMX privacy audit passed for {len(routes)} registered routes.')
          PY
