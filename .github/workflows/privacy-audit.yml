name: CMX Privacy Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate private-site rules
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import re
          import sys

          failures = []
          root = Path('.')
          sensitive = {'build/index.html', 'callmax/index.html', 'project/index.html'}
          forbidden_destinations = {'/build', '/callmax', '/project'}

          def normalize_href(value):
              value = value.strip()
              if value.startswith(('mailto:', 'tel:', 'javascript:', '#')):
                  return None
              parsed = urlparse(value)
              if parsed.netloc and parsed.netloc != 'db.cmxchat.com':
                  return None
              path = parsed.path or '/'
              if path != '/':
                  path = path.rstrip('/')
              return path

          standard_js = Path('assets/cmx-page-standard.js').read_text(encoding='utf-8', errors='ignore')
          gate_js = Path('assets/cmx-sensitive-gate.js').read_text(encoding='utf-8', errors='ignore')

          for required in (
              "new Set(['/build', '/callmax', '/project'])",
              "new Set(['/manual', '/menu', '/workspace'",
              "rel.add('noopener')",
              "rel.add('noreferrer')",
              "anchor.remove()",
              "no-store, no-cache, must-revalidate",
          ):
              if required not in standard_js:
                  failures.append(f'assets/cmx-page-standard.js: missing runtime control {required!r}')

          for required in (
              "PASSWORD_SHA256",
              "5acc5a298686271b024634c1affb1a03a228278e707b6ff9f816af5e1cc948b9",
              "Directory-visible",
              "Direct-link-only",
              "Build-only",
              "<th>Visibility</th>",
          ):
              if required not in gate_js:
                  failures.append(f'assets/cmx-sensitive-gate.js: missing gate or Build Lab control {required!r}')

          html_files = [p for p in root.glob('**/*.html') if '.git' not in p.parts]
          for path in html_files:
              rel = path.as_posix()
              text = path.read_text(encoding='utf-8', errors='ignore')
              lower = text.lower()
              uses_standard = '/assets/cmx-page-standard.js' in text

              required = {
                  'robots noindex': ('name="robots"', 'noindex'),
                  'googlebot noindex': ('name="googlebot"', 'noindex'),
                  'meta title': ('<title>', '</title>'),
                  'description': ('name="description"', 'content='),
                  'no-referrer': ('name="referrer"', 'no-referrer'),
              }
              for label, needles in required.items():
                  if any(needle and needle not in lower for needle in needles):
                      failures.append(f'{rel}: missing {label}')

              if rel in sensitive:
                  if 'http-equiv="cache-control"' not in lower or 'no-store' not in lower:
                      failures.append(f'{rel}: sensitive wrapper lacks static no-store hint')
                  if 'data-cmx-visibility=' not in lower:
                      failures.append(f'{rel}: sensitive wrapper lacks visibility classification')
              elif not uses_standard and rel not in {'404.html', 'index.html'}:
                  failures.append(f'{rel}: page lacks shared runtime privacy controls')

              for anchor in re.finditer(r'<a\b([^>]*)>', text, re.I | re.S):
                  attrs = anchor.group(1)
                  href_match = re.search(r'\bhref\s*=\s*(["\'])(.*?)\1', attrs, re.I | re.S)
                  if href_match:
                      destination = normalize_href(href_match.group(2))
                      if rel != 'build/index.html' and destination in forbidden_destinations:
                          failures.append(f'{rel}: exposes sensitive route {destination}')

                  if re.search(r'\btarget\s*=\s*(["\'])_blank\1', attrs, re.I):
                      rel_match = re.search(r'\brel\s*=\s*(["\'])(.*?)\1', attrs, re.I | re.S)
                      tokens = set(rel_match.group(2).split()) if rel_match else set()
                      if not {'noopener', 'noreferrer'}.issubset(tokens) and not uses_standard:
                          failures.append(f'{rel}: target=_blank link lacks noopener noreferrer')

          for rel in sensitive:
              path = Path(rel)
              if not path.exists():
                  failures.append(f'{rel}: sensitive page missing')
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              if 'data-cmx-gated="true"' not in text:
                  failures.append(f'{rel}: temporary gate missing')
              if '/assets/cmx-sensitive-gate.css' not in text or '/assets/cmx-sensitive-gate.js' not in text:
                  failures.append(f'{rel}: gate assets missing')
              if '<title>CMX Restricted Resource</title>' not in text:
                  failures.append(f'{rel}: static title reveals page identity')
              if 'content="Authorization required to access this private CMX resource."' not in text:
                  failures.append(f'{rel}: static description is not generic')

          error_page = Path('404.html').read_text(encoding='utf-8', errors='ignore').lower()
          for term in ('/build', '/callmax', '/project', '/directory', 'available routes', 'suggested route'):
              if term in error_page:
                  failures.append(f'404.html: discloses route information through {term!r}')

          for name in ('robots.txt', 'sitemap.xml', 'route-manifest.json', 'site-manifest.json', 'routes.json'):
              if Path(name).exists():
                  failures.append(f'{name}: public discovery file must not be published')

          if failures:
              print('CMX privacy audit failed:')
              print('\n'.join(f' - {item}' for item in failures))
              sys.exit(1)
          print(f'CMX privacy audit passed for {len(html_files)} HTML files.')
          PY
