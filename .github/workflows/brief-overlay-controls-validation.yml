name: Brief Overlay Controls Validation

on:
  pull_request:
    paths:
      - 'brief/**'
      - 'assets/brief/**'
      - 'tests/brief-overlay-controls.spec.cjs'
      - 'tests/brief-overlay-controls.playwright.config.cjs'
      - '.github/workflows/brief-overlay-controls-validation.yml'
  push:
    branches: [main]
    paths:
      - 'brief/**'
      - 'assets/brief/**'
      - 'tests/brief-overlay-controls.spec.cjs'
      - 'tests/brief-overlay-controls.playwright.config.cjs'
      - '.github/workflows/brief-overlay-controls-validation.yml'

permissions:
  contents: read

jobs:
  browser-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run overlay controls tests
        run: npx playwright test --config=tests/brief-overlay-controls.playwright.config.cjs

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: brief-overlay-controls-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
