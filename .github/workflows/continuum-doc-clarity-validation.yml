name: Continuum Doc Clarity Validation

on:
  push:
    branches: [main]
    paths:
      - 'doc/**'
      - 'assets/personal-os-doc.js'
      - 'assets/personal-os-doc*.css'
      - 'assets/continuum-doc-*.css'
      - 'assets/continuum-doc-*.js'
      - 'docs/continuum-*.md'
      - 'tests/personal-os-doc-smoke.test.js'
      - 'tests/doc-visual-qa-smoke.test.js'
      - 'tests/continuum-doc-*.test.js'
      - '.github/workflows/continuum-doc-clarity-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'doc/**'
      - 'assets/personal-os-doc.js'
      - 'assets/personal-os-doc*.css'
      - 'assets/continuum-doc-*.css'
      - 'assets/continuum-doc-*.js'
      - 'docs/continuum-*.md'
      - 'tests/personal-os-doc-smoke.test.js'
      - 'tests/doc-visual-qa-smoke.test.js'
      - 'tests/continuum-doc-*.test.js'
      - '.github/workflows/continuum-doc-clarity-validation.yml'

permissions:
  contents: read

jobs:
  validate-doc:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate source and document contracts
        run: |
          set -euo pipefail
          node --check assets/personal-os-doc.js
          node --check assets/continuum-doc-origin.js
          node --check assets/continuum-doc-i18n.js
          node --check assets/continuum-doc-knowledge-time.js
          node tests/personal-os-doc-smoke.test.js
          node tests/doc-visual-qa-smoke.test.js
          node tests/continuum-doc-clarity-smoke.test.js
          node tests/continuum-doc-continuity-positioning.test.js

      - name: Browser clarity smoke desktop and mobile
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo 'No Chromium-compatible browser available.' >&2
            exit 1
          fi

          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/continuum-doc-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1

          dump() {
            "$BROWSER" \
              --headless \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --virtual-time-budget=12000 \
              "$@" \
              --dump-dom
          }

          validate_render() {
            local file="$1"
            grep -q 'data-continuum-clarity="ready"' "$file"
            grep -q 'data-continuum-origin="ready"' "$file"
            grep -q 'data-continuum-architecture-aligned="20260819"' "$file"
            grep -q 'data-continuum-power-clarity="20260819"' "$file"
            grep -q 'data-continuum-check-in-route="ready"' "$file"
            grep -q 'data-continuum-knowledge-quality="ready"' "$file"
            grep -q 'data-continuum-authorized-continuity="ready"' "$file"
            grep -q 'data-continuum-architecture-evolution="ready"' "$file"
            grep -q 'data-continuum-positioning="continuity-first"' "$file"
            grep -q 'Your information, intent and authority across time' "$file"
            grep -q 'preserve the continuity plan you prepared for a time when you can no longer respond' "$file"
            grep -q 'Spaces, Automations, AI, Check In and Afterlife use that same durable foundation' "$file"
            grep -q 'BUILT TO CARRY INTENT FORWARD' "$file"
            grep -q 'One operating layer across presence, absence and continuity.' "$file"
            grep -q 'Afterlife is the continuity edge of Continuum.' "$file"
            grep -q 'Silence and urgency never create authority.' "$file"
            grep -q 'Files + OCR / vision' "$file"
            grep -q 'You leave for two minutes and return two seconds later.' "$file"
            grep -q 'Open Check In' "$file"
            grep -q 'Protected proof of life, timing and activity' "$file"
            grep -q 'STATE IS WHAT IS TRUE NOW' "$file"
            grep -q 'WHY DID CONTINUUM DO THAT?' "$file"
            grep -q 'Signals let Continuum notice when something changes.' "$file"
            grep -q 'HOW CONTINUUM TREATS INFORMATION' "$file"
            grep -q 'Different approved models can handle different jobs.' "$file"
            grep -q 'Specific work can continue on your behalf when you cannot take part directly.' "$file"
            grep -q 'A Goal can expose a limitation in Continuum itself.' "$file"
            grep -q 'Capability growth and permission growth stay separate.' "$file"
            grep -q 'Open the architecture walkthrough' "$file"
            grep -q 'Open the build workflow' "$file"
          }

          dump http://127.0.0.1:8000/doc/ > /tmp/continuum-doc-desktop.html
          validate_render /tmp/continuum-doc-desktop.html

          python3 - <<'PY'
          from pathlib import Path
          html = Path('/tmp/continuum-doc-desktop.html').read_text(encoding='utf-8')
          hero_start = html.index('<header class="hero continuum-hero clarity-hero"')
          hero_end = html.index('</header>', hero_start)
          hero = html[hero_start:hero_end]
          assert 'continuum-continuity-line' in hero, 'Continuity identity must appear in the opening hero.'
          assert 'hero-network' not in hero, 'Product map must stay out of the opening hero.'
          assert 'continuum-presence' not in hero, 'Detailed presence map must stay below the opening hero.'
          assert 'href="/checkin/"' in hero, 'The opening hero must link to the LIVE Check In surface.'

          overview = html.index('id="overview"')
          time_panel = html.index('continuum-kt-time', overview)
          state = html.index('continuum-state-strip', overview)
          story = html.index('clarity-story-section')
          product_map = html.index('clarity-product-map-section')
          presence = html.index('continuum-presence', product_map)
          ai = html.index('id="difference"')
          spaces = html.index('id="spaces"')
          knowledge_panel = html.index('continuum-kt-knowledge', spaces)
          senses = html.index('continuum-senses-strip', spaces)
          action = html.index('id="action"')
          afterlife = html.index('id="afterlife"')
          build = html.index('id="build"')
          assert overview < state < time_panel < story < product_map < presence < ai < spaces < knowledge_panel < senses < action < afterlife < build, 'Continuum teaching order regressed.'

          assert html.count('href="/checkin/"') >= 3, 'Check In should stay reachable from multiple meaningful locations.'
          footer = html.index('class="document-footer"')
          assert html.index('continuum-route-live', footer) > footer, 'Footer must present Check In as the LIVE route.'
          print('Desktop continuity positioning, knowledge, time and architecture order passed.')
          PY

          dump --window-size=390,844 http://127.0.0.1:8000/doc/ > /tmp/continuum-doc-mobile.html
          validate_render /tmp/continuum-doc-mobile.html
          grep -q 'mobileContentsTrigger' /tmp/continuum-doc-mobile.html
          grep -q 'continuum-continuity-line' /tmp/continuum-doc-mobile.html

          echo 'Continuum /doc continuity-first refinement rendered on desktop and 390x844 mobile.'
