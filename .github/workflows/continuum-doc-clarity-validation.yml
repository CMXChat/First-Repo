name: Continuum Doc Clarity Validation

on:
  push:
    branches: [main]
    paths:
      - 'doc/**'
      - 'assets/personal-os-doc.js'
      - 'assets/personal-os-doc*.css'
      - 'assets/continuum-doc-*.css'
      - 'assets/continuum-doc-*.js'
      - 'docs/continuum-*.md'
      - 'tests/personal-os-doc-smoke.test.js'
      - 'tests/doc-visual-qa-smoke.test.js'
      - 'tests/continuum-doc-*.test.js'
      - '.github/workflows/continuum-doc-clarity-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'doc/**'
      - 'assets/personal-os-doc.js'
      - 'assets/personal-os-doc*.css'
      - 'assets/continuum-doc-*.css'
      - 'assets/continuum-doc-*.js'
      - 'docs/continuum-*.md'
      - 'tests/personal-os-doc-smoke.test.js'
      - 'tests/doc-visual-qa-smoke.test.js'
      - 'tests/continuum-doc-*.test.js'
      - '.github/workflows/continuum-doc-clarity-validation.yml'

permissions:
  contents: read

jobs:
  validate-doc:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate source and document contracts
        run: |
          set -euo pipefail
          node --check assets/personal-os-doc.js
          node --check assets/continuum-doc-origin.js
          node --check assets/continuum-doc-i18n.js
          node --check assets/continuum-doc-knowledge-time.js
          node --check assets/continuum-doc-human-cadence.js
          node --check assets/continuum-doc-reader-first.js
          node tests/personal-os-doc-smoke.test.js
          node tests/doc-visual-qa-smoke.test.js
          node tests/continuum-doc-clarity-smoke.test.js
          node tests/continuum-doc-continuity-positioning.test.js

      - name: Browser clarity smoke desktop and mobile
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo 'No Chromium-compatible browser available.' >&2
            exit 1
          fi

          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/continuum-doc-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1

          dump() {
            "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=12000 "$@" --dump-dom
          }

          validate_render() {
            local file="$1"
            grep -q 'data-continuum-clarity="ready"' "$file"
            grep -q 'data-continuum-human-cadence="ready"' "$file"
            grep -q 'data-continuum-voice="natural-v3"' "$file"
            grep -q 'data-continuum-reader-first="ready"' "$file"
            grep -q 'data-continuum-product-story="balanced-v2"' "$file"
            grep -q 'Think of AI as the brain and Continuum as the nervous system around it' "$file"
            grep -q 'Continuum is that private layer.' "$file"
            grep -q 'That might mean acting, waiting, asking you, contacting someone or doing nothing.' "$file"
            grep -q 'The Dead Man Switch is one example' "$file"
            grep -q 'If you switch to a better AI later' "$file"
            grep -q 'Carries context across time' "$file"
            grep -q 'Keeps up with real changes' "$file"
            grep -q 'Works inside rules you set' "$file"
            grep -q 'From something changing to the next allowed step' "$file"
            grep -q 'The pieces below give those jobs their technical names.' "$file"
            grep -q 'That picture is called State' "$file"
            grep -q '02 · AI + Permissions' "$file"
            grep -q 'An Automation is how Continuum remembers a repeatable or triggered piece of work.' "$file"
            grep -q 'Runtime lets approved work continue after you leave.' "$file"
            grep -q 'When one outcome takes several steps, a Goal gives Continuum something larger to work toward.' "$file"
            grep -q 'Silence and urgency never create permission.' "$file"
            grep -q 'Files + OCR / vision' "$file"
            grep -q 'Open Check In' "$file"
          }

          dump http://127.0.0.1:8000/doc/ > /tmp/continuum-doc-desktop.html
          validate_render /tmp/continuum-doc-desktop.html

          python3 - <<'PY'
          from pathlib import Path
          html = Path('/tmp/continuum-doc-desktop.html').read_text(encoding='utf-8')
          hero_start = html.index('<header class="hero continuum-hero clarity-hero"')
          hero_end = html.index('</header>', hero_start)
          hero = html[hero_start:hero_end]
          assert 'continuum-continuity-line' in hero
          assert 'hero-network' not in hero
          assert 'continuum-presence' not in hero
          assert 'href="/checkin/"' in hero

          lead_start = hero.index('class="hero-lead')
          lead_end = hero.index('hero-truth-row', lead_start)
          lead = hero[lead_start:lead_end]
          for internal_name in ['Library', 'Directory', 'Spaces', 'Automation', 'Runtime', 'Planner', 'Goal']:
              assert internal_name not in lead, f'Opening explanation became a component glossary: {internal_name}'

          assert 'A private system for what matters now and what should happen next' not in html
          assert 'Continuum is a private system for keeping the parts of your life and work that matter connected over time.' not in html
          assert 'does not gain extra permission' not in html
          assert 'when you cannot respond' not in lead

          overview = html.index('id="overview"')
          ai = html.index('id="difference"')
          spaces = html.index('id="spaces"')
          action = html.index('id="action"')
          afterlife = html.index('id="afterlife"')
          engineering = html.index('id="engineering"')
          build = html.index('id="build"')
          status = html.index('id="status"')
          assert overview < ai < spaces < action < afterlife < engineering < build < status

          assert html.count('href="/checkin/"') >= 3
          print('Desktop Continuum one-minute explanation and teaching order passed.')
          PY

          dump --window-size=390,844 http://127.0.0.1:8000/doc/ > /tmp/continuum-doc-mobile.html
          validate_render /tmp/continuum-doc-mobile.html
          grep -q 'mobileContentsTrigger' /tmp/continuum-doc-mobile.html
          grep -q 'continuum-continuity-line' /tmp/continuum-doc-mobile.html

          echo 'Continuum /doc one-minute explanation rendered on desktop and 390x844 mobile.'
