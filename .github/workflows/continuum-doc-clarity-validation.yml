name: Continuum Doc Clarity Validation

on:
  push:
    branches: [main]
    paths:
      - 'doc/**'
      - 'assets/personal-os-doc.js'
      - 'assets/personal-os-doc*.css'
      - 'assets/continuum-doc-*.css'
      - 'assets/continuum-doc-*.js'
      - 'docs/continuum-*.md'
      - 'tests/personal-os-doc-smoke.test.js'
      - 'tests/doc-visual-qa-smoke.test.js'
      - 'tests/continuum-doc-*.test.js'
      - '.github/workflows/continuum-doc-clarity-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'doc/**'
      - 'assets/personal-os-doc.js'
      - 'assets/personal-os-doc*.css'
      - 'assets/continuum-doc-*.css'
      - 'assets/continuum-doc-*.js'
      - 'docs/continuum-*.md'
      - 'tests/personal-os-doc-smoke.test.js'
      - 'tests/doc-visual-qa-smoke.test.js'
      - 'tests/continuum-doc-*.test.js'
      - '.github/workflows/continuum-doc-clarity-validation.yml'

permissions:
  contents: read

jobs:
  validate-doc:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate source and document contracts
        run: |
          set -euo pipefail
          node --check assets/personal-os-doc.js
          node --check assets/continuum-doc-origin.js
          node --check assets/continuum-doc-i18n.js
          node --check assets/continuum-doc-knowledge-time.js
          node --check assets/continuum-doc-human-cadence.js
          node --check assets/continuum-doc-reader-first.js
          node tests/personal-os-doc-smoke.test.js
          node tests/doc-visual-qa-smoke.test.js
          node tests/continuum-doc-clarity-smoke.test.js
          node tests/continuum-doc-continuity-positioning.test.js

      - name: Browser clarity smoke desktop and mobile
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo 'No Chromium-compatible browser available.' >&2
            exit 1
          fi

          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/continuum-doc-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1

          dump() {
            "$BROWSER" \
              --headless \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --virtual-time-budget=12000 \
              "$@" \
              --dump-dom
          }

          validate_render() {
            local file="$1"
            grep -q 'data-continuum-clarity="ready"' "$file"
            grep -q 'data-continuum-origin="ready"' "$file"
            grep -q 'data-continuum-architecture-aligned="20260819"' "$file"
            grep -q 'data-continuum-power-clarity="20260819"' "$file"
            grep -q 'data-continuum-check-in-route="ready"' "$file"
            grep -q 'data-continuum-knowledge-quality="ready"' "$file"
            grep -q 'data-continuum-authorized-continuity="ready"' "$file"
            grep -q 'data-continuum-architecture-evolution="ready"' "$file"
            grep -q 'data-continuum-positioning="continuity-first"' "$file"
            grep -q 'data-continuum-human-cadence="ready"' "$file"
            grep -q 'data-continuum-voice="natural-v3"' "$file"
            grep -q 'data-continuum-reader-first="ready"' "$file"
            grep -q 'data-continuum-product-story="complete-v1"' "$file"
            grep -q 'Your information, workflows and goals across time' "$file"
            grep -q 'workflows that react to changes and longer goals that may take several steps' "$file"
            grep -q 'Built for workflows + longer goals' "$file"
            grep -q '02 · AI + Permissions' "$file"
            grep -q 'BUILT TO CARRY YOUR PLAN FORWARD' "$file"
            grep -q "One place for what matters now, work that continues later, and plans for when you can't respond." "$file"
            grep -q 'That picture is called State' "$file"
            grep -q 'Runtime is the part that can later keep it alive in the background on the server.' "$file"
            grep -q 'The rules stay with Continuum when the AI changes' "$file"
            grep -q 'Afterlife is for continuity plans that may need to outlast a long period' "$file"
            grep -q 'Silence and urgency never create permission.' "$file"
            grep -q 'Files + OCR / vision' "$file"
            grep -q 'You say you are leaving for two minutes and return two seconds later.' "$file"
            grep -q 'Open Check In' "$file"
            grep -q 'Protected proof of life, timing and activity' "$file"
            grep -q 'STATE IS WHAT IS TRUE NOW' "$file"
            grep -q 'WHY DID CONTINUUM DO THAT?' "$file"
            grep -q "Signals are the meaningful changes Continuum notices from sources you've approved." "$file"
            grep -q 'Continuum keeps different kinds of information separate.' "$file"
            grep -q 'Different jobs can use different approved models.' "$file"
            grep -q 'An Automation is a saved workflow with something that starts it, conditions to check and rules for what it may do.' "$file"
            grep -q 'Runtime keeps published work alive in the background after you close the app.' "$file"
            grep -q 'Changes can make the next step ready.' "$file"
            grep -q 'Planner is the part that turns that request into a proposed set of changes, called a Change Plan.' "$file"
            grep -q 'A Goal is for something you want Continuum to work toward over several steps, even when the route changes.' "$file"
            grep -q 'Goals can hold a larger outcome when the route may change.' "$file"
            grep -q "Work you prepared in advance can continue when you can't take part directly." "$file"
            grep -q 'If the same problem keeps coming up, Continuum may need a new data model or backend feature.' "$file"
            grep -q 'The Control Center gives you one place to see what Continuum is doing in the background.' "$file"
            grep -q 'Afterlife started with a practical question.' "$file"
            grep -q 'Open the architecture walkthrough' "$file"
            grep -q 'Open the build workflow' "$file"
          }

          dump http://127.0.0.1:8000/doc/ > /tmp/continuum-doc-desktop.html
          validate_render /tmp/continuum-doc-desktop.html

          python3 - <<'PY'
          from pathlib import Path
          html = Path('/tmp/continuum-doc-desktop.html').read_text(encoding='utf-8')
          hero_start = html.index('<header class="hero continuum-hero clarity-hero"')
          hero_end = html.index('</header>', hero_start)
          hero = html[hero_start:hero_end]
          assert 'continuum-continuity-line' in hero, 'Continuity identity must appear in the opening hero.'
          assert 'hero-network' not in hero, 'Product map must stay out of the opening hero.'
          assert 'continuum-presence' not in hero, 'Detailed presence map must stay below the opening hero.'
          assert 'href="/checkin/"' in hero, 'The opening hero must link to the LIVE Check In surface.'

          overview = html.index('id="overview"')
          time_panel = html.index('continuum-kt-time', overview)
          state = html.index('continuum-state-strip', overview)
          story = html.index('clarity-story-section')
          product_map = html.index('clarity-product-map-section')
          presence = html.index('continuum-presence', product_map)
          ai = html.index('id="difference"')
          spaces = html.index('id="spaces"')
          knowledge_panel = html.index('continuum-kt-knowledge', spaces)
          senses = html.index('continuum-senses-strip', spaces)
          action = html.index('id="action"')
          afterlife = html.index('id="afterlife"')
          build = html.index('id="build"')
          assert overview < state < time_panel < story < product_map < presence < ai < spaces < knowledge_panel < senses < action < afterlife < build, 'Continuum teaching order regressed.'

          assert html.count('href="/checkin/"') >= 3, 'Check In should stay reachable from multiple meaningful locations.'
          footer = html.index('class="document-footer"')
          assert html.index('continuum-route-live', footer) > footer, 'Footer must present Check In as the LIVE route.'

          stale = [
              'Library holds your information. Directory keeps track of people and relationships.',
              'AI can change. Continuum keeps the rules around it.',
              'Automations handle repeatable rules. Goals keep an outcome alive.',
              'Continuum keeps those pieces connected:',
              'Afterlife extends the same Continuum foundation into long-term continuity:',
              'Afterlife began with a practical problem:',
              'durable information and focused context; Automations',
              'does not take the underlying records',
              'AI does not have to stay open',
              'Changing the model does not change the authority',
              'It cannot quietly change the limits',
              'Adding a tool does not add permission',
              'when you cannot take part directly',
              'Runtime can later keep work moving on the server through waits, replies and retries.',
              'A Goal can keep an outcome moving across several steps and changing conditions.',
              'Signals help Continuum notice meaningful changes from approved sources.',
              'Your information, plans and permissions across time',
              'An Automation is a saved definition of work and the rules around it.',
              'Runtime is the server-side part that can keep approved work moving even after you close the app.',
              'A Goal is for an outcome that may take several steps and change along the way.'
          ]
          for phrase in stale:
              assert phrase not in html, f'Stale narrow, technical-first or AI-like copy is still visible: {phrase}'
          print('Desktop Continuum product story, natural voice, reader-first terminology, knowledge, time and architecture order passed.')
          PY

          dump --window-size=390,844 http://127.0.0.1:8000/doc/ > /tmp/continuum-doc-mobile.html
          validate_render /tmp/continuum-doc-mobile.html
          grep -q 'mobileContentsTrigger' /tmp/continuum-doc-mobile.html
          grep -q 'continuum-continuity-line' /tmp/continuum-doc-mobile.html

          echo 'Continuum /doc complete product story rendered on desktop and 390x844 mobile.'
