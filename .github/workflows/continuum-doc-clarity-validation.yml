name: Continuum Doc Clarity Validation

on:
  push:
    branches: [main]
    paths:
      - 'doc/**'
      - 'assets/personal-os-doc.js'
      - 'assets/personal-os-doc*.css'
      - 'assets/continuum-doc-*.css'
      - 'assets/continuum-doc-*.js'
      - 'docs/continuum-*.md'
      - 'tests/continuum-doc-*.test.js'
      - '.github/workflows/continuum-doc-clarity-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'doc/**'
      - 'assets/personal-os-doc.js'
      - 'assets/personal-os-doc*.css'
      - 'assets/continuum-doc-*.css'
      - 'assets/continuum-doc-*.js'
      - 'docs/continuum-*.md'
      - 'tests/continuum-doc-*.test.js'
      - '.github/workflows/continuum-doc-clarity-validation.yml'

permissions:
  contents: read

jobs:
  validate-doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate source and document contracts
        run: |
          set -euo pipefail
          node --check assets/personal-os-doc.js
          node --check assets/continuum-doc-origin.js
          node --check assets/continuum-doc-i18n.js
          node --check assets/continuum-doc-knowledge-time.js
          node --check assets/continuum-doc-human-cadence.js
          node --check assets/continuum-doc-reader-first.js
          node --check assets/continuum-doc-final-voice.js
          node --check assets/continuum-doc-durable-identity.js
          node tests/personal-os-doc-smoke.test.js
          node tests/doc-visual-qa-smoke.test.js
          node tests/continuum-doc-clarity-smoke.test.js
          node tests/continuum-doc-continuity-positioning.test.js
          node tests/continuum-doc-final-voice.test.js
          node tests/continuum-doc-durable-identity.test.js

      - name: Render and validate desktop and mobile
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/doc-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1

          dump() {
            "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=12000 "$@" --dump-dom
          }

          require() {
            local pattern="$1" file="$2" label="$3"
            if ! grep -q "$pattern" "$file"; then
              echo "MISSING: $label :: $pattern" >&2
              grep -E 'data-continuum|durable-identity|AI identity|compatible model|hero-lead|AI \+ Permissions|AI \+ Authority' "$file" | head -120 >&2 || true
              exit 1
            fi
            echo "OK: $label"
          }

          validate_render() {
            local file="$1"
            require 'data-continuum-clarity="ready"' "$file" 'clarity marker'
            require 'data-continuum-human-cadence="ready"' "$file" 'human cadence marker'
            require 'data-continuum-reader-first="ready"' "$file" 'reader marker'
            require 'data-continuum-final-voice="ready"' "$file" 'final voice marker'
            require 'data-continuum-durable-identity="ready"' "$file" 'durable identity marker'
            require 'data-continuum-identity-portability="model-agnostic-v1"' "$file" 'identity portability marker'
            require 'data-continuum-voice="natural-v4"' "$file" 'voice marker'
            require 'Think of AI as the brain and Continuum as the nervous system around it' "$file" 'hero analogy'
            require 'Continuum is the private layer around the AI that keeps those things connected over time.' "$file" 'hero explanation'
            require 'That might mean acting, waiting, asking you, contacting someone or doing nothing.' "$file" 'action choices'
            require 'If you switch to a better AI later' "$file" 'model portability intro'
            require 'Carries context across time' "$file" 'context hero chip'
            require 'Keeps up with real changes' "$file" 'change hero chip'
            require 'Works inside rules you set' "$file" 'rules hero chip'
            require 'From something changing to the next allowed step' "$file" 'overview heading'
            require 'From there the flow is simple.' "$file" 'overview natural voice'
            require 'That picture is called State' "$file" 'State teaching'
            require '02 · AI + Permissions' "$file" 'AI permissions section label'
            require 'An Automation is a saved piece of work that can run again or start when something happens.' "$file" 'Automation explanation'
            require 'Runtime lets approved work continue after you leave.' "$file" 'Runtime explanation'
            require 'When one outcome takes several steps, a Goal gives Continuum something larger to work toward.' "$file" 'Goal explanation'
            require 'Silence and urgency never create permission.' "$file" 'authority guardrail'
            require 'Keep a recognizable AI identity even when the model changes.' "$file" 'durable identity heading'
            require 'A compatible model can load that identity in a new context instead of starting from zero.' "$file" 'durable identity portability copy'
            require 'Identity can shape judgment, strategy and communication.' "$file" 'identity influence boundary'
            require 'The server still controls facts, permissions and authority.' "$file" 'identity authority boundary'
            require 'Files + OCR / vision' "$file" 'information intake'
            require 'Open Check In' "$file" 'live Check In route'
          }

          dump http://127.0.0.1:8000/doc/ > /tmp/doc-desktop.html
          validate_render /tmp/doc-desktop.html

          python3 - <<'PY'
          from pathlib import Path
          html = Path('/tmp/doc-desktop.html').read_text(encoding='utf-8')
          hero_start = html.index('<header class="hero continuum-hero clarity-hero"')
          hero_end = html.index('</header>', hero_start)
          hero = html[hero_start:hero_end]
          assert 'continuum-continuity-line' in hero
          assert 'hero-network' not in hero
          assert 'continuum-presence' not in hero
          assert 'href="/checkin/"' in hero

          lead = hero[hero.index('class="hero-lead'):hero.index('hero-truth-row')]
          for internal in ['Library', 'Directory', 'Spaces', 'Automation', 'Runtime', 'Planner', 'Goal', 'Identity']:
              assert internal not in lead, f'hero became component glossary: {internal}'

          for private_name in ['Lorraine', 'Echo', 'Shapes']:
              assert private_name.lower() not in html.lower(), f'private identity history leaked: {private_name}'

          positions = [html.index(f'id="{name}"') for name in ['overview','difference','spaces','action','afterlife','engineering','build','status']]
          assert positions == sorted(positions)
          identity = html.index('continuum-durable-identity-note')
          assert positions[1] < identity < positions[2]
          assert html.count('href="/checkin/"') >= 3
          print('Desktop structure and identity placement passed.')
          PY

          dump --window-size=390,844 http://127.0.0.1:8000/doc/ > /tmp/doc-mobile.html
          validate_render /tmp/doc-mobile.html
          require 'mobileContentsTrigger' /tmp/doc-mobile.html 'mobile contents trigger'
          require 'continuum-continuity-line' /tmp/doc-mobile.html 'mobile continuity line'
          require 'continuum-durable-identity-note' /tmp/doc-mobile.html 'mobile durable identity note'
          echo 'Continuum /doc final voice and durable identity rendered on desktop and mobile.'
