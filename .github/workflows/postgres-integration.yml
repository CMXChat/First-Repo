name: PostgreSQL integration

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/postgres-integration.yml'
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'backend/**'
      - '.github/workflows/postgres-integration.yml'

permissions:
  contents: read

jobs:
  postgres-18:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cmx
          POSTGRES_PASSWORD: integration-password
          POSTGRES_DB: cmx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cmx -d cmx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      CMX_ENVIRONMENT: development
      CMX_AUTH_MODE: development
      CMX_DATABASE_URL: postgresql+psycopg://cmx:integration-password@127.0.0.1:5432/cmx_test
      CMX_DATABASE_AUTO_CREATE: 'false'
      CMX_ALLOWED_HOSTS_CSV: localhost,127.0.0.1,testserver

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Apply migrations to PostgreSQL 18
        working-directory: backend
        run: alembic upgrade head

      - name: Run PostgreSQL API smoke test
        working-directory: backend
        run: pytest tests/test_postgres_smoke.py

      - name: Verify migration downgrade and re-upgrade
        working-directory: backend
        run: |
          alembic downgrade base
          alembic upgrade head
          alembic current
