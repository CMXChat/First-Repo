name: Brief Polish Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/brief-polish-validation.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run validation and capture every result
        shell: bash
        run: |
          set +e
          report=.brief-polish-validation-report
          : > "$report"
          failures=0

          run_check() {
            name="$1"
            shift
            printf '\n=== %s ===\n' "$name" >> "$report"
            "$@" >> "$report" 2>&1
            status=$?
            printf 'status=%s\n' "$status" >> "$report"
            if [ "$status" -ne 0 ]; then failures=$((failures + 1)); fi
          }

          run_check 'syntax config' node --check assets/brief/brief-config.js
          run_check 'syntax workspace' node --check assets/brief/brief-workspace.js
          run_check 'syntax polish' node --check assets/brief/brief-polish.js
          run_check 'syntax relationship watch' node --check assets/brief/brief-relationship-watch.js
          run_check 'syntax Team data' node --check assets/brief/brief-team-data.js
          run_check 'device smoke' node tests/brief-device-smoke.test.js
          run_check 'terminal smoke' node tests/brief-terminal-smoke.test.js
          run_check 'entry and watch smoke' node tests/brief-entry-watch-smoke.test.js
          run_check 'stability smoke' node tests/brief-stability-smoke.test.js
          run_check 'workspace and Team smoke' node tests/brief-workspace-team-smoke.test.js
          run_check 'polish smoke' node tests/brief-polish-smoke.test.js

          printf '\nfailures=%s\ncommit=%s\n' "$failures" "$GITHUB_SHA" >> "$report"
          if [ "$failures" -eq 0 ]; then
            printf 'brief polish validation passed\ncommit=%s\n' "$GITHUB_SHA" > .brief-polish-validation-pass
          else
            rm -f .brief-polish-validation-pass
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$report"
          if [ -f .brief-polish-validation-pass ]; then git add .brief-polish-validation-pass; fi
          git commit -m 'Record briefing polish validation report'
          git push

          exit "$failures"

# final rerun after correcting the polish assertion
