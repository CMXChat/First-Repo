name: Harden Brief Onboarding

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/brief-onboarding-harden.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Apply iPhone interaction fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing marker: {label}')
              return text.replace(old, new, 1)

          path = Path('assets/brief/brief-onboarding.js')
          text = path.read_text()
          text = replace_once(text, "    positionTimer: 0\n", "    positionTimer: 0,\n    stepRetries: 0\n", 'tour retry state')
          text = replace_once(
              text,
              "    if (!step || !target) {\n      if (next < STEPS.length - 1) showStep(next + 1);\n      else closeTour(true);\n      return;\n    }\n    state.current = next;",
              "    if (!step) return;\n    if (!target) {\n      state.stepRetries += 1;\n      if (state.stepRetries < 12) {\n        window.setTimeout(() => showStep(next), 200);\n        return;\n      }\n      state.stepRetries = 0;\n      if (next < STEPS.length - 1) showStep(next + 1);\n      else closeTour(false);\n      return;\n    }\n    state.stepRetries = 0;\n    state.current = next;",
              'slow renderer retry'
          )
          text = replace_once(
              text,
              "    state.returnFocus = document.activeElement;\n    layer.hidden = false;\n    document.body.classList.add('brief-onboarding-open');\n    setAppInert(true);\n    updateHelpButton(true);\n    window.requestAnimationFrame(() => layer.classList.add('is-visible'));\n    showStep(index);",
              "    state.returnFocus = $('#explainButton') || document.activeElement;\n    layer.hidden = false;\n    document.body.classList.add('brief-onboarding-open');\n    setAppInert(true);\n    updateHelpButton(true);\n    window.requestAnimationFrame(() => layer.classList.add('is-visible'));\n    showStep(index);",
              'tour return focus'
          )
          path.write_text(text)

          path = Path('assets/brief/brief-onboarding.css')
          text = path.read_text()
          text = replace_once(
              text,
              "body.brief-onboarding-open {\n  overflow: hidden !important;\n  overscroll-behavior: none;\n  touch-action: none;\n}",
              "body.brief-onboarding-open {\n  overflow: hidden !important;\n  overscroll-behavior: none;\n}",
              'allow modal touch scrolling'
          )
          path.write_text(text)

          path = Path('assets/brief/brief-device.css')
          text = path.read_text()
          text = replace_once(
              text,
              ".brief-keyboard-visible .scenario-dock,\n.brief-keyboard-visible .brief-tour-invite {\n  transform: translateY(calc(-1 * var(--brief-keyboard-inset)));\n}",
              ".brief-keyboard-visible .scenario-dock {\n  transform: translateY(calc(-1 * var(--brief-keyboard-inset)));\n}\n\n.brief-keyboard-visible .brief-tour-invite {\n  bottom: calc(max(16px, env(safe-area-inset-bottom)) + var(--brief-keyboard-inset));\n}",
              'keyboard invite positioning'
          )
          path.write_text(text)

          path = Path('assets/brief/brief-config.js')
          text = path.read_text()
          text = replace_once(text, "    onboarding: '20260803-1',", "    onboarding: '20260803-2',", 'onboarding asset version')
          path.write_text(text)

          path = Path('brief/index.html')
          text = path.read_text()
          text = replace_once(text, 'brief-config.js?v=20260803-13', 'brief-config.js?v=20260803-14', 'config cache version')
          path.write_text(text)
          PY

      - name: Validate fixes
        run: |
          node --check assets/brief/brief-onboarding.js
          node --check assets/brief/brief-device.js
          node --check assets/brief/brief-config.js
          node tests/brief-onboarding-smoke.test.js

      - name: Commit hardened onboarding
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/brief/brief-onboarding.js assets/brief/brief-onboarding.css assets/brief/brief-device.css assets/brief/brief-config.js brief/index.html
          git commit -m 'Harden glass onboarding for iPhone and slow browsers'
          git push
