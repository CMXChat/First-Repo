name: Check In Files Validation

on:
  push:
    branches: [main]
    paths:
      - 'assets/lab/lab-automations-files-runtime.js'
      - 'assets/lab/lab-automations-files.css'
      - 'docs/checkin-files-CURRENT.md'
      - 'docs/checkin-content-editor-CURRENT.md'
      - '.github/workflows/checkin-files-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'assets/lab/lab-automations-files-runtime.js'
      - 'assets/lab/lab-automations-files.css'
      - 'docs/checkin-files-CURRENT.md'
      - 'docs/checkin-content-editor-CURRENT.md'
      - '.github/workflows/checkin-files-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate retained file UX and isolation contract
        run: |
          set -euo pipefail
          node --check assets/lab/lab-automations-files-runtime.js
          python - <<'PY'
          from pathlib import Path
          import sys

          js = Path('assets/lab/lab-automations-files-runtime.js').read_text(encoding='utf-8')
          css = Path('assets/lab/lab-automations-files.css').read_text(encoding='utf-8')
          current = Path('docs/checkin-files-CURRENT.md').read_text(encoding='utf-8')

          required_js = [
              'cmx-lab-file-assets-v1',
              'cmx-lab-content-assets-v1',
              'fileAssetId',
              'fileVersionId',
              'Update to v',
              'Files & attachments',
              'Attached ·',
              'File library ·',
              'Search protected files',
              'Version history',
              'USED BY',
              'Upload new',
              'Lab deliberately does not pretend browser localStorage is durable file storage',
              'viewer-pdf-mock',
              'viewer-video-mock',
              'viewer-audio-mock',
              'viewer-sheet-mock',
              'PRIVATE IMAGE PREVIEW',
          ]
          required_css = [
              '.file-manager-overlay',
              '.file-library-card',
              '.file-viewer-overlay',
              '.file-details-overlay',
              '.version-row',
              '.attached-file-summary',
              '@media(max-width:760px)',
          ]
          required_current = [
              'FileAsset',
              'FileVersion',
              'exact version',
              'FILE-ASSETS-BACKEND-HANDOFF.md',
          ]

          for term in required_js:
              if term not in js: sys.exit(f'missing retained file JS contract: {term}')
          for term in required_css:
              if term not in css: sys.exit(f'missing retained file CSS contract: {term}')
          for term in required_current:
              if term not in current: sys.exit(f'missing file handoff contract: {term}')

          for term in ['api.cmxchat.com', 'eval(', 'new Function(', 'MutationObserver', 'data:application/', 'blob:']:
              if term in js: sys.exit(f'forbidden file Lab behavior: {term}')

          print('Retained protected file-library/version-pinning design contract passed; active Automations v3 route is validated separately.')
          PY
