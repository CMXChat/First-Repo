name: Apply CMX Privacy Hardening

on:
  push:
    branches:
      - privacy-hardening-20260731
    paths:
      - '.privacy-hardening-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply privacy controls
        run: python scripts/apply_privacy_hardening.py

      - name: Run immediate privacy checks
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          failures = []
          for path in Path('.').glob('**/*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              lower = text.lower()
              if 'name="robots"' not in lower or 'noindex' not in lower:
                  failures.append(f'{path}: missing noindex')
              if 'name="googlebot"' not in lower or 'noindex' not in lower:
                  failures.append(f'{path}: missing googlebot noindex')
              if 'name="referrer" content="no-referrer"' not in lower:
                  failures.append(f'{path}: missing no-referrer')
              if 'http-equiv="cache-control"' not in lower or 'no-store' not in lower:
                  failures.append(f'{path}: missing no-store browser hint')

          for item in ('build/index.html', 'callmax/index.html', 'project/index.html'):
              text = Path(item).read_text(encoding='utf-8', errors='ignore')
              if 'data-cmx-gated="true"' not in text:
                  failures.append(f'{item}: gate attribute missing')
              if '/assets/cmx-sensitive-gate.js' not in text:
                  failures.append(f'{item}: gate script missing')
              if '<title>CMX Restricted Resource</title>' not in text:
                  failures.append(f'{item}: revealing static title remains')

          directory = Path('directory/index.html').read_text(encoding='utf-8', errors='ignore')
          if '/manual' in directory or 'card-manual' in directory:
              failures.append('directory/index.html: obsolete manual route remains')

          if Path('robots.txt').exists():
              failures.append('robots.txt must not be published')
          if Path('sitemap.xml').exists():
              failures.append('sitemap.xml must not be published')

          if failures:
              print('\n'.join(failures))
              sys.exit(1)
          print('Immediate privacy checks passed.')
          PY

      - name: Commit hardened pages
        run: |
          if git diff --quiet; then
            echo "No page changes were required."
            exit 0
          fi
          git config user.name "cmx-privacy-hardening"
          git config user.email "actions@users.noreply.github.com"
          git add --all
          git commit -m "Harden sensitive routes and private page controls [skip ci]"
          git push
