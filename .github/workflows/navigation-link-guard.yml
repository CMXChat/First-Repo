name: CMX Navigation Link Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  blocked-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reject root and Directory navigation links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          failures = []
          forbidden_anchor = re.compile(
              r'<a\b[^>]*\bhref\s*=\s*(["\'])(?:/|/directory/?)\1',
              re.IGNORECASE,
          )

          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              if forbidden_anchor.search(text):
                  failures.append(f'{path}: links to / or /directory are not allowed')

          standard = Path('assets/cmx-page-standard.js').read_text(encoding='utf-8')
          if re.search(r'<a href=["\']/(?:directory/?)?["\']', standard, re.IGNORECASE):
              failures.append('assets/cmx-page-standard.js: generated root or Directory link found')
          if "blockedNavigationDestinations = new Set(['/', '/directory'])" not in standard:
              failures.append('assets/cmx-page-standard.js: navigation block policy missing')

          build = Path('assets/cmx-build-lab.js').read_text(encoding='utf-8')
          for route in ('"/"', '"/directory/"'):
              if route not in build.split('BUILD_EXCLUDED_ROUTES', 1)[1].split(';', 1)[0]:
                  failures.append(f'assets/cmx-build-lab.js: {route} missing from Build exclusions')

          updates = Path('assets/updates.js').read_text(encoding='utf-8')
          if "!['/', '/directory/', '/directory'].includes(page.route)" not in updates:
              failures.append('assets/updates.js: root and Directory page-index filter missing')

          if failures:
              print('\n'.join(f' - {failure}' for failure in failures))
              sys.exit(1)

          print('Root and Directory navigation links are blocked.')
          PY
