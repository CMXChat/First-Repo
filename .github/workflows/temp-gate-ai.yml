name: Temporary AI Gate Migration

on:
  push:
    branches:
      - agent/gate-ai
    paths:
      - '.gate-ai-trigger'

permissions:
  contents: write

jobs:
  gate-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/gate-ai

      - name: Gate AI route
        run: python scripts/gate_ai.py

      - name: Commit gated AI page
        run: |
          git config user.name "cmx-ai-gate"
          git config user.email "actions@users.noreply.github.com"
          git add ai/index.html assets/cmx-ai-control-blueprint.html assets/cmx-routes.json
          git commit -m "Gate AI Control Blueprint"
          git push origin HEAD:agent/gate-ai
