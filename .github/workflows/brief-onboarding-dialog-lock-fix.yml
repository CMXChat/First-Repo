name: Fix Brief Onboarding Dialog Lock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/brief-onboarding-dialog-lock-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Make dialog lock idempotent
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing marker: {label}')
              return text.replace(old, new, 1)

          path = Path('assets/brief/brief-onboarding.js')
          text = path.read_text()
          text = replace_once(text, "    appAriaHidden: null,\n    positionTimer: 0,", "    appAriaHidden: null,\n    appLocked: false,\n    positionTimer: 0,", 'dialog lock state')
          old = """  function setAppInert(enabled) {
    const app = $('#briefApp');
    if (!app) return;
    if (enabled) {
      state.appAriaHidden = app.getAttribute('aria-hidden');
      if ('inert' in app) app.inert = true;
      else app.setAttribute('aria-hidden', 'true');
    } else {
      if ('inert' in app) app.inert = false;
      if (state.appAriaHidden === null) app.removeAttribute('aria-hidden');
      else app.setAttribute('aria-hidden', state.appAriaHidden);
      state.appAriaHidden = null;
    }
  }"""
          new = """  function setAppInert(enabled) {
    const app = $('#briefApp');
    if (!app) return;
    if (enabled) {
      if (state.appLocked) return;
      state.appLocked = true;
      state.appAriaHidden = app.getAttribute('aria-hidden');
      if ('inert' in app) app.inert = true;
      else app.setAttribute('aria-hidden', 'true');
    } else {
      if (!state.appLocked) return;
      state.appLocked = false;
      if ('inert' in app) app.inert = false;
      if (state.appAriaHidden === null) app.removeAttribute('aria-hidden');
      else app.setAttribute('aria-hidden', state.appAriaHidden);
      state.appAriaHidden = null;
    }
  }"""
          text = replace_once(text, old, new, 'idempotent app lock')
          text = replace_once(text, "      updateHelpButton(false);\n      if (restoreFocus) (state.returnFocus || $('#explainButton'))?.focus?.();", "      updateHelpButton(state.tourOpen);\n      if (restoreFocus) (state.returnFocus || $('#explainButton'))?.focus?.();", 'help close state')
          text = replace_once(text, "      updateHelpButton(false);\n      if (restoreFocus) (state.returnFocus || $('#explainButton'))?.focus?.();", "      updateHelpButton(state.helpOpen);\n      if (restoreFocus) (state.returnFocus || $('#explainButton'))?.focus?.();", 'tour close state')
          path.write_text(text)

          path = Path('assets/brief/brief-config.js')
          text = path.read_text()
          if "onboarding: '20260803-3'" in text:
              text = text.replace("onboarding: '20260803-3'", "onboarding: '20260803-4'", 1)
          elif "onboarding: '20260803-2'" in text:
              text = text.replace("onboarding: '20260803-2'", "onboarding: '20260803-4'", 1)
          else:
              raise SystemExit('onboarding version marker missing')
          path.write_text(text)

          path = Path('brief/index.html')
          text = path.read_text()
          if 'brief-config.js?v=20260803-15' in text:
              text = text.replace('brief-config.js?v=20260803-15', 'brief-config.js?v=20260803-16', 1)
          elif 'brief-config.js?v=20260803-14' in text:
              text = text.replace('brief-config.js?v=20260803-14', 'brief-config.js?v=20260803-16', 1)
          else:
              raise SystemExit('config cache marker missing')
          path.write_text(text)

          path = Path('tests/brief-onboarding-smoke.test.js')
          text = path.read_text()
          marker = "assert.match(onboarding, /inert/);"
          addition = marker + "\nassert.match(onboarding, /appLocked/);\nassert.match(onboarding, /updateHelpButton\\(state\\.tourOpen\\)/);\nassert.match(onboarding, /updateHelpButton\\(state\\.helpOpen\\)/);"
          text = replace_once(text, marker, addition, 'dialog lock static tests')
          path.write_text(text)

          path = Path('tests/brief-browser-e2e.spec.cjs')
          text = path.read_text()
          marker = "  await expect(page.locator('#briefTourLayer')).toBeVisible();\n  await expect(page.locator('#briefTourTitle')).toContainText('Start with what matters now');"
          addition = marker + "\n  await expect(help).toHaveAttribute('aria-expanded', 'true');"
          text = replace_once(text, marker, addition, 'tour help state browser assertion')
          path.write_text(text)
          PY

      - name: Validate and commit
        run: |
          node --check assets/brief/brief-onboarding.js
          node --check assets/brief/brief-config.js
          node tests/brief-onboarding-smoke.test.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/brief/brief-onboarding.js assets/brief/brief-config.js brief/index.html tests/brief-onboarding-smoke.test.js tests/brief-browser-e2e.spec.cjs
          git commit -m 'Stabilize help to tour dialog transitions'
          git push
