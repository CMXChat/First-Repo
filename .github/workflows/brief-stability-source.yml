name: Apply Brief Stability Cache Versions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/brief-stability-source.yml'

permissions:
  contents: write

jobs:
  stabilize-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Bump changed renderer versions
        run: |
          python - <<'PY'
          from pathlib import Path

          config = Path('assets/brief/brief-config.js')
          text = config.read_text()
          text = text.replace("live: '20260803-4'", "live: '20260803-5'")
          text = text.replace("experience: '20260803-3'", "experience: '20260803-4'")
          config.write_text(text)

          index = Path('brief/index.html')
          text = index.read_text().replace('brief-config.js?v=20260803-8', 'brief-config.js?v=20260803-9')
          index.write_text(text)
          PY

      - name: Commit cache versions
        run: |
          if git diff --quiet; then
            echo 'Versions already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/brief/brief-config.js brief/index.html
          git commit -m 'Bump stabilized briefing renderer versions'
          git push
