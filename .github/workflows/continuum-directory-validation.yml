name: Continuum Directory Validation

on:
  push:
    branches: [main]
    paths:
      - 'directory/**'
      - 'automations/**'
      - 'archive/continuum-lab/**'
      - 'assets/lab/lab-loader.js'
      - 'assets/lab/lab-crm.js'
      - 'assets/lab/lab-directory-v2.js'
      - 'assets/lab/lab-directory-v2.css'
      - 'assets/lab/lab-directory-v2-polish.css'
      - 'assets/lab/lab-continuum-planner-contract-v1.js'
      - 'assets/lab/lab-directory-planner-preview.js'
      - 'assets/lab/lab-directory-planner-preview.css'
      - 'assets/lab/lab-automations-directory-v4.js'
      - 'assets/lab/lab-automations-directory-v4.css'
      - 'assets/lab/lab-automations-audience-v4.js'
      - 'assets/lab/lab-automations-audience-v4.css'
      - 'assets/lab/lab-automations-intelligence-v4.js'
      - 'assets/lab/lab-automations-input-routing-v4.js'
      - 'tests/playwright-mobile-dump.cjs'
      - '.github/workflows/continuum-directory-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'directory/**'
      - 'automations/**'
      - 'archive/continuum-lab/**'
      - 'assets/lab/lab-loader.js'
      - 'assets/lab/lab-crm.js'
      - 'assets/lab/lab-directory-v2.js'
      - 'assets/lab/lab-directory-v2.css'
      - 'assets/lab/lab-directory-v2-polish.css'
      - 'assets/lab/lab-continuum-planner-contract-v1.js'
      - 'assets/lab/lab-directory-planner-preview.js'
      - 'assets/lab/lab-directory-planner-preview.css'
      - 'assets/lab/lab-automations-directory-v4.js'
      - 'assets/lab/lab-automations-directory-v4.css'
      - 'assets/lab/lab-automations-audience-v4.js'
      - 'assets/lab/lab-automations-audience-v4.css'
      - 'assets/lab/lab-automations-intelligence-v4.js'
      - 'assets/lab/lab-automations-input-routing-v4.js'
      - 'tests/playwright-mobile-dump.cjs'
      - '.github/workflows/continuum-directory-validation.yml'

permissions:
  contents: read

jobs:
  validate-directory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright core
        run: npm install --no-save playwright-core@1.55.0

      - name: Validate Directory and Automation integration sources
        run: |
          set -euo pipefail
          node --check assets/lab/lab-directory-v2.js
          node --check assets/lab/lab-continuum-planner-contract-v1.js
          node --check assets/lab/lab-directory-planner-preview.js
          node --check assets/lab/lab-automations-directory-v4.js
          node --check assets/lab/lab-automations-audience-v4.js
          node --check assets/lab/lab-automations-intelligence-v4.js
          node --check assets/lab/lab-automations-input-routing-v4.js
          node --check tests/playwright-mobile-dump.cjs

          python - <<'PY'
          from pathlib import Path

          directory = Path('assets/lab/lab-directory-v2.js').read_text(encoding='utf-8')
          contract = Path('assets/lab/lab-continuum-planner-contract-v1.js').read_text(encoding='utf-8')
          planner = Path('assets/lab/lab-directory-planner-preview.js').read_text(encoding='utf-8')
          integration = Path('assets/lab/lab-automations-directory-v4.js').read_text(encoding='utf-8')
          audience = Path('assets/lab/lab-automations-audience-v4.js').read_text(encoding='utf-8')
          intelligence = Path('assets/lab/lab-automations-intelligence-v4.js').read_text(encoding='utf-8')
          inputs = Path('assets/lab/lab-automations-input-routing-v4.js').read_text(encoding='utf-8')
          focused = Path('automations/index.html').read_text(encoding='utf-8')
          standalone = Path('directory/index.html').read_text(encoding='utf-8')

          required = {
              'Directory v2': (directory, ['cmx-lab-crm-v1', 'resolveGroup', 'CONTACT READINESS', 'Automation usage']),
              'Planner contract': (contract, ['CMXContinuumPlannerContractV1', 'directory.upsert_group', 'automation.reference_audience']),
              'Directory Planner': (planner, ['TYPED CHANGE PLAN · PREVIEW', 'NO AI CALL · NO DATA MUTATION · NO ONLINE OBSERVATION · NO HIDDEN AUTHORITY']),
              'Automation Directory': (integration, ['DIRECTORY READINESS', 'Typed Audience available']),
              'Audience': (audience, ['audienceSelectors', 'Unique people', 'Overlapping People are counted once']),
              'Intelligence': (intelligence, ['audience.resolved_people_count', 'cmx-lab-automation-data-bindings-v1']),
              'Input routing': (inputs, ['cmx-lab-automation-input-bindings-v1', 'targetField']),
              'Automations HTML': (focused, ['<title>Continuum · Automations</title>', 'lab-automations-directory-v4.js', 'lab-automations-audience-v4.js']),
              'Directory HTML': (standalone, ['<title>Continuum · Directory</title>', '/automations/', '/control/']),
          }
          for label, (source, terms) in required.items():
              for term in terms:
                  if term not in source:
                      raise SystemExit(f'{label} missing: {term}')

          combined = directory + contract + planner + integration + audience + intelligence + inputs
          for forbidden in ['api.cmxchat.com', 'eval(', 'new Function(']:
              if forbidden in combined:
                  raise SystemExit(f'forbidden local Directory proof pattern: {forbidden}')

          if Path('lab').exists():
              raise SystemExit('retired top-level lab directory returned')
          print('Directory proof and canonical Automation integration source contracts passed.')
          PY

      - name: Browser smoke archived Directory proof and canonical Automations
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo 'No Chromium-compatible browser available.' >&2
            exit 1
          fi

          node - <<'NODE'
          const fs = require('node:fs');
          const { transformSnapshot } = require('./assets/lab/lab-loader.js');
          const source = fs.readFileSync('assets/lab/checkin-index-snapshot.html', 'utf8');
          fs.writeFileSync('directory-browser-smoke.html', transformSnapshot(source).replace('upgrade-insecure-requests', ''), 'utf8');
          NODE

          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/continuum-directory-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -f directory-browser-smoke.html' EXIT
          sleep 1

          node tests/playwright-mobile-dump.cjs \
            "$BROWSER" 390 844 \
            'http://127.0.0.1:8000/directory-browser-smoke.html' /tmp/directory-mobile.html \
            labDirectoryPlanner typed-v2 18000
          grep -q 'data-lab-directory="v2"' /tmp/directory-mobile.html
          grep -q 'data-lab-planner-contract="v1"' /tmp/directory-mobile.html
          grep -q 'data-lab-directory-planner="typed-v2"' /tmp/directory-mobile.html

          node tests/playwright-mobile-dump.cjs \
            "$BROWSER" 1280 900 \
            'http://127.0.0.1:8000/automations/' /tmp/automations-directory.html \
            labAutomationsDirectory v4 18000
          grep -q 'data-lab-automations-directory="v4"' /tmp/automations-directory.html
          grep -q 'data-lab-automations-audience="v4-1"' /tmp/automations-directory.html

          echo 'Directory proof and canonical /automations/ integration browser smoke passed.'
