name: Continuum Automations v6 Mobile Action Stack Validation

on:
  push:
    branches: [main]
    paths:
      - 'lab/automations/**'
      - 'assets/lab/lab-automations-action-stack-v6.js'
      - 'assets/lab/lab-automations-action-stack-v6.css'
      - 'assets/lab/lab-automations-experience-v3.js'
      - 'assets/lab/lab-automations-sequence-v4.js'
      - 'assets/lab/lab-automations-sequence-v4.css'
      - 'assets/lab/lab-automations-v5-mobile-qa.css'
      - 'tests/automations-v6-action-stack-probe.js'
      - '.github/workflows/automations-v6-action-stack-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lab/automations/**'
      - 'assets/lab/lab-automations-action-stack-v6.js'
      - 'assets/lab/lab-automations-action-stack-v6.css'
      - 'assets/lab/lab-automations-experience-v3.js'
      - 'assets/lab/lab-automations-sequence-v4.js'
      - 'assets/lab/lab-automations-sequence-v4.css'
      - 'assets/lab/lab-automations-v5-mobile-qa.css'
      - 'tests/automations-v6-action-stack-probe.js'
      - '.github/workflows/automations-v6-action-stack-validation.yml'

permissions:
  contents: read

jobs:
  mobile-action-stack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate v6 source contract
        run: |
          set -euo pipefail
          node --check assets/lab/lab-automations-action-stack-v6.js
          node --check tests/automations-v6-action-stack-probe.js

          python - <<'PY'
          from pathlib import Path

          js = Path('assets/lab/lab-automations-action-stack-v6.js').read_text(encoding='utf-8')
          css = Path('assets/lab/lab-automations-action-stack-v6.css').read_text(encoding='utf-8')
          html = Path('lab/automations/index.html').read_text(encoding='utf-8')

          for term in [
              'data-v6-action-toggle', 'data-v6-remove-step', 'data-v6-collapse-all',
              'labAutomationsActionStack = "v6-mobile"', 'Move step up', 'Duplicate step', 'Remove step'
          ]:
              if term not in js:
                  raise SystemExit(f'v6 action-stack JS missing contract: {term}')

          for term in [
              '.v6-action-stack-tools', '.v6-action-mobile-bar', '.v6-action-remove',
              '.v3-action-card.v6-action-card:not(.is-v6-expanded)',
              '.v44-line{display:none}', '@media (max-width:760px)'
          ]:
              if term not in css:
                  raise SystemExit(f'v6 action-stack CSS missing contract: {term}')

          if 'lab-automations-action-stack-v6.css?v=20260819-v6mobile1' not in html:
              raise SystemExit('focused route missing v6 action-stack CSS')
          if 'lab-automations-action-stack-v6.js?v=20260819-v6mobile1' not in html:
              raise SystemExit('focused route missing v6 action-stack JS')
          if html.index('lab-automations-action-stack-v6.css') > html.index('lab-automations-v5-mobile-qa.css'):
              raise SystemExit('final mobile QA must remain after v6 action-stack CSS')
          if html.index('lab-continuum-planner-review-v1.js') > html.index('lab-automations-action-stack-v6.js'):
              raise SystemExit('v6 action-stack JS should load after existing Planner/review layers')

          for forbidden in ['fetch(', 'XMLHttpRequest', 'WebSocket(', 'EventSource(', 'eval(', 'new Function(', 'MutationObserver']:
              if forbidden in js:
                  raise SystemExit(f'v6 action-stack must remain local/safe: {forbidden}')

          print('Automations v6 mobile action-stack source contract passed.')
          PY

      - name: Build mobile interaction page
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          html = Path('lab/automations/index.html').read_text(encoding='utf-8')
          probe = '<script src="/tests/automations-v6-action-stack-probe.js"></script>'
          Path('lab/automations/action-stack-mobile-qa.html').write_text(html.replace('</body>', f'{probe}\n</body>'), encoding='utf-8')
          PY

      - name: Exercise 360px and 390px action stack
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo 'No Chromium-compatible browser available.' >&2
            exit 1
          fi

          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/continuum-v6-action-stack-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -f lab/automations/action-stack-mobile-qa.html' EXIT
          sleep 1

          check_width() {
            local width="$1"
            local height="$2"
            local out="/tmp/action-stack-${width}.html"
            "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --window-size="${width},${height}" --virtual-time-budget=18000 --dump-dom \
              'http://127.0.0.1:8000/lab/automations/action-stack-mobile-qa.html' > "$out"

            grep -q 'data-qa-v6-action-stack="complete"' "$out"
            grep -q "data-qa-v6-viewport=\"${width}\"" "$out"
            grep -q 'data-qa-v6-loaded="true"' "$out"
            grep -q 'data-qa-v6-initial-one="true"' "$out"
            grep -q 'data-qa-v6-initial-expanded="true"' "$out"
            grep -q 'data-qa-v6-single-remove-disabled="true"' "$out"
            grep -q 'data-qa-v6-initial-tap-targets="true"' "$out"
            grep -q 'data-qa-v6-duplicated="true"' "$out"
            grep -q 'data-qa-v6-remove-enabled="true"' "$out"
            grep -q 'data-qa-v6-collapsed="true"' "$out"
            grep -q 'data-qa-v6-compact="true"' "$out"
            grep -q 'data-qa-v6-details-hidden="true"' "$out"
            grep -q 'data-qa-v6-accordion="true"' "$out"
            grep -q 'data-qa-v6-expanded-tap-targets="true"' "$out"
            grep -q 'data-qa-v6-removed="true"' "$out"
            grep -q 'data-qa-v6-final-remove-disabled="true"' "$out"
            grep -q 'data-qa-v6-horizontal-fit="true"' "$out"
          }

          check_width 360 800
          check_width 390 844
          echo 'Automations v6 compact action stack passed 360px and 390px interaction geometry.'
