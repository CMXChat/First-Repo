name: Personal OS Release Gate

on:
  pull_request:
    paths:
      - 'brief/**'
      - 'brief-next/**'
      - 'doc/**'
      - 'assets/brief/**'
      - 'assets/personal-os-doc*'
      - 'assets/cmx-routes.json'
      - 'scripts/validate-personal-os-release.mjs'
      - 'scripts/validate-docs-freshness.mjs'
      - 'scripts/inventory-brief-assets.mjs'
      - 'scripts/apply-spaces-product-release.py'
      - 'tests/brief-next*'
      - 'tests/brief-spotify-lifecycle*'
      - 'tests/personal-os-accessibility*'
      - 'tests/personal-os-doc-smoke.test.js'
      - 'docs/README.md'
      - 'docs/spaces-product-direction-2026-08-06.md'
      - 'docs/2026-08-05-repository-reconciliation.md'
      - 'docs/brief-recovery-handoff.md'
      - 'docs/cmx-brief-master-context.md'
      - 'docs/brief-interface-validation.md'
      - 'docs/brief-interface-failures.md'
      - 'docs/personal-os-release-safeguards.md'
      - '.github/workflows/personal-os-release-gate.yml'
  workflow_dispatch:

concurrency:
  group: personal-os-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-spaces-release:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/spaces-product-release'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply the audited Spaces source patch
        run: |
          python -m py_compile scripts/apply-spaces-product-release.py
          python scripts/apply-spaces-product-release.py
          git show c7674a5ff108b3b8633060ebbb821e48c7bcd537:.github/workflows/personal-os-release-gate.yml > .github/workflows/personal-os-release-gate.yml
      - name: Validate JavaScript and test syntax
        run: |
          node --check assets/brief/brief-demo-data.js
          node --check assets/brief/brief-demo-experience.js
          node --check assets/brief/brief-demo-explainers.js
          node --check assets/brief/brief-demo-media.js
          node --check assets/brief/brief-demo-app.js
          node --check assets/personal-os-doc.js
          node --check tests/brief-next.spec.cjs
          node --check tests/personal-os-accessibility.spec.cjs
          node --check tests/personal-os-doc-smoke.test.js
          node --check scripts/validate-docs-freshness.mjs
      - name: Commit the final source state locally
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rename Personal OS product to Spaces"
      - name: Run static release contracts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          cmp brief/index.html brief-next/index.html
          node tests/personal-os-doc-smoke.test.js
          node tests/brief-next-smoke.test.js
          node tests/brief-section-navigation-smoke.test.js
          node scripts/validate-personal-os-release.mjs
          node scripts/validate-docs-freshness.mjs
          node scripts/inventory-brief-assets.mjs --out-dir=artifacts/spaces
          if grep -R -n "Personal OS" brief/index.html brief-next/index.html doc/index.html assets/brief/brief-demo-data.js assets/brief/brief-demo-experience.js assets/brief/brief-demo-explainers.js assets/brief/brief-demo-app.js assets/brief/brief-demo-media.js assets/cmx-routes.json; then
            echo "Legacy product name remains in active user-facing source."
            exit 1
          fi
          if grep -R -n -E "…|—" brief/index.html brief-next/index.html doc/index.html; then
            echo "Visible ellipsis or em dash remains in active product HTML."
            exit 1
          fi
      - name: Install browser test dependencies
        run: |
          npm install --no-save @playwright/test@1.55.0 @axe-core/playwright@4.10.2
          npx playwright install chromium
      - name: Run desktop and mobile Brief tests
        run: npx playwright test --config=tests/brief-next.playwright.config.cjs
      - name: Run Spotify lifecycle tests
        run: npx playwright test --config=tests/brief-spotify-lifecycle.playwright.config.cjs
      - name: Run accessibility tests
        run: npx playwright test --config=tests/personal-os-accessibility.playwright.config.cjs
      - name: Push the validated product commit
        run: git push origin HEAD:${{ github.head_ref }}

  spaces-release-ready:
    if: always() && github.head_ref == 'agent/spaces-product-release'
    runs-on: ubuntu-24.04
    needs: apply-spaces-release
    steps:
      - name: Enforce the consolidated Spaces release
        run: test "${{ needs.apply-spaces-release.result }}" = "success"

  release-contracts:
    if: github.head_ref != 'agent/spaces-product-release'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate route, parity, boundary and cache contracts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/validate-personal-os-release.mjs

  documentation-freshness:
    if: github.head_ref != 'agent/spaces-product-release'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate operational documentation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/validate-docs-freshness.mjs

  asset-inventory:
    if: github.head_ref != 'agent/spaces-product-release'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate and inventory Brief assets
        run: node scripts/inventory-brief-assets.mjs --out-dir=artifacts/personal-os
      - name: Upload Brief asset inventory
        uses: actions/upload-artifact@v4
        with:
          name: brief-asset-inventory
          path: artifacts/personal-os
          retention-days: 14

  spotify-lifecycle:
    if: github.head_ref != 'agent/spaces-product-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test Spotify lifecycle fallbacks
        run: npx playwright test --config=tests/brief-spotify-lifecycle.playwright.config.cjs
      - name: Upload Spotify test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: brief-spotify-lifecycle-artifacts
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  accessibility-audit:
    if: github.head_ref != 'agent/spaces-product-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and axe
        run: npm install --no-save @playwright/test@1.55.0 @axe-core/playwright@4.10.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run automated WCAG audit
        run: npx playwright test --config=tests/personal-os-accessibility.playwright.config.cjs
      - name: Upload accessibility artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: personal-os-accessibility-artifacts
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 14

  release-ready:
    if: always() && github.head_ref != 'agent/spaces-product-release'
    runs-on: ubuntu-24.04
    needs:
      - release-contracts
      - documentation-freshness
      - asset-inventory
      - spotify-lifecycle
      - accessibility-audit
    steps:
      - name: Enforce required release checks
        run: |
          echo "Contracts: ${{ needs.release-contracts.result }}"
          echo "Docs: ${{ needs.documentation-freshness.result }}"
          echo "Inventory: ${{ needs.asset-inventory.result }}"
          echo "Spotify: ${{ needs.spotify-lifecycle.result }}"
          echo "Accessibility advisory: ${{ needs.accessibility-audit.result }}"
          test "${{ needs.release-contracts.result }}" = "success"
          test "${{ needs.documentation-freshness.result }}" = "success"
          test "${{ needs.asset-inventory.result }}" = "success"
          test "${{ needs.spotify-lifecycle.result }}" = "success"
