name: Trim Build Lab Static Controls

on:
  push:
    branches: [main]
    paths:
      - '.build-lab-cleanup-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove browser-only Build Lab features
        run: python scripts/trim_build_lab_static.py
      - name: Validate embedded JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('assets/cmx-build-lab.html').read_text(encoding='utf-8')
          match = re.search(r'<script>(.*)</script>', text, re.S)
          if not match:
              raise SystemExit('missing script')
          Path('/tmp/build-lab.js').write_text(match.group(1), encoding='utf-8')
          PY
          node --check /tmp/build-lab.js
      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo "No cleanup changes required."
            exit 0
          fi
          git config user.name "cmx-build-lab"
          git config user.email "actions@users.noreply.github.com"
          git add assets/cmx-build-lab.html
          git commit -m "Remove browser-only Build Lab features"
          git push
