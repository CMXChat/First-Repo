name: Fix Brief Tour Bubble Overflow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/brief-onboarding-chromium-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Cap tour bubble and update regression versions
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing marker: {label}')
              return text.replace(old, new, 1)

          path = Path('assets/brief/brief-onboarding.css')
          text = path.read_text()
          old = """  width: min(390px, calc(100vw - 24px));
  padding: 20px;
  border-radius: 24px;
  transform: translate3d(12px, 12px, 0);
  transition: transform .26s cubic-bezier(.2, .8, .2, 1);"""
          new = """  width: min(390px, calc(100vw - 24px));
  max-height: calc(var(--brief-device-height, 100dvh) - 20px);
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding: 20px;
  border-radius: 24px;
  transform: translate3d(12px, 12px, 0);
  transition: transform .26s cubic-bezier(.2, .8, .2, 1);"""
          text = replace_once(text, old, new, 'tour bubble height cap')
          text = replace_once(
              text,
              "  .brief-tour-bubble {\n    width: min(370px, calc(100vw - 16px));\n    padding: 18px;",
              "  .brief-tour-bubble {\n    width: min(370px, calc(100vw - 16px));\n    max-height: calc(var(--brief-device-height, 100dvh) - 16px);\n    padding: 18px;",
              'mobile tour cap'
          )
          text += """

.brief-tour-bubble footer {
  position: sticky;
  bottom: -20px;
  z-index: 2;
  padding: 12px 0 2px;
  background: linear-gradient(to top, rgba(7, 11, 18, .98) 68%, rgba(7, 11, 18, 0));
}

html[data-theme='light'] .brief-tour-bubble footer {
  background: linear-gradient(to top, rgba(248, 251, 255, .98) 68%, rgba(248, 251, 255, 0));
}

@supports not ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
  .brief-tour-bubble footer { background: linear-gradient(to top, #0b1019 68%, rgba(11,16,25,0)); }
  html[data-theme='light'] .brief-tour-bubble footer { background: linear-gradient(to top, #f7fbff 68%, rgba(247,251,255,0)); }
}
"""
          path.write_text(text)

          path = Path('assets/brief/brief-config.js')
          text = path.read_text()
          text = replace_once(text, "    onboarding: '20260803-2',", "    onboarding: '20260803-3',", 'onboarding version')
          path.write_text(text)

          path = Path('brief/index.html')
          text = path.read_text()
          text = replace_once(text, 'brief-config.js?v=20260803-14', 'brief-config.js?v=20260803-15', 'config version')
          path.write_text(text)

          path = Path('tests/brief-stability-smoke.test.js')
          text = path.read_text()
          text = replace_once(text, "device: '20260803-2'", "device: '20260803-3'", 'stability device version')
          path.write_text(text)

          path = Path('tests/brief-workspace-team-smoke.test.js')
          text = path.read_text()
          text = replace_once(text, 'brief-config\\.js\\?v=20260803-12', 'brief-config\\.js\\?v=20260803-15', 'workspace config version')
          path.write_text(text)

          path = Path('tests/brief-onboarding-smoke.test.js')
          text = path.read_text()
          marker = "assert.match(onboardingCss, /max-width: 390px/);"
          addition = marker + "\nassert.match(onboardingCss, /max-height: calc\\(var\\(--brief-device-height/);\nassert.match(onboardingCss, /overflow-y: auto/);\nassert.match(onboardingCss, /position: sticky/);"
          text = replace_once(text, marker, addition, 'onboarding overflow assertions')
          path.write_text(text)
          PY

      - name: Validate fixes
        run: |
          node --check assets/brief/brief-config.js
          node --check assets/brief/brief-onboarding.js
          node tests/brief-device-smoke.test.js
          node tests/brief-onboarding-smoke.test.js
          node tests/brief-stability-smoke.test.js
          node tests/brief-workspace-team-smoke.test.js

      - name: Commit Chromium and Android fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/brief/brief-onboarding.css assets/brief/brief-config.js brief/index.html tests/brief-stability-smoke.test.js tests/brief-workspace-team-smoke.test.js tests/brief-onboarding-smoke.test.js
          git commit -m 'Keep guided tour bubbles inside every viewport'
          git push
