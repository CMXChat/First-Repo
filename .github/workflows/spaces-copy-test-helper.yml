name: Spaces Copy Test Helper

on:
  push:
    branches:
      - agent/spaces-share-ready-final

permissions:
  contents: write

jobs:
  update-copy-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/spaces-share-ready-final
      - name: Align browser test with intentional copy
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/brief-next.spec.cjs')
          text = path.read_text()
          old = "toContainText('No message leaves this demo')"
          new = "toContainText('Nothing is sent')"
          if old not in text and new not in text:
              raise SystemExit('Expected alert-routing browser assertion not found')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit test update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/brief-next.spec.cjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Align alert routing copy regression"
          git push origin HEAD:agent/spaces-share-ready-final
