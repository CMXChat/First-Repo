name: Temporary Navigation Cleanup

on:
  push:
    branches:
      - agent/remove-root-directory-links
    paths:
      - '.cleanup-navigation-trigger'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/remove-root-directory-links

      - name: Remove root and Directory navigation links
        run: python scripts/remove_root_directory_links.py

      - name: Commit cleaned navigation
        run: |
          if git diff --quiet; then
            echo "No navigation changes were required."
            exit 0
          fi
          git config user.name "cmx-navigation-cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Remove root and Directory navigation links"
          git push origin HEAD:agent/remove-root-directory-links
