name: Continuum Automations Control v10 Validation

on:
  push:
    branches: [main]
    paths:
      - 'lab/automations/**'
      - 'assets/lab/lab-automations-control-v10.js'
      - 'assets/lab/lab-automations-control-v10.css'
      - 'assets/lab/lab-automations-history-v1.js'
      - 'tests/continuum-automations-control-v10.test.js'
      - 'docs/continuum-automations-control-surface-v10-CURRENT.md'
      - '.github/workflows/automations-v10-control-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lab/automations/**'
      - 'assets/lab/lab-automations-control-v10.js'
      - 'assets/lab/lab-automations-control-v10.css'
      - 'assets/lab/lab-automations-history-v1.js'
      - 'tests/continuum-automations-control-v10.test.js'
      - 'docs/continuum-automations-control-surface-v10-CURRENT.md'
      - '.github/workflows/automations-v10-control-validation.yml'

permissions:
  contents: read

jobs:
  validate-control-surface:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate source contracts
        run: |
          set -euo pipefail
          node --check assets/lab/lab-automations-control-v10.js
          node --check assets/lab/lab-automations-history-v1.js
          node tests/continuum-automations-control-v10.test.js

      - name: Render desktop and mobile control surfaces
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo 'No Chromium-compatible browser available.' >&2
            exit 1
          fi

          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/continuum-v10-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1

          dump() {
            "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=16000 "$@" --dump-dom
          }

          dump --window-size=1440,900 'http://127.0.0.1:8000/lab/automations/' > /tmp/v10-dashboard.html
          grep -q 'data-lab-automations-control="v10"' /tmp/v10-dashboard.html
          grep -q 'data-control-v10="ready"' /tmp/v10-dashboard.html
          grep -q 'v10-card-menu-button' /tmp/v10-dashboard.html
          grep -q 'Manage all' /tmp/v10-dashboard.html
          ! grep -qi 'Loading Automations' /tmp/v10-dashboard.html

          dump --window-size=1440,900 'http://127.0.0.1:8000/lab/automations/?new=1&from=lab' > /tmp/v10-editor.html
          grep -q 'data-lab-automations-control="v10"' /tmp/v10-editor.html
          grep -q 'data-control-v10="ready"' /tmp/v10-editor.html
          grep -q 'data-v10-view="definition"' /tmp/v10-editor.html
          grep -q 'v10-object-bar' /tmp/v10-editor.html
          grep -q 'data-v10-tab="overview"' /tmp/v10-editor.html
          grep -q 'data-v10-tab="definition"' /tmp/v10-editor.html
          grep -q 'data-v10-tab="runs"' /tmp/v10-editor.html
          grep -q 'data-v10-tab="permissions"' /tmp/v10-editor.html
          grep -q 'data-v10-tab="related"' /tmp/v10-editor.html
          grep -q 'data-v10-tab="history"' /tmp/v10-editor.html
          grep -q 'data-v10-tab="settings"' /tmp/v10-editor.html
          grep -q '>Automations<' /tmp/v10-editor.html
          ! grep -qi 'Loading Automations' /tmp/v10-editor.html

          dump --window-size=390,844 'http://127.0.0.1:8000/lab/automations/' > /tmp/v10-mobile-dashboard.html
          grep -q 'data-lab-automations-control="v10"' /tmp/v10-mobile-dashboard.html
          grep -q 'v10-card-menu-button' /tmp/v10-mobile-dashboard.html

          dump --window-size=390,844 'http://127.0.0.1:8000/lab/automations/?new=1&from=lab' > /tmp/v10-mobile-editor.html
          grep -q 'data-lab-automations-control="v10"' /tmp/v10-mobile-editor.html
          grep -q 'v10-object-bar' /tmp/v10-mobile-editor.html
          grep -q 'data-v10-tab="settings"' /tmp/v10-mobile-editor.html
          ! grep -qi 'Loading Automations' /tmp/v10-mobile-editor.html

          echo 'Automations v10 control surface rendered on desktop and mobile.'
