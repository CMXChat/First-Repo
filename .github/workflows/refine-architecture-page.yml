name: Refine Architecture Page
on:
  push:
    paths:
      - '.architecture-refine-trigger'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/refine_architecture_page.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add architecture/index.html
          git commit -m "Refine architecture page design and hero" || exit 0
          git push
