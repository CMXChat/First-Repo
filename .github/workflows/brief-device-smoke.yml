name: Brief Device and Interface Compatibility Tests

on:
  push:
    branches: [main]
    paths:
      - 'brief/**'
      - 'brief-next/**'
      - 'assets/brief/**'
      - 'assets/cmx-routes.json'
      - 'tests/brief-device-smoke.test.js'
      - 'tests/brief-next-smoke.test.js'
      - 'tests/brief-section-navigation-smoke.test.js'
      - '.github/workflows/brief-device-smoke.yml'
  pull_request:
    paths:
      - 'brief/**'
      - 'brief-next/**'
      - 'assets/brief/**'
      - 'assets/cmx-routes.json'
      - 'tests/brief-device-smoke.test.js'
      - 'tests/brief-next-smoke.test.js'
      - 'tests/brief-section-navigation-smoke.test.js'
      - '.github/workflows/brief-device-smoke.yml'

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run current Brief device and theme smoke test
        run: node tests/brief-device-smoke.test.js

      - name: Run current Brief interface smoke test
        run: node tests/brief-next-smoke.test.js

      - name: Run Brief section navigation smoke test
        run: node tests/brief-section-navigation-smoke.test.js
