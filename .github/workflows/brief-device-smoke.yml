name: Brief Device Smoke Test

on:
  push:
    branches: [main]
    paths:
      - 'brief/**'
      - 'assets/brief/**'
      - 'tests/brief-device-smoke.test.js'
      - '.github/workflows/brief-device-smoke.yml'
  pull_request:
    paths:
      - 'brief/**'
      - 'assets/brief/**'
      - 'tests/brief-device-smoke.test.js'
      - '.github/workflows/brief-device-smoke.yml'

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run briefing device smoke test
        run: node tests/brief-device-smoke.test.js
