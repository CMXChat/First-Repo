name: OSINT platform checks

on:
  pull_request:
    paths:
      - 'assets/**'
      - 'search/**'
      - 'osint/**'
      - 'phone/**'
      - 'metadata/**'
      - 'missing/**'
      - 'directory/**'
      - 'scripts/check-osint-platform.mjs'
      - '.github/workflows/osint-platform-checks.yml'
      - 'SECURITY.md'
      - 'docs/OSINT_PLATFORM_ROADMAP.md'
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'assets/**'
      - 'search/**'
      - 'osint/**'
      - 'phone/**'
      - 'metadata/**'
      - 'missing/**'
      - 'directory/**'
      - 'scripts/check-osint-platform.mjs'
      - '.github/workflows/osint-platform-checks.yml'

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate OSINT platform source
        run: node scripts/check-osint-platform.mjs
