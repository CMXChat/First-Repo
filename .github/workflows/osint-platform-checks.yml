name: OSINT platform checks

on:
  pull_request:
    paths:
      - 'assets/**'
      - 'search/**'
      - 'osint/**'
      - 'phone/**'
      - 'metadata/**'
      - 'missing/**'
      - 'directory/**'
      - 'backend/**'
      - '.dockerignore'
      - 'scripts/check-osint-platform.mjs'
      - '.github/workflows/osint-platform-checks.yml'
      - 'SECURITY.md'
      - 'docs/OSINT_PLATFORM_ROADMAP.md'
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'assets/**'
      - 'search/**'
      - 'osint/**'
      - 'phone/**'
      - 'metadata/**'
      - 'missing/**'
      - 'directory/**'
      - 'backend/**'
      - '.dockerignore'
      - 'scripts/check-osint-platform.mjs'
      - '.github/workflows/osint-platform-checks.yml'

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate OSINT platform source
        run: node scripts/check-osint-platform.mjs

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Compile backend package
        working-directory: backend
        run: python -m compileall -q app

      - name: Run backend tests
        working-directory: backend
        run: pytest

      - name: Exercise Alembic upgrade and downgrade
        working-directory: backend
        env:
          CMX_DATABASE_URL: sqlite+pysqlite:///./migration-test.db
          CMX_DATABASE_AUTO_CREATE: 'false'
        run: |
          alembic upgrade head
          alembic current
          alembic downgrade base
          rm -f migration-test.db

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build FastAPI container
        run: docker build --file backend/Dockerfile --tag cmx-restricted-node:test .

      - name: Validate Compose configuration
        run: |
          cp backend/.env.example backend/.env
          docker compose --env-file backend/.env --file backend/compose.yml config >/dev/null
