name: Check In Directory Library Validation

on:
  push:
    branches: [main]
    paths:
      - 'assets/lab/lab-automations-audience-runtime.js'
      - 'assets/lab/lab-automations-audience-review.js'
      - 'assets/lab/lab-automations-audience.css'
      - 'assets/lab/lab-automations-library-runtime.js'
      - 'assets/lab/lab-automations-library.css'
      - 'assets/lab/lab-automations-library-pro.js'
      - 'assets/lab/lab-automations-library-pro.css'
      - 'assets/lab/lab-automations-library-pro-polish.js'
      - 'assets/lab/lab-automations-library-pro-polish.css'
      - 'assets/lab/lab-automations-library-mobile-fix.js'
      - 'assets/lab/lab-automations-library-mobile-fix.css'
      - 'assets/lab/lab-automations-library-premium.js'
      - 'assets/lab/lab-automations-library-premium.css'
      - 'assets/lab/lab-automations-editor-learning.js'
      - 'assets/lab/lab-automations-editor-learning.css'
      - 'assets/lab/lab-automations-document-security.js'
      - 'docs/checkin-directory-library-CURRENT.md'
      - 'docs/checkin-library-premium-CURRENT.md'
      - '.github/workflows/checkin-directory-library-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'assets/lab/lab-automations-audience-runtime.js'
      - 'assets/lab/lab-automations-audience-review.js'
      - 'assets/lab/lab-automations-audience.css'
      - 'assets/lab/lab-automations-library-runtime.js'
      - 'assets/lab/lab-automations-library.css'
      - 'assets/lab/lab-automations-library-pro.js'
      - 'assets/lab/lab-automations-library-pro.css'
      - 'assets/lab/lab-automations-library-pro-polish.js'
      - 'assets/lab/lab-automations-library-pro-polish.css'
      - 'assets/lab/lab-automations-library-mobile-fix.js'
      - 'assets/lab/lab-automations-library-mobile-fix.css'
      - 'assets/lab/lab-automations-library-premium.js'
      - 'assets/lab/lab-automations-library-premium.css'
      - 'assets/lab/lab-automations-editor-learning.js'
      - 'assets/lab/lab-automations-editor-learning.css'
      - 'assets/lab/lab-automations-document-security.js'
      - 'docs/checkin-directory-library-CURRENT.md'
      - 'docs/checkin-library-premium-CURRENT.md'
      - '.github/workflows/checkin-directory-library-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate retained Directory and Library modules
        run: |
          set -euo pipefail
          node --check assets/lab/lab-automations-audience-runtime.js
          node --check assets/lab/lab-automations-audience-review.js
          node --check assets/lab/lab-automations-library-runtime.js
          node --check assets/lab/lab-automations-library-pro.js
          node --check assets/lab/lab-automations-library-pro-polish.js
          node --check assets/lab/lab-automations-library-mobile-fix.js
          node --check assets/lab/lab-automations-library-premium.js
          node --check assets/lab/lab-automations-editor-learning.js
          node --check assets/lab/lab-automations-document-security.js
          python - <<'PY'
          from pathlib import Path
          import sys

          audience = Path('assets/lab/lab-automations-audience-runtime.js').read_text(encoding='utf-8')
          audience_review = Path('assets/lab/lab-automations-audience-review.js').read_text(encoding='utf-8')
          audience_css = Path('assets/lab/lab-automations-audience.css').read_text(encoding='utf-8')
          library = Path('assets/lab/lab-automations-library-runtime.js').read_text(encoding='utf-8')
          library_css = Path('assets/lab/lab-automations-library.css').read_text(encoding='utf-8')
          pro = Path('assets/lab/lab-automations-library-pro.js').read_text(encoding='utf-8')
          pro_css = Path('assets/lab/lab-automations-library-pro.css').read_text(encoding='utf-8')
          polish = Path('assets/lab/lab-automations-library-pro-polish.js').read_text(encoding='utf-8')
          polish_css = Path('assets/lab/lab-automations-library-pro-polish.css').read_text(encoding='utf-8')
          mobile_fix = Path('assets/lab/lab-automations-library-mobile-fix.js').read_text(encoding='utf-8')
          mobile_fix_css = Path('assets/lab/lab-automations-library-mobile-fix.css').read_text(encoding='utf-8')
          premium = Path('assets/lab/lab-automations-library-premium.js').read_text(encoding='utf-8')
          premium_css = Path('assets/lab/lab-automations-library-premium.css').read_text(encoding='utf-8')
          learning = Path('assets/lab/lab-automations-editor-learning.js').read_text(encoding='utf-8')
          learning_css = Path('assets/lab/lab-automations-editor-learning.css').read_text(encoding='utf-8')
          security = Path('assets/lab/lab-automations-document-security.js').read_text(encoding='utf-8')
          handoff = Path('docs/checkin-directory-library-CURRENT.md').read_text(encoding='utf-8')
          premium_handoff = Path('docs/checkin-library-premium-CURRENT.md').read_text(encoding='utf-8')

          required_audience = [
              'organizationIds', 'labels', 'groups', 'Create custom group', 'Create custom label',
              'Person, organization, group, or label', 'email-ready', 'phone-ready',
              'resolutionMode:"live"', 'Duplicate people are automatically counted once',
              'data-person-org', 'data-person-label', 'data-group-member',
          ]
          required_audience_review = ['AUDIENCE','${people.size} unique','cmx-lab-audience-last-steps-v1']
          required_library = [
              'Documents & files', 'New document', 'Native Check In Document', 'Save version',
              'Save as', 'PDF', 'Word DOCX', 'Markdown', 'HTML', 'Plain text',
              'linkedDocuments', 'fileVersionId', 'used by', 'cmx-lab-content-assets-v1',
              'cmx-lab-file-assets-v1',
          ]
          required_pro = [
              'cmx-lab-library-meta-v1', 'Continuity', 'Templates', 'New folder',
              'Markdown file', 'Text file', 'Email template', 'Message template', 'Document template',
              'ai-context-notes.md', 'MARKDOWN SOURCE', 'SAFE PREVIEW', 'Save version',
              'Import as editable Markdown', 'templateSource', '{{recipient_name}}',
              'Rename item', 'Move', 'Duplicate', 'Archive', 'AI READY',
          ]
          required_polish = ['Folder is not empty', 'Restore', 'Replace current draft?', 'Apply link', 'production backend will never silently orphan']
          required_mobile_fix = ['__automation_internal__', 'LIBRARY_KINDS', 'dedupeFiles', 'dedupeFolders', 'A folder with this name already exists here.', 'Documents', 'pro-create-close', 'libraryVisible', 'fileVersionId']
          required_premium = ['cmx-lab-library-ui-v1', 'Recent', 'Favorites', 'premium-grid-view', 'Sort ·', 'Save to Library', 'Save as Template', 'Save as Document', 'libraryRole', 'saved_action_content', 'premium-action-sheet', 'Export / Save as', 'Replace with new version', 'Your private documents, templates and files.']
          required_learning = ['Bold','Heading 2','Bulleted list','Insert link','editor-learning-tip','data-pro-command','data-md-insert','is-learning-flash']
          required_security = ['ALLOWED', 'BLOCKED', 'safeHref', 'data-document-body', 'text/html']
          required_css = [
              '.audience-manager-overlay','.audience-target-card','.library-overlay','.document-editor-overlay',
              '.library-pro-overlay','.pro-create-grid','.pro-source-layout','.pro-md-toolbar',
              '.content-template-shortcut','.template-picker-overlay','.pro-link-panel',
              '.pro-create-close','.library-pro-overlay.is-nested .pro-stats',
              '.premium-library-controls','.premium-card-controls','.premium-action-sheet','.premium-reuse-card',
              '.content-toolbar','.editor-learning-tip','44px',
          ]
          required_handoff = ['Person ↔ Organization','Groups = saved audiences','Native Markdown','Templates are now a first-class Library type','cmx-lab-library-meta-v1','Import as editable Markdown','LIBRARY-FOLDERS-TEMPLATES-MARKDOWN-BACKEND-HANDOFF.md']
          required_premium_handoff = ['Library is **not** the ContentAsset database table', 'Save to Library', 'Save as Template', 'Save as Document', 'Favorites', 'Recent', 'list view', 'grid view', 'first real backend vertical slice']

          for term in required_audience:
              if term not in audience: sys.exit(f'missing audience contract: {term}')
          for term in required_audience_review:
              if term not in audience_review: sys.exit(f'missing audience Review bridge: {term}')
          for term in required_library:
              if term not in library: sys.exit(f'missing Library contract: {term}')
          for term in required_pro:
              if term not in pro: sys.exit(f'missing advanced Library contract: {term}')
          for term in required_polish:
              if term not in polish: sys.exit(f'missing advanced Library polish: {term}')
          for term in required_mobile_fix:
              if term not in mobile_fix: sys.exit(f'missing mobile Library cleanup: {term}')
          for term in required_premium:
              if term not in premium: sys.exit(f'missing premium Library contract: {term}')
          for term in required_learning:
              if term not in learning + learning_css + premium_css: sys.exit(f'missing editor-learning contract: {term}')
          for term in required_security:
              if term not in security: sys.exit(f'missing document-security contract: {term}')
          for term in required_css:
              if term not in audience_css + library_css + pro_css + polish_css + mobile_fix_css + premium_css + learning_css: sys.exit(f'missing retained UX CSS: {term}')
          for term in required_handoff:
              if term not in handoff: sys.exit(f'missing Directory/Library handoff: {term}')
          for term in required_premium_handoff:
              if term not in premium_handoff: sys.exit(f'missing premium Library handoff: {term}')

          combined = audience + audience_review + library + pro + polish + mobile_fix + premium + learning + security
          for term in ['api.cmxchat.com','eval(','new Function(','MutationObserver','localStorage.setItem("operator','blob:','data:application/']:
              if term in combined: sys.exit(f'forbidden retained Lab behavior: {term}')

          print('Retained Directory, Audience and Library design-module contracts passed; active Automations v3 route is validated separately.')
          PY
