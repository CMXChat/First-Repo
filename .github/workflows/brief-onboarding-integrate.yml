name: Integrate Brief Onboarding

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/brief-onboarding-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Wire onboarding assets and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing marker: {label}')
              return text.replace(old, new, 1)

          path = Path('assets/brief/brief-config.js')
          text = path.read_text()
          text = replace_once(text, "    device: '20260803-2',", "    device: '20260803-3',\n    onboarding: '20260803-1',", 'device and onboarding versions')
          text = replace_once(
              text,
              "  loadStyle('briefDeviceStyle', `/assets/brief/brief-device.css?v=${build.device}`);",
              "  loadStyle('briefDeviceStyle', `/assets/brief/brief-device.css?v=${build.device}`);\n  loadStyle('briefOnboardingStyle', `/assets/brief/brief-onboarding.css?v=${build.onboarding}`);",
              'onboarding stylesheet'
          )
          text = replace_once(
              text,
              "  loadScript('briefEntryRadioScript', `/assets/brief/brief-entry-radio.js?v=${build.entry}`);\n\n  loadScript('briefDailyVideoScript', `/assets/daily-video.js?v=${build.watch}`, () => {",
              "  loadScript('briefEntryRadioScript', `/assets/brief/brief-entry-radio.js?v=${build.entry}`);\n\n  loadScript('briefOnboardingScript', `/assets/brief/brief-onboarding.js?v=${build.onboarding}`, () => {\n  loadScript('briefDailyVideoScript', `/assets/daily-video.js?v=${build.watch}`, () => {",
              'onboarding script wrapper'
          )
          text = replace_once(text, "  });\n})();\n", "  });\n  });\n})();\n", 'onboarding wrapper close')
          path.write_text(text)

          path = Path('brief/index.html')
          text = path.read_text()
          text = replace_once(text, 'brief-config.js?v=20260803-12', 'brief-config.js?v=20260803-13', 'config cache version')
          path.write_text(text)

          path = Path('.github/workflows/brief-device-smoke.yml')
          text = path.read_text()
          text = text.replace("name: Brief Device, Terminal, Media, Stability, Workspace and Polish Tests", "name: Brief Device, Onboarding, Terminal, Media, Stability, Workspace and Polish Tests")
          text = text.replace("      - 'tests/brief-polish-smoke.test.js'", "      - 'tests/brief-polish-smoke.test.js'\n      - 'tests/brief-onboarding-smoke.test.js'", 1)
          second = text.find("      - 'tests/brief-polish-smoke.test.js'", text.find("pull_request:"))
          if second == -1:
              raise SystemExit('missing pull request polish path')
          end = second + len("      - 'tests/brief-polish-smoke.test.js'")
          text = text[:end] + "\n      - 'tests/brief-onboarding-smoke.test.js'" + text[end:]
          text += "\n      - name: Run onboarding and browser compatibility smoke test\n        run: node tests/brief-onboarding-smoke.test.js\n"
          path.write_text(text)
          PY

      - name: Validate integrated files
        run: |
          node --check assets/brief/brief-config.js
          node --check assets/brief/brief-device.js
          node --check assets/brief/brief-onboarding.js
          node tests/brief-onboarding-smoke.test.js

      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/brief/brief-config.js brief/index.html .github/workflows/brief-device-smoke.yml
          git commit -m 'Wire glass onboarding and browser compatibility tests'
          git push
