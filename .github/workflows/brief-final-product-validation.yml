name: Brief Final Product Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/brief-final-product-validation.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bump final bridge cache in checked-out page
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('brief/index.html')
          text = path.read_text()
          if 'brief-terminal-bridge.js?v=20260803-8' in text:
              text = text.replace('brief-terminal-bridge.js?v=20260803-8', 'brief-terminal-bridge.js?v=20260803-9', 1)
          elif 'brief-terminal-bridge.js?v=20260803-9' not in text:
              raise SystemExit('expected bridge cache marker not found')
          path.write_text(text)
          PY

      - name: Run source regression suites
        id: static
        continue-on-error: true
        run: |
          set +e
          : > /tmp/static.log
          failures=0
          for test_file in \
            tests/brief-device-smoke.test.js \
            tests/brief-onboarding-smoke.test.js \
            tests/brief-navigation-smoke.test.js \
            tests/brief-theme-map-smoke.test.js \
            tests/brief-finalization-smoke.test.js \
            tests/brief-terminal-smoke.test.js \
            tests/brief-entry-watch-smoke.test.js \
            tests/brief-stability-smoke.test.js \
            tests/brief-workspace-team-smoke.test.js \
            tests/brief-polish-smoke.test.js; do
            echo "=== $test_file ===" | tee -a /tmp/static.log
            node "$test_file" 2>&1 | tee -a /tmp/static.log
            status=${PIPESTATUS[0]}
            echo "status=$status" | tee -a /tmp/static.log
            if [ "$status" -ne 0 ]; then failures=$((failures + 1)); fi
          done
          echo "failures=$failures" | tee -a /tmp/static.log
          echo "failures=$failures" >> "$GITHUB_OUTPUT"

      - name: Install Playwright
        id: install
        continue-on-error: true
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium firefox webkit

      - name: Run browser and device matrix
        id: browsers
        continue-on-error: true
        run: |
          set +e
          npx playwright test --config=tests/playwright.config.cjs 2>&1 | tee /tmp/browser.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record exact result and cache bump
        if: always()
        run: |
          {
            echo '# Brief final product validation'
            echo
            echo "Validated commit: \`$GITHUB_SHA\`"
            echo
            echo '## Coverage'
            echo
            echo '- Ten source-level regression suites'
            echo '- Chromium desktop'
            echo '- Firefox desktop'
            echo '- WebKit desktop'
            echo '- WebKit iPhone 13 emulation'
            echo '- Chromium Pixel 5 emulation'
            echo '- Entry, Quick and Full workspace'
            echo '- Optional Map without forced drawer opening'
            echo '- Help center and control tour'
            echo '- Six-scene product Vision walkthrough'
            echo '- Light and dark themes, safe areas, landscape and reduced motion'
            echo
            echo '## Result'
            echo
            echo "Static failures: ${{ steps.static.outputs.failures || 'unknown' }}"
            echo "Browser status: ${{ steps.browsers.outputs.status || 'not-run' }}"
            echo "Install outcome: ${{ steps.install.outcome }}"
            echo
            echo '## Static log'
            echo
            echo '```text'
            cat /tmp/static.log 2>/dev/null || true
            echo '```'
            echo
            echo '## Browser log'
            echo
            echo '```text'
            cat /tmp/browser.log 2>/dev/null || true
            echo '```'
          } > docs/brief-final-product-validation.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add brief/index.html docs/brief-final-product-validation.md
          git commit -m 'Record final briefing product validation'
          git push

      - name: Fail on any regression
        if: always()
        run: |
          test "${{ steps.static.outputs.failures }}" = "0"
          test "${{ steps.install.outcome }}" = "success"
          test "${{ steps.browsers.outputs.status }}" = "0"

# Triggered after final navigation and Vision integration.