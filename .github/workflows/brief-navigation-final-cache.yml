name: Final Brief Navigation Cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/brief-navigation-final-cache.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Bump navigation assets and bridge
        run: |
          python - <<'PY'
          from pathlib import Path

          bridge = Path('assets/brief/brief-terminal-bridge.js')
          text = bridge.read_text()
          target = "const NAVIGATION_VERSION = '20260803-4';"
          if target not in text:
              changed = False
              for version in ('20260803-2', '20260803-3'):
                  old = f"const NAVIGATION_VERSION = '{version}';"
                  if old in text:
                      text = text.replace(old, target, 1)
                      changed = True
                      break
              if not changed:
                  raise SystemExit('navigation version marker not found')
          bridge.write_text(text)

          index = Path('brief/index.html')
          text = index.read_text()
          target = 'brief-terminal-bridge.js?v=20260803-8'
          if target not in text:
              changed = False
              for version in ('20260803-6', '20260803-7'):
                  old = f'brief-terminal-bridge.js?v={version}'
                  if old in text:
                      text = text.replace(old, target, 1)
                      changed = True
                      break
              if not changed:
                  raise SystemExit('bridge cache marker not found')
          index.write_text(text)
          PY
      - name: Validate and commit
        run: |
          node --check assets/brief/brief-terminal-bridge.js
          node --check assets/brief/brief-navigation.js
          node --check assets/brief/brief-navigation-runtime.js
          node tests/brief-navigation-smoke.test.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/brief/brief-terminal-bridge.js brief/index.html
          git commit -m 'Bump final interconnected navigation cache' || exit 0
          git push

# Final URLs include drawer-release and safe-area offset fixes.